<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Pourcentage XP</title>
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pourcentage XP">
<link id="appicon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F6F5C'/%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='38' font-weight='800' fill='%23fff' text-anchor='middle'%3E%25%3C/text%3E%3C/svg%3E">
<link id="manifest" rel="manifest" href="">
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F6F5C'/%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='38' font-weight='800' fill='%23fff' text-anchor='middle'%3E%25%3C/text%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════════════════════
   POURCENT XP v2
   Toutes les couleurs dérivent des variables ci-dessous, réécrites
   à chaud par le menu Apparence. Aucune couleur en dur ailleurs.
   ══════════════════════════════════════════════════════════════ */
:root{
  --c-primary:#1F6F5C; --c-accent:#FFC021; --c-bg:#EEF1EC;
  --c-surface:#FFFFFF; --c-ink:#14211D; --c-ok:#1B8A55; --c-err:#C7453B;

  --ink-soft:color-mix(in srgb,var(--c-ink) 78%,var(--c-bg));
  --ink-faint:color-mix(in srgb,var(--c-ink) 50%,var(--c-bg));
  --line:color-mix(in srgb,var(--c-ink) 13%,var(--c-bg));
  --line-2:color-mix(in srgb,var(--c-ink) 24%,var(--c-bg));
  --tint:color-mix(in srgb,var(--c-primary) 10%,var(--c-surface));
  --tint-2:color-mix(in srgb,var(--c-accent) 24%,var(--c-surface));
  --c-corr:#7C3AED;
  --corr-tint:color-mix(in srgb,var(--c-corr) 9%,var(--c-surface));
  --corr-line:color-mix(in srgb,var(--c-corr) 42%,var(--c-surface));
  --ombre:0 1px 2px color-mix(in srgb,var(--c-ink) 6%,transparent),0 8px 24px -12px color-mix(in srgb,var(--c-ink) 22%,transparent);
  --ok-tint:color-mix(in srgb,var(--c-ok) 13%,var(--c-surface));
  --err-tint:color-mix(in srgb,var(--c-err) 11%,var(--c-surface));

  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --font:var(--ui); --fs:18px;
  --r:20px; --r-s:13px;
  --wrap:720px; --tap:52px;
  --sheet:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--c-bg);color:var(--c-ink);
  font-family:var(--font);font-size:var(--fs);line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:800}
h1{font-size:1.85rem;color:var(--c-primary)} h2{font-size:1.35rem;color:var(--c-primary)} h3{font-size:1.1rem;font-weight:800}
p{margin:0 0 .7em} p:last-child{margin-bottom:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft)} .tiny{font-size:.9rem;line-height:1.45} .center{text-align:center}
.hl{font-weight:800;color:var(--c-primary);white-space:nowrap}
.verdict .hl,.concl .hl,#sheet.ko .hl{color:inherit}
.hide{display:none !important}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ══ Barre du haut ═══════════════════════════════════════════ */
#top{
  position:sticky;top:0;z-index:40;color:#fff;
  background:linear-gradient(120deg,var(--c-primary),color-mix(in srgb,var(--c-primary) 74%,var(--c-ink)));
  box-shadow:0 6px 20px -14px color-mix(in srgb,var(--c-ink) 90%,transparent);
  border-bottom:1px solid color-mix(in srgb,#000 18%,transparent);
  padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right));
}
#top .inner{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--c-accent);
  color:var(--c-ink);display:grid;place-items:center;font-size:18px;font-weight:800;overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:.92rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:.74rem;color:color-mix(in srgb,#fff 82%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .iconbtn{background:color-mix(in srgb,#000 20%,transparent);color:#fff}
#top .iconbtn:hover{background:color-mix(in srgb,#000 32%,transparent)}
.iconbtn{
  width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;
  font-size:18px;background:var(--tint);
}
.iconbtn:hover{background:var(--line)}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:800;font-size:.9rem}
#top .stat{background:color-mix(in srgb,#000 18%,transparent);border-radius:99px;padding:5px 11px}
.stat.hearts{color:#fff} .stat.streak{color:var(--c-accent)} .stat.xp{color:#fff}
.stat{font-size:1rem}
.stat.streak{color:var(--c-ink);background:var(--tint-2);border-radius:99px;padding:4px 11px}
.stat.mult{background:var(--c-accent);color:var(--c-ink);border-radius:99px;padding:4px 11px;font-size:1.02rem}

/* barre de progression de leçon */
.pbar{flex:1;height:14px;border-radius:99px;background:color-mix(in srgb,#000 26%,transparent);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--c-accent);width:0;border-radius:99px;transition:width .35s cubic-bezier(.2,.9,.3,1)}
.pbar.warn i{background:var(--c-accent)}

/* ══ Corps ═══════════════════════════════════════════════════ */
main{
  max-width:var(--wrap);margin:0 auto;
  padding:18px max(14px,env(safe-area-inset-left)) calc(28px + var(--sheet) + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right));
}
.card{background:var(--c-surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--ombre)}
.card.flat{padding:14px}
.band{background:var(--tint);border-radius:var(--r);padding:14px 16px}
.chip{
  font-family:var(--mono);font-size:.95rem;font-weight:700;background:var(--c-surface);
  border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap;
}
.chip.hot{background:var(--tint-2);border-color:var(--c-accent)}
.chip.danger{background:var(--err-tint);border-color:var(--c-err)}

/* données chiffrées mises en avant */
.k{color:var(--c-primary);font-weight:800}
.ticket .data .k{color:inherit}
#sheet.ok .k{color:var(--c-ok)} #sheet.ko .k{color:var(--c-err)}

/* ══ Boutons ═════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:12px 22px;border-radius:var(--r-s);
  background:var(--c-primary);color:#fff;font-weight:700;letter-spacing:.01em;
  box-shadow:0 2px 0 color-mix(in srgb,var(--c-primary) 68%,var(--c-ink)),var(--ombre);
  transition:transform .08s,box-shadow .08s,filter .15s;
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--c-ink);border:2px solid var(--line-2);box-shadow:none}
.btn.ghost:active{transform:none}
.btn.ghost:hover{border-color:var(--c-primary)}
.btn.ok{background:var(--c-ok);box-shadow:0 2px 0 color-mix(in srgb,var(--c-ok) 68%,var(--c-ink)),var(--ombre)}
.btn.accent{background:var(--c-accent);color:var(--c-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--c-accent) 55%,var(--c-ink))}
.btn.danger{background:var(--c-err);box-shadow:0 3px 0 color-mix(in srgb,var(--c-err) 60%,var(--c-ink))}
.btn.small{min-height:40px;padding:8px 14px;font-size:.88rem;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none;box-shadow:none}

/* ══ Parcours ════════════════════════════════════════════════ */
.unit{
  --u:var(--c-primary);
  margin:0 auto 30px;max-width:900px;padding:18px 18px 24px;
  background:color-mix(in srgb,var(--u) 7%,var(--c-surface));
  border:2px solid color-mix(in srgb,var(--u) 22%,var(--c-surface));
  border-radius:28px;box-shadow:var(--ombre);
}
.unit.lock{background:var(--c-bg);border-color:var(--line)}
.unit.done{border-color:color-mix(in srgb,var(--u) 55%,var(--c-surface))}
.unit-head{
  display:flex;align-items:center;gap:14px;color:#fff;width:100%;text-align:left;
  background:linear-gradient(135deg,var(--u),color-mix(in srgb,var(--u) 62%,var(--c-ink)));
  box-shadow:0 6px 18px -10px color-mix(in srgb,var(--u) 90%,transparent);
  border-radius:20px;padding:18px 20px;margin-bottom:22px;
}
.unit-head .n{font-family:var(--mono);font-weight:800;background:color-mix(in srgb,#000 22%,transparent);border-radius:10px;padding:8px 12px;font-size:1.05rem}
.unit-head b{display:block;font-size:1.3rem;letter-spacing:-.01em}
.unit-head small{display:block;opacity:.9;font-size:.92rem;margin-top:2px}
.unit-head .crowns{font-family:var(--mono);font-weight:800;font-size:1.05rem;background:color-mix(in srgb,#000 22%,transparent);border-radius:10px;padding:8px 12px}
.unit.done .unit-head{background:var(--c-ok)}
.unit.lock .unit-head{background:var(--line-2);color:var(--ink-soft);box-shadow:none}
.unit-head .crowns{background:color-mix(in srgb,#000 22%,transparent);border-radius:99px;padding:6px 12px}

.path{display:flex;flex-direction:column;align-items:center;gap:0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.node .link{width:6px;height:26px;background:var(--line-2);border-radius:3px}
.node.ok .link{background:color-mix(in srgb,var(--u,var(--c-ok)) 60%,var(--c-bg))}
.path .node.ok .bubble{background:var(--u,var(--c-ok));box-shadow:0 6px 0 color-mix(in srgb,var(--u,var(--c-ok)) 60%,var(--c-ink))}
.node .bubble{
  width:104px;height:92px;border-radius:32px;display:grid;place-items:center;
  background:var(--line);color:var(--ink-faint);font-size:46px;
  box-shadow:0 5px 0 var(--line-2);transition:transform .1s;
}
.node .bubble:active{transform:translateY(4px)}
.node.open .bubble{background:var(--c-accent);color:var(--c-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--c-accent) 55%,var(--c-ink))}
.node.ok .bubble{background:var(--c-ok);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c-ok) 55%,var(--c-ink))}
.node .lab{font-size:.98rem;font-weight:700;margin-top:8px;text-align:center;max-width:230px}
.node .crown{font-size:.95rem;color:var(--c-accent);font-weight:800;letter-spacing:1px}
.node.lock .lab{color:var(--ink-faint)}
.node .side{position:absolute;top:14px;font-size:.72rem;color:var(--ink-soft);max-width:34%}

/* barre des unités */
.ubar{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:64px;z-index:30;
  background:color-mix(in srgb,var(--c-bg) 90%,transparent);backdrop-filter:blur(8px);
  padding:8px 0;margin:-6px 0 4px;border-radius:12px}
.upuce{--u:var(--c-primary);display:flex;flex-direction:column;align-items:center;min-width:52px;
  padding:6px 8px;border-radius:12px;border:2px solid color-mix(in srgb,var(--u) 40%,var(--c-surface));
  background:var(--c-surface);font-size:.85rem;line-height:1.1}
.upuce b{font-family:var(--mono);color:var(--u)}
.upuce small{font-size:.72rem;color:var(--ink-soft);font-family:var(--mono)}
.upuce.ouv{background:color-mix(in srgb,var(--u) 12%,var(--c-surface))}
.upuce.fini{background:var(--u);border-color:var(--u)} .upuce.fini b,.upuce.fini small{color:#fff}
.upuce.ferme{opacity:.5}
.upuce.cour{box-shadow:0 0 0 3px color-mix(in srgb,var(--u) 45%,transparent)}
.unit.courante{box-shadow:0 0 0 3px color-mix(in srgb,var(--u) 30%,transparent),var(--ombre)}

/* parcours horizontal en serpentin (hors téléphone) */
.serpent{display:flex;flex-direction:column;gap:4px;padding:4px 0;overflow-x:auto}
.srow{display:flex;align-items:flex-start;justify-content:center;gap:4px}
.srow.rev{flex-direction:row-reverse}
.srow .node{width:auto;flex:0 1 auto;max-width:134px;min-width:0}
.serpent .node .bubble{width:98px;height:88px;font-size:42px;border-radius:30px;box-shadow:0 6px 0 var(--line-2)}
.serpent .node.open .bubble{box-shadow:0 5px 0 color-mix(in srgb,var(--c-accent) 55%,var(--c-ink))}
.serpent .node.ok .bubble{box-shadow:0 5px 0 color-mix(in srgb,var(--c-ok) 55%,var(--c-ink))}
.serpent .node .lab{font-size:.92rem;max-width:134px;margin-top:8px}
.serpent .node.open .bubble{background:var(--c-accent)}
.serpent .node.ok .bubble{background:var(--u,var(--c-ok));color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--u,var(--c-ok)) 60%,var(--c-ink))}
.srow .fl{font-size:30px;font-weight:800;color:color-mix(in srgb,var(--u) 55%,var(--c-bg));margin-top:26px;flex:0 0 auto;line-height:1}
.sdown{display:flex;padding:2px 0}
.sdown.droite{justify-content:flex-end;padding-right:58px}
.sdown.gauche{justify-content:flex-start;padding-left:58px}
.vfl{position:relative;display:block;width:5px;height:38px;border-radius:3px;
  background:color-mix(in srgb,var(--u) 55%,var(--c-bg))}
.vfl::after{
  content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:color-mix(in srgb,var(--u) 55%,var(--c-bg));
}

/* anneau objectif du jour */
.goal{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:0 0 64px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:.82rem;font-weight:800}

/* ══ Leçon ═══════════════════════════════════════════════════ */
.lesson{display:grid;gap:18px}
.prompt{font-size:1.34rem;font-weight:800;line-height:1.32;letter-spacing:-.01em}
.sub-prompt{color:var(--ink-soft);font-size:1rem;font-weight:600}

/* le ticket de caisse : identité visuelle des situations */
.ticket{background:var(--c-surface);position:relative;padding:22px 20px;font-size:1.08rem;line-height:1.5;
  filter:drop-shadow(0 2px 5px color-mix(in srgb,var(--c-ink) 10%,transparent))}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:9px;
  background:repeating-linear-gradient(-45deg,var(--c-surface) 0 6px,transparent 6px 12px),
             repeating-linear-gradient(45deg,var(--c-surface) 0 6px,transparent 6px 12px)}
.ticket::before{top:-8px;background-position:0 100%}
.ticket::after{bottom:-8px}
.ticket .head{text-align:center;border-bottom:2px dashed var(--line-2);padding-bottom:10px;margin-bottom:12px}
.ticket .shop{font-family:var(--mono);font-weight:700;font-size:.92rem}
.ticket .meta{font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);margin-top:2px}
.ticket .role{display:inline-block;background:var(--tint);border-radius:6px;padding:4px 11px;font-size:.88rem;font-weight:700;margin-bottom:10px;color:var(--c-primary)}
.ticket .data{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:10px;font-family:var(--mono);font-size:1rem}
.ticket .data div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.ticket .data span:last-child{font-weight:700}

/* saisie numérique */
.answer{display:flex;gap:8px}
.answer input{
  flex:1;min-width:0;font-family:var(--mono);font-size:1.6rem;font-weight:800;
  padding:12px 16px;border:2px solid var(--line-2);border-radius:var(--r-s);
  background:var(--c-surface);text-align:left;min-height:var(--tap);
}
.answer input:focus{border-color:var(--c-primary);outline:none}
.answer .unit{display:grid;place-items:center;padding:0 14px;font-family:var(--mono);font-weight:800;background:var(--tint);border-radius:var(--r-s);font-size:1.05rem}

/* choix d'unité */
.unites{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.answer.avec-unite{gap:10px;align-items:center;flex-wrap:wrap}
.answer.avec-unite input{flex:0 0 auto;width:clamp(110px,28%,168px);font-size:1.35rem;text-align:left}
.answer.avec-unite .unites{flex:1 1 200px;margin-top:0;gap:6px}
.answer.avec-unite .uchip{min-height:44px;padding:8px 13px;font-size:.92rem;border-bottom-width:3px}
body.lay-phone .answer.avec-unite input{flex:1 1 100%;width:100%}
.uchip{
  padding:10px 15px;min-height:46px;border:2px solid var(--line-2);border-bottom-width:4px;
  border-radius:var(--r-s);background:var(--c-surface);font-weight:700;font-size:.95rem;
}
.uchip:hover{border-color:var(--c-primary)}
.uchip.sel{border-color:var(--c-primary);background:var(--tint)}
.uchip.good{border-color:var(--c-ok);background:var(--ok-tint)}
.uchip.bad{border-color:var(--c-err);background:var(--err-tint)}

/* choix */
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{
  display:flex;align-items:center;gap:10px;padding:15px;min-height:var(--tap);font-size:1.05rem;
  border:1.5px solid var(--line-2);border-bottom-width:3px;border-radius:var(--r-s);
  background:var(--c-surface);font-weight:700;
}
.choice .k{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}
.choice:hover{border-color:var(--c-primary)}
.choice.sel{border-color:var(--c-primary);background:var(--tint)}
.choice.good{border-color:var(--c-ok);background:var(--ok-tint)}
.choice.bad{border-color:var(--c-err);background:var(--err-tint)}
.choice.num{font-family:var(--mono);font-size:1.1rem;justify-content:center}

/* formule à trous */
.formule{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;
  font-family:var(--mono);font-size:1.24rem;font-weight:800;
  background:var(--c-surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 14px;
}
.trou{
  min-width:74px;min-height:44px;padding:6px 12px;border-radius:var(--r-s);
  border:2px dashed var(--line-2);background:var(--c-bg);display:inline-grid;place-items:center;
}
.trou.on{border-style:solid;border-color:var(--c-primary);background:var(--tint)}
.trou.full{border-style:solid;background:var(--tint-2);border-color:var(--c-accent)}
.trou.good{border-color:var(--c-ok);background:var(--ok-tint)}
.trou.bad{border-color:var(--c-err);background:var(--err-tint)}
.banque{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.token{
  font-family:var(--mono);font-weight:800;font-size:1.05rem;padding:11px 16px;min-height:46px;
  border:2px solid var(--line-2);border-bottom-width:4px;border-radius:var(--r-s);background:var(--c-surface);
}
.token:hover{border-color:var(--c-primary)}
.token.used{opacity:.28;pointer-events:none}

/* appariement */
.paires{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:10px}
.pitem{
  padding:13px 10px;min-height:var(--tap);border:2px solid var(--line-2);border-bottom-width:4px;
  border-radius:var(--r-s);background:var(--c-surface);font-family:var(--mono);font-weight:800;
  text-align:center;font-size:1.02rem;
}
.pitem.sel{border-color:var(--c-primary);background:var(--tint)}
.pitem.done{border-color:var(--c-ok);background:var(--ok-tint);opacity:.55;pointer-events:none}
.pitem.miss{border-color:var(--c-err);background:var(--err-tint)}

/* remise en ordre */
.ordre{display:flex;flex-direction:column;gap:9px}
.oitem{
  display:flex;gap:11px;align-items:center;padding:13px;min-height:var(--tap);
  border:2px solid var(--line-2);border-bottom-width:4px;border-radius:var(--r-s);background:var(--c-surface);
}
.oitem .rk{
  width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:.85rem;
}
.oitem.picked{border-color:var(--c-primary);background:var(--tint)}
.oitem.picked .rk{background:var(--c-primary);color:#fff}

/* tri en deux colonnes */
.bacs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bac{border:2px dashed var(--line-2);border-radius:var(--r);padding:10px;min-height:110px}
.bac h4{margin:0 0 8px;font-size:.85rem;text-align:center}
.bac .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.puce{
  font-family:var(--mono);font-weight:800;font-size:.95rem;padding:9px 13px;
  border:2px solid var(--line-2);border-bottom-width:4px;border-radius:var(--r-s);background:var(--c-surface);
}
.puce.good{border-color:var(--c-ok);background:var(--ok-tint)}
.puce.bad{border-color:var(--c-err);background:var(--err-tint)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}

/* curseur */
.slider{padding:8px 0}
.slider input{width:100%;accent-color:var(--c-primary);height:36px}
.slider .val{font-family:var(--mono);font-size:2rem;font-weight:800;text-align:center;display:block}
.slider .ech{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.75rem;color:var(--ink-soft)}

/* tableau à compléter */
.grille{width:100%;border-collapse:collapse;font-family:var(--mono)}
.grille th,.grille td{border:1px solid var(--line-2);padding:9px 8px;text-align:right;font-size:.95rem}
.grille th{background:var(--tint);font-size:.78rem;text-align:center;font-family:var(--ui)}
.grille td:first-child{text-align:left;font-family:var(--ui);font-weight:600}
.grille input{
  width:100%;min-width:70px;padding:8px;border:2px solid var(--line-2);border-radius:8px;
  font-family:var(--mono);font-weight:800;text-align:right;background:var(--c-surface);min-height:44px;
}
.grille input:focus{border-color:var(--c-primary);outline:none}
.grille input.good{border-color:var(--c-ok);background:var(--ok-tint)}
.grille input.bad{border-color:var(--c-err);background:var(--err-tint)}

/* barre d'action : toujours en fin de page, jamais par-dessus le contenu */
.actionbar{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  clear:both;position:static;
}
.actionbar .row{align-items:stretch}

/* ══ Bandeau de correction ═══════════════════════════════════ */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--c-surface);border-top:2px solid var(--line);
  transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:14px max(14px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right));
  max-height:74vh;overflow:auto;
}
#sheet.on{transform:translateY(0)}
#sheet.ok{background:var(--ok-tint);border-top-color:var(--c-ok)}
#sheet.ko{background:var(--err-tint);border-top-color:var(--c-err)}
#sheet .inner{max-width:var(--wrap);margin:0 auto;display:flex;flex-direction:column;gap:12px}
#sheet .verdict{display:flex;gap:12px;align-items:flex-start}
#sheet .verdict .ic{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;
  font-size:20px;font-weight:800;color:#fff;
}
#sheet.ok .verdict .ic{background:var(--c-ok)} #sheet.ko .verdict .ic{background:var(--c-err)}
#sheet .verdict b{display:block;font-size:1.15rem}
#sheet .attendu{font-family:var(--mono);font-weight:800}
.detail{border:0;padding:0}
.detail summary{cursor:pointer;font-weight:800;font-size:1rem;padding:8px 0;list-style:none;display:flex;align-items:center;gap:6px}
.detail summary::-webkit-details-marker{display:none}
.detail summary::before{content:"▸";display:inline-block;transition:transform .15s}
.detail[open] summary::before{transform:rotate(90deg)}
.steps{display:flex;flex-direction:column}
.steps .step{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.steps .step:last-child{border-bottom:0}
.steps .step .lab{flex:1;font-size:.96rem;color:var(--ink-soft)}
.steps .step .val{font-family:var(--mono);font-weight:800;text-align:right;font-size:1.02rem}
.concl{background:var(--tint-2);border-radius:var(--r-s);padding:12px 15px;font-weight:700;font-size:1.02rem;line-height:1.45}
.piege{background:var(--c-surface);border:2px solid var(--c-err);border-radius:var(--r-s);padding:12px 15px;font-size:1rem;line-height:1.45}
.hint{background:var(--tint-2);border-left:5px solid var(--c-accent);border-radius:var(--r-s);padding:13px 16px;font-size:1rem;font-weight:600}

/* rappel de méthode après une bonne réponse */
.methode{
  background:color-mix(in srgb,var(--c-ok) 10%,var(--c-surface));
  border:1.5px solid var(--c-ok);border-left-width:6px;border-radius:var(--r-s);padding:14px 16px;
}
.methode .mtitre{font-weight:800;color:var(--c-ok);font-size:1.02rem;margin-bottom:8px}
.methode .mform{margin:0 0 10px;padding-left:20px}
.methode .mform li{font-family:var(--mono);font-size:1rem;font-weight:700;margin-bottom:4px}
.methode .mpas{display:flex;flex-direction:column;gap:5px;font-size:.96rem;color:var(--ink-soft)}

/* correction après une erreur */
.correction{
  background:var(--corr-tint);border:1.5px solid var(--c-corr);border-left-width:6px;
  border-radius:var(--r-s);padding:14px 16px;
}
.correction .ctitre{font-weight:800;color:var(--c-corr);font-size:1.02rem;margin-bottom:8px}
.correction .steps .step .val{color:var(--c-corr)}
.correction .cpiege{
  background:var(--c-surface);border:1.5px solid var(--c-corr);border-radius:var(--r-s);
  padding:10px 13px;margin-bottom:10px;font-size:1rem;
}
.correction .cconcl{
  background:color-mix(in srgb,var(--c-corr) 16%,var(--c-surface));
  border-radius:var(--r-s);padding:11px 14px;margin-top:10px;font-weight:700;
}
.correction .detail summary{color:var(--c-corr)}
#sheet.ko{background:var(--c-surface);border-top-color:var(--c-corr)}
#sheet.ko .verdict .ic{background:var(--c-corr)}
#sheet.ko .k{color:var(--c-corr)}

/* coup de pouce */
.hint .htitre{font-weight:800;font-size:.9rem;text-transform:none;color:var(--c-primary);margin-bottom:5px}
.hint .hform{margin:9px 0 6px;padding-left:20px}
.hint .hform li{font-family:var(--mono);font-size:.96rem;font-weight:700;margin-bottom:3px}
.hint .hcout{font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.cout{font-size:.8rem;opacity:.75;font-family:var(--mono)}

/* calculatrice */
.calc-q{background:var(--tint);border-radius:var(--r-s);padding:12px 14px;margin:10px 0;font-size:.98rem}
.calc-q .calc-en{color:var(--ink-soft);margin-bottom:6px;font-size:.92rem}
.calc-q .calc-qt{font-weight:800}
.calc-q .calc-data{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-family:var(--mono);font-size:.9rem}
.calc-ecran{
  background:var(--c-ink);color:var(--c-surface);border-radius:var(--r-s);
  padding:12px 14px;text-align:right;margin-bottom:12px;
}
.calc-ecran .calc-exp{font-family:var(--mono);font-size:1.05rem;opacity:.75;min-height:1.3em;word-break:break-all}
.calc-ecran .calc-res{font-family:var(--mono);font-size:1.8rem;font-weight:800;line-height:1.2}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ctouche{
  min-height:46px;border-radius:var(--r-s);background:var(--c-surface);
  border:1.5px solid var(--line-2);border-bottom-width:3px;
  font-family:var(--mono);font-size:1.08rem;font-weight:800;
}
.calc-q{max-height:19vh;overflow:auto}
@media(max-height:720px){
  .ctouche{min-height:40px;font-size:1rem}
  .calc-ecran .calc-res{font-size:1.5rem}
  .calc-q{max-height:14vh;font-size:.9rem}
}
.ctouche:hover{border-color:var(--c-primary)}
.ctouche:active{transform:translateY(2px)}
.ctouche.op{background:var(--tint)}
.ctouche.exe{grid-column:1/-1;background:var(--c-primary);color:#fff;border-color:var(--c-primary);font-size:1.05rem}

/* schéma flèche */
.evo{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:4px 0}
.evo .v{font-family:var(--mono);font-weight:800;background:var(--c-surface);border:2px solid var(--line-2);border-radius:var(--r-s);padding:8px 12px}
.evo .v.end{border-color:var(--c-primary)}
.evo .arr{display:flex;flex-direction:column;align-items:center;min-width:92px}
.evo .arr b{font-family:var(--mono);font-size:.85rem;color:var(--c-primary)}
.evo .arr .line{height:2px;background:var(--c-primary);width:100%;position:relative}
.evo .arr .line::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--c-primary)}
.barviz{height:24px;border-radius:6px;background:var(--line);overflow:hidden}
.barviz i{background:var(--c-primary);display:block;height:100%}

/* ══ Divers écrans ═══════════════════════════════════════════ */
table.data{width:100%;border-collapse:collapse;font-size:.9rem}
table.data th,table.data td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.data th{font-weight:700;font-size:.78rem;color:var(--ink-soft)}
table.data td.n,table.data th.n{text-align:right;font-family:var(--mono)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.badge{background:var(--c-surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;text-align:center}
.badge.on{border-color:var(--c-accent);background:var(--tint-2)}
.badge .ic{font-size:26px;display:block;margin-bottom:4px}
.badge.off .ic{filter:grayscale(1);opacity:.32}
.badge b{display:block;font-size:.84rem}
.badge small{color:var(--ink-soft);font-size:.74rem;line-height:1.3;display:block;margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:9px 14px;border-radius:99px;border:2px solid var(--line-2);font-size:.87rem;font-weight:700;min-height:42px}
.tab.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.field{margin-bottom:14px}
.field>label{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}
.field .help{font-size:.78rem;color:var(--ink-soft);margin-top:4px}
.field input[type=text],.field input[type=number],.field input[type=password],.field select,.field textarea{
  width:100%;padding:10px 12px;border:2px solid var(--line-2);border-radius:var(--r-s);
  background:var(--c-surface);min-height:46px}
.field textarea{min-height:100px;resize:vertical;line-height:1.5}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.sw{display:flex;align-items:center;gap:8px;font-size:.82rem}
.sw input[type=color]{width:46px;height:40px;padding:0;border:2px solid var(--line-2);border-radius:9px;background:none;cursor:pointer;flex:0 0 46px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.theme{border:2px solid var(--line-2);border-radius:var(--r-s);padding:9px;text-align:center;font-size:.78rem;font-weight:700}
.theme.on{border-color:var(--c-primary);background:var(--tint)}
.theme .dots{display:flex;gap:3px;justify-content:center;margin-bottom:6px}
.theme .dots i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--c-primary)}
.check .grow small{display:block;color:var(--ink-soft);font-size:.78rem}
.bigscore{font-family:var(--mono);font-size:3rem;font-weight:800;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border:2px solid var(--line-2);border-radius:var(--r-s);padding:12px 8px;text-align:center}
.kpi b{display:block;font-family:var(--mono);font-size:1.35rem}
.kpi small{color:var(--ink-soft);font-size:.75rem}

#modal{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--c-ink) 55%,transparent);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box h2{color:var(--c-primary)}
#modal .box{background:var(--c-surface);border-radius:var(--r);padding:20px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
#toast{
  position:fixed;left:50%;bottom:calc(24px + var(--sheet));transform:translateX(-50%) translateY(16px);
  background:var(--c-ink);color:var(--c-bg);padding:11px 18px;border-radius:99px;font-size:.9rem;
  font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ Fête d'obtention d'un badge ═════════════════════════════ */
.fete{
  position:fixed;inset:0;z-index:95;display:grid;place-items:center;overflow:hidden;
  background:color-mix(in srgb,var(--c-ink) 38%,transparent);animation:apparait .18s ease-out;
}
.fete.sort{animation:disparait .3s forwards}
.fete-carte{
  position:relative;background:var(--c-surface);border-radius:26px;padding:28px 34px;
  text-align:center;max-width:330px;box-shadow:0 24px 60px -20px color-mix(in srgb,var(--c-ink) 60%,transparent);
  animation:bond .55s cubic-bezier(.2,1.5,.4,1);overflow:hidden;
}
.fete-carte .rayons{
  position:absolute;top:50%;left:50%;width:520px;height:520px;margin:-260px 0 0 -260px;
  background:conic-gradient(from 0deg,var(--c-accent) 0 8deg,transparent 8deg 30deg);
  opacity:.18;animation:tourne 9s linear infinite;
}
.fete-ic{position:relative;font-size:58px;line-height:1;animation:bond .7s .1s backwards}
.fete-t{position:relative;font-size:.9rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c-accent);margin-top:10px}
.fete-n{position:relative;font-size:1.5rem;font-weight:800;margin-top:4px}
.fete-d{position:relative;color:var(--ink-soft);font-size:.95rem;margin-top:6px}
.confettis{position:absolute;inset:0;pointer-events:none}
.confettis i{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:tombe 1.9s ease-in forwards}
@keyframes tombe{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes bond{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes apparait{from{opacity:0}to{opacity:1}}
@keyframes disparait{to{opacity:0}}

/* ══ Animations ══════════════════════════════════════════════ */
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.shake{animation:shake .34s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop .16s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .2s ease-out}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
body.noanim *{animation:none !important;transition:none !important}
body.dys{--font:Verdana,Geneva,"DejaVu Sans",sans-serif;letter-spacing:.05em;word-spacing:.14em;line-height:1.75}
body.dys .prompt,body.dys .ticket,body.dys .concl,body.dys .steps{line-height:1.8}
body.dys p,body.dys li{text-align:left;hyphens:none}
.lire{
  display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;
  background:var(--tint);border-radius:99px;padding:6px 12px;margin-bottom:8px;
}
.lire:hover{background:var(--line)}
.lire.on{background:var(--c-accent);color:var(--c-ink)}

/* ══ DISPOSITIONS ════════════════════════════════════════════ */
/* Téléphone : colonne unique, actions dans la zone du pouce */
body.lay-phone{--tap:54px;--wrap:560px}
body.lay-phone .kpis{grid-template-columns:1fr 1fr 1fr}
body.lay-phone .choices.two{grid-template-columns:1fr 1fr}
body.lay-phone main.playing{padding-bottom:calc(24px + var(--sheet) + env(safe-area-inset-bottom))}
body.lay-phone .node .side{display:none}

/* Ordinateur : deux colonnes pendant la leçon, plus large */
body.lay-desk{--wrap:1000px;--tap:48px}
body.lay-desk .lesson.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:26px}
body.lay-desk .lesson.two .col-a{position:sticky;top:78px}
body.lay-desk .path{max-width:560px;margin:0 auto}
body.lay-desk .actionbar{margin-top:20px}
body.lay-desk .formule{font-size:1.35rem}
body.lay-desk .badges{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}

/* Vidéoprojection */
body.lay-beam{--fs:23px;--wrap:1180px;--tap:60px}
body.lay-beam .prompt{font-size:1.5rem}
body.lay-beam .kbd{display:none}

/* menu */
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-s);
  font-weight:700;font-size:1.02rem;
}
.menu button:hover{background:var(--tint)}
.menu button span.i{font-size:20px;width:28px;text-align:center}
.menu .sep{height:1px;background:var(--line);margin:6px 0}

/* aide-mémoire */
.fam{--f:var(--c-primary);
  background:color-mix(in srgb,var(--f) 6%,var(--c-surface));
  border:1.5px solid color-mix(in srgb,var(--f) 26%,var(--c-surface));
  border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre);
}
.fam-t{display:flex;align-items:center;gap:12px;background:var(--f);color:#fff;padding:13px 16px;font-size:1.08rem}
.fam-i{font-family:var(--mono);font-size:1.2rem;background:color-mix(in srgb,#000 20%,transparent);
  border-radius:9px;width:34px;height:34px;display:grid;place-items:center}
.fam-n{font-family:var(--mono);font-size:.85rem;opacity:.9}
.fam-l{padding:13px 16px;border-top:1px solid color-mix(in srgb,var(--f) 18%,var(--c-surface))}
.fam-l:first-of-type{border-top:0}
.fam-f{font-family:var(--mono);font-weight:800;font-size:1.05rem;color:var(--f);margin-bottom:5px}
.fam-f .k{color:inherit}
.fam-e{font-size:.98rem;line-height:1.5}
.fam-x{margin-top:6px;font-size:.94rem;background:color-mix(in srgb,var(--f) 11%,var(--c-surface));
  border-radius:9px;padding:8px 11px}
.fam-x .k{color:var(--f)}

/* fiche méthode */
.fiche{--f:var(--c-primary)}
.fiche .f-h{display:flex;align-items:center;gap:12px;background:var(--f);color:#fff;
  border-radius:18px;padding:16px 18px;margin-bottom:16px}
.fiche .f-h .n{font-family:var(--mono);font-weight:800;background:color-mix(in srgb,#000 22%,transparent);
  border-radius:9px;padding:5px 10px}
.fiche .f-h b{font-size:1.2rem;display:block}
.f-bloc{border-radius:14px;padding:13px 16px;margin-bottom:12px}
.f-sert{background:color-mix(in srgb,var(--f) 10%,var(--c-surface));border-left:5px solid var(--f)}
.f-form{background:color-mix(in srgb,var(--c-accent) 16%,var(--c-surface));border-left:5px solid var(--c-accent)}
.f-form ul{margin:6px 0 0;padding-left:20px}
.f-form li{font-family:var(--mono);font-weight:800;font-size:1rem;margin-bottom:4px}
.f-etapes{background:var(--c-surface);border:1.5px solid var(--line)}
.f-etapes .e{display:flex;gap:11px;align-items:flex-start;padding:7px 0}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function deepMerge(def,src){
  if(Array.isArray(def)) return Array.isArray(src)?src.slice():def.slice();
  const out={...def};
  if(!src||typeof src!=='object') return out;
  for(const k in src){
    const d=def[k];
    if(d&&typeof d==='object'&&!Array.isArray(d)&&Object.keys(d).length) out[k]=deepMerge(d,src[k]);
    else out[k]=src[k];
  }
  return out;
}
function loadCfg(){ let r=null; try{ r=JSON.parse(lsGet(KEY_CFG)); }catch(e){} CFG=deepMerge(CFG_DEF,r||{}); }
function saveCfg(){ lsSet(KEY_CFG,JSON.stringify(CFG)); }
function migrer(r){
  // chaque changement de format passe ici : on complète, on ne remplace jamais
  if(!r||typeof r!=='object') return r;
  const v=r.v||3;
  if(v<4){
    if(r.serie&&r.serie.jours!==undefined) r.serie={n:0,max:0,unite:''};
    if(!r.boites) r.boites={};
  }
  r.v=SCHEMA;
  return r;
}
function loadSt(){
  let r=null; try{ r=JSON.parse(lsGet(cleST())); }catch(e){}
  if(!r&&!PROFIL){ // première ouverture de cette version : on récupère l'ancienne progression si elle existe
    try{ const anc=JSON.parse(lsGet('pxp2_state')); if(anc&&anc.xp){ r={xp:anc.xp,coins:anc.coins,badges:anc.badges,stats:anc.stats,log:anc.log,parties:anc.parties,tempsJeu:anc.tempsJeu}; } }catch(e){}
  }
  ST=deepMerge(ST_DEF,migrer(r)||{});
  if(!ST.c||typeof ST.c!=='object') ST.c={};
  NOTIONS.forEach(n=>{ if(!ST.stats[n.id]) ST.stats[n.id]={ok:0,ko:0,hist:[]}; });
}
function saveSt(){ lsSet(cleST(),JSON.stringify(ST)); }

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function picks(a,n){ const c=a.slice(),o=[]; while(o.length<n&&c.length) o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); return o; }
const shuffle=a=>picks(a,a.length);
const r2=x=>Math.round(x*100)/100;
const r1=x=>Math.round(x*10)/10;
const r3=x=>Math.round(x*1000)/1000;
function fnum(x,d){
  if(typeof x==='string'&&x.trim()!==''&&isNaN(Number(x.replace(',','.')))) return x; // libellés de trame
  if(x===null||x===undefined||isNaN(x)) return '—';
  d=(d===undefined)?2:d; return Number(x).toFixed(d).replace('.',',');
}
const eur=x=>fnum(x,2)+' €';
const pct=(x,d)=>fnum(x,(d===undefined)?1:d)+' %';
const coef=x=>fnum(x,(Math.abs(x*100-Math.round(x*100))<1e-9)?2:3);
function hl(t){
  return esc(t).replace(/(^|[^0-9A-Za-zÀ-ÿ])(\d[\d\u00A0 ]*(?:,\d+)?(?:\s?(?:€|%))?)/g,
    (m,a,b)=>a+'<b class="k">'+b+'</b>');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function parseNum(s){
  if(typeof s==='number') return s;
  if(typeof s!=='string') return NaN;
  let t=s.trim().replace(/\s|\u00A0/g,'').replace(/€|%|articles?|clients?|visiteurs?|pts?/gi,'').replace(',','.');
  if(t==='') return NaN;
  const v=Number(t); return isFinite(v)?v:NaN;
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateDans(n){ const d=new Date(Date.now()+n*86400000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dues(){
  const b=ST.boites||{}, t=today();

function grade(){
  let g=GRADES[0],i=0;
  GRADES.forEach((x,k)=>{ if(ST.xp>=x.t){ g=x; i=k; } });
  const next=GRADES[i+1]||null;
  const base=g.t, cible=next?next.t:g.t;
  const pc=next?Math.min(100,Math.round((ST.xp-base)/(cible-base)*100)):100;
  return {nom:g.n,niveau:i+1,pc,next};
}

 methode:["Prendre t % d'une valeur : coefficient = t ÷ 100. Prendre 60 %, c'est × 0,60.","Ajouter t % : coefficient = 1 + t ÷ 100. Retirer t % : coefficient = 1 − t ÷ 100.","Avant de calculer, je prévois : plus grand que 1, la valeur monte ; plus petit que 1, elle descend."],
 exemple:{e:"Quel coefficient pour une remise de 30 % ? Et que signifie un coefficient de 1,15 ?",c:["1 − 30 ÷ 100 = 0,70","(1,15 − 1) × 100 = 15"],r:"Remise de 30 % : × 0,70. Coefficient 1,15 : hausse de 15 %."}},
N4:{titre:"Appliquer une évolution en une seule opération",

 methode:["Je calcule le coefficient multiplicateur.","Je multiplie la valeur de départ par ce coefficient.","J'arrondis au centime."],
 exemple:{e:"Un article à 45 € avec 20 % de remise : quel prix payé ?",c:["1 − 0,20 = 0,80","45 × 0,80 = 36"],r:"Le client paie 36 €."}},

/* ══════════════════════════════════════════════════════════════
   6. GÉNÉRATEURS DE QUESTIONS
   Format uniforme — ajouter un exercice = ajouter une entrée ici.
   {id, n:notion, d:difficulté 1-3, f:()=>question}
   question = {shop,role,enonce,data[[lab,val]],quest,type,choix,rep,
               unite,dec,tol,aide1,aide2,steps[[lab,val]],concl,
               err[{v,msg}],evo{a,c,b},bar{p,t}}
   ══════════════════════════════════════════════════════════════ */
function Q(o){
  return Object.assign({type:'num',unite:'€',dec:2,tol:0.01,data:[],err:[],
    shop:pick(MAG),role:'Vendeur',aide1:'',aide2:'',steps:[],concl:''},o);
}

const ERR_MUL={msg:"Ici il fallait multiplier par le coefficient, pas diviser."};

/* ─── N3 · Coefficient multiplicateur ────────────────────────── */
{id:'N3a',n:'N3',d:1,f:()=>{
  const t=pick([10,15,20,25,30,40,50,60,70]);
  return Q({role:'Vendeur',
    enonce:`${pick(LIEUX)} applique une remise de ${t} % sur toute une famille de produits. Vous voulez calculer les prix soldés en une seule opération.`,
    data:[['Type d\'évolution','baisse'],['Taux',t+' %']],
    quest:"Quel est le coefficient multiplicateur ?",
    unite:'',dec:2,tol:0.005,rep:r2(1-t/100),
    aide1:"Pour une baisse : coefficient = 1 − taux ÷ 100.",
    aide2:`1 − ${coef(t/100)} = ?`,
    steps:[['Taux en décimal',`${t} ÷ 100 = ${coef(t/100)}`],['Coefficient',`1 − ${coef(t/100)} = ${coef(1-t/100)}`]],
    concl:`Il suffit de multiplier chaque prix par ${coef(1-t/100)}.`,
    err:[{v:r2(1+t/100),msg:"C'est le coefficient d'une hausse. Pour une baisse, on retire le taux à 1."},
         {v:r2(t/100),msg:"Tu as donné le taux en décimal, pas le coefficient. Il manque le « 1 − »."}]});
}},
{id:'N3b',n:'N3',d:1,f:()=>{
  const t=pick([2,3,5,8,10,12,15,20]);
  return Q({role:'Chef de rayon',
    enonce:`Le fournisseur annonce une hausse de ses tarifs de ${t} % au 1er ${pick(MOIS)}.`,
    data:[['Type d\'évolution','hausse'],['Taux',t+' %']],
    quest:"Quel est le coefficient multiplicateur ?",
    unite:'',dec:2,tol:0.005,rep:r2(1+t/100),
    aide1:"Pour une hausse : coefficient = 1 + taux ÷ 100.",
    aide2:`1 + ${coef(t/100)} = ?`,
    steps:[['Taux en décimal',`${t} ÷ 100 = ${coef(t/100)}`],['Coefficient',`1 + ${coef(t/100)} = ${coef(1+t/100)}`]],
    concl:`Les tarifs seront multipliés par ${coef(1+t/100)}.`,
    err:[{v:r2(1-t/100),msg:"C'est le coefficient d'une baisse. Pour une hausse, on ajoute le taux à 1."}]});
}},
{id:'N3c',n:'N3',d:2,f:()=>{
  const t=pick([4,6,8,12,18,22,35]),c=r2(1+t/100);
  return Q({role:'Assistant commercial',
    enonce:`Dans un tableur, la colonne « nouveau tarif » multiplie chaque prix par ${coef(c)}.`,
    data:[['Coefficient',coef(c)]],
    quest:"À quel taux d'évolution cela correspond-il, en % ?",
    unite:'%',dec:1,tol:0.15,rep:t,
    aide1:"Taux = (coefficient − 1) × 100.",
    aide2:`${coef(c)} − 1 = ${coef(c-1)}`,
    steps:[['On retire 1',`${coef(c)} − 1 = ${coef(c-1)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
    concl:`Le coefficient ${coef(c)} correspond à une hausse de ${pct(t)}.`,
    err:[{v:r1(c*100),msg:ERR_C1.msg}]});
}},
{id:'N3d',n:'N3',d:2,f:()=>{
  const t=pick([12,15,25,35,45,55,65]),c=r2(1-t/100);
  return Q({role:'Vendeur',
    enonce:`Une étiquette de soldes indique que le prix est multiplié par ${coef(c)}.`,
    data:[['Coefficient',coef(c)]],
    quest:"Quel est le taux de remise, en % ?",
    unite:'%',dec:1,tol:0.15,rep:t,
    aide1:"Le coefficient est inférieur à 1 : c'est une baisse. Taux = (1 − coefficient) × 100.",
    aide2:`1 − ${coef(c)} = ${coef(1-c)}`,
    steps:[['Écart à 1',`1 − ${coef(c)} = ${coef(1-c)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
    concl:`La remise est de ${pct(t)}.`,
    err:[{v:r1(c*100),msg:"Attention : un coefficient de "+coef(c)+" ne signifie pas "+fnum(c*100,0)+" % de remise, mais que le client paie "+fnum(c*100,0)+" % du prix."}]});
}},
{id:'N3e',n:'N3',d:1,f:()=>{
  const t=pick([20,25,30,40,60]),bon=r2(1-t/100);
  const bad=[r2(1+t/100),r2(t/100),r2(100-t)];
  const opts=[coef(bon),coef(bad[0]),coef(bad[1]),String(bad[2])];
  const order=picks([0,1,2,3],4);
  return Q({role:'Hôte de caisse',type:'qcm',
    enonce:`Vous devez appliquer une remise de ${t} % en une seule multiplication.`,
    quest:"Par quel nombre multiplier le prix ?",
    choix:order.map(i=>opts[i]),rep:order.indexOf(0),
    aide1:"Le client ne paie plus 100 % du prix, mais 100 − "+t+" %.",
    aide2:`1 − ${coef(t/100)} = ${coef(bon)}`,
    steps:[['Le client paie',`100 − ${t} = ${100-t} % du prix`],['Coefficient',`${100-t} ÷ 100 = ${coef(bon)}`]],
    concl:`On multiplie par ${coef(bon)}.`});
}},
{id:'N3f',n:'N3',d:2,f:()=>{
  const t=pick([7.5,12.5,2.5,17.5,4.5]);
  return Q({role:'Assistant commercial',
    enonce:`Une revalorisation tarifaire de ${fnum(t,1)} % est décidée pour la nouvelle saison.`,
    data:[['Type d\'évolution','hausse'],['Taux',fnum(t,1)+' %']],
    quest:"Quel est le coefficient multiplicateur ? (3 décimales)",

    aide1:"Coefficient = 1 + taux ÷ 100, même quand le taux est décimal.",
    aide2:`${fnum(t,1)} ÷ 100 = ${fnum(t/100,3)}`,
    steps:[['Taux en décimal',`${fnum(t,1)} ÷ 100 = ${fnum(t/100,3)}`],['Coefficient',`1 + ${fnum(t/100,3)} = ${fnum(1+t/100,3)}`]],
    concl:`Le coefficient est ${fnum(1+t/100,3)}.`});
}},
{id:'N3g',n:'N3',d:3,f:()=>{
  const c=pick([1.5,2,0.5,1.25,0.75,3]);

    aide1:"Taux = (coefficient − 1) × 100. Si le coefficient est inférieur à 1, le taux est négatif.",
    aide2:`${coef(c)} − 1 = ${coef(c-1)}`,
    steps:[['On retire 1',`${coef(c)} − 1 = ${coef(c-1)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
    concl:t>0?`Les ventes ont augmenté de ${pct(t)}.`:`Les ventes ont baissé de ${pct(-t)}.`,
    err:[{v:r1(c*100),msg:ERR_C1.msg}]});
}},
{id:'N3h',n:'N3',d:3,f:()=>{
  const t=pick([20,25,30,40]),c=r2(1-t/100),part=r1(c*100);
  return Q({role:'Vendeur',type:'qcm',
    enonce:`Un article subit une remise de ${t} %.`,
    quest:"Quelle phrase est exacte ?",
    choix:[`Le client paie ${fnum(part,0)} % du prix affiché.`,
           `Le client paie ${t} % du prix affiché.`,
           `Le prix est divisé par ${coef(c)}.`,
           `Le prix est multiplié par ${coef(1+t/100)}.`],
    rep:0,
    aide1:"Une remise de "+t+" % laisse au client 100 − "+t+" % du prix à payer.",
    aide2:`100 − ${t} = ${100-t}`,
    steps:[['Part payée',`100 − ${t} = ${100-t} %`],['Coefficient',`${coef(c)}`]],
    concl:`Le client paie ${fnum(part,0)} % du prix, soit une multiplication par ${coef(c)}.`});
}},

/* ─── N4 · Appliquer une évolution ───────────────────────────── */
{id:'N4a',n:'N4',d:1,f:()=>{
  const a=pick(ART),p=r2(prix(a)),t=pick([10,20,25,30,40,50]);
  const c=r2(1-t/100),f=r2(p*c);
  return Q({role:'Hôte de caisse',
    enonce:`Un client vous présente ${a.n} au prix affiché de ${eur(p)}. L'article est soldé à −${t} %.`,
    data:[['Prix affiché',eur(p)],['Remise',t+' %']],
    quest:"Quel prix le client va-t-il payer ?",
    rep:f,evo:{a:eur(p),c:'× '+coef(c),b:eur(f)},
    aide1:"Multiplie directement le prix par le coefficient de la baisse.",
    aide2:`1 − ${coef(t/100)} = ${coef(c)}, puis ${fnum(p)} × ${coef(c)}.`,
    steps:[['Coefficient',`1 − ${coef(t/100)} = ${coef(c)}`],['Prix soldé',`${fnum(p)} × ${coef(c)} = ${fnum(f)}`]],
    concl:`Le client paie ${eur(f)}.`,
    err:[{v:r2(p*t/100),msg:"Tu as calculé le montant de la remise. On demande le prix à payer."},
         {v:r2(p*(1+t/100)),msg:"Tu as appliqué une hausse. Une remise fait baisser le prix."}]});
}},

{id:'N4g',n:'N4',d:3,f:()=>{

{id:'N4h',n:'N4',d:3,f:()=>{

{id:'N5e',n:'N5',d:2,f:()=>{
  const t=pick([30,40,50,60,70]),c=r2(1-t/100);
  const init=prixRond(50,300,5),f=r2(init*c);
  return Q({role:'Chef de rayon',
    enonce:`Un article en fin de série est vendu ${eur(f)}. L'étiquette précise « −${t} % sur le prix d'origine ».`,
    data:[['Prix de vente',eur(f)],['Remise',t+' %']],
    quest:"Quel était le prix d'origine ?",
    rep:init,evo:{a:eur(init),c:'× '+coef(c),b:eur(f)},
    aide1:"Prix d'origine = prix soldé ÷ coefficient de remise.",
    aide2:`${fnum(f)} ÷ ${coef(c)} = ?`,
    steps:[['Coefficient',`1 − ${coef(t/100)} = ${coef(c)}`],['Prix d\'origine',`${fnum(f)} ÷ ${coef(c)} = ${fnum(init)}`]],
    concl:`L'article était affiché ${eur(init)}.`,
    err:[{v:r2(f*(1+t/100)),msg:ERR_DIV.msg}]});
}},
{id:'N5f',n:'N5',d:3,f:()=>{
  const taux=pick([5.5,10]),ht=prixRond(40,420,5),ttc=r2(ht*(1+taux/100));
  const c=r3(1+taux/100);
  return Q({role:'Assistant commercial',
    enonce:`Une commande de produits alimentaires est facturée ${eur(ttc)} TTC, avec une TVA à ${fnum(taux,1)} %.`,
    data:[['Montant TTC',eur(ttc)],['Taux de TVA',fnum(taux,1)+' %']],
    quest:"Quel est le montant hors taxes ?",
    rep:ht,evo:{a:eur(ht),c:'× '+fnum(c,3),b:eur(ttc)},
    aide1:"HT = TTC ÷ (1 + taux ÷ 100).",
    aide2:`${fnum(ttc)} ÷ ${fnum(c,3)} = ?`,
    steps:[['Coefficient',`1 + ${fnum(taux/100,3)} = ${fnum(c,3)}`],['Montant HT',`${fnum(ttc)} ÷ ${fnum(c,3)} = ${fnum(ht)}`]],
    concl:`Le montant hors taxes est de ${eur(ht)}.`});
}},

/* ─── N6 · Calculer un taux d'évolution ──────────────────────── */
{id:'N6a',n:'N6',d:1,f:()=>{
  const a=prixRond(8000,30000,500),t=pick([5,8,10,12.5,15,20,25]);
  const b=r2(a*(1+t/100));
  return Q({role:'Chef de rayon',
    enonce:`Le CA du rayon est passé de ${eur(a)} en ${pick(MOIS)} à ${eur(b)} le mois suivant.`,
    data:[['CA de départ',eur(a)],['CA d\'arrivée',eur(b)]],
    quest:"Quel est le taux d'évolution, à 0,1 % près ?",
    unite:'%',dec:1,tol:0.15,rep:r1(t),
    aide1:"Taux = (valeur d'arrivée − valeur de départ) ÷ valeur de DÉPART × 100.",
    aide2:`${fnum(b,0)} − ${fnum(a,0)} = ${fnum(b-a,0)}, puis ÷ ${fnum(a,0)}.`,
    steps:[['Variation',`${fnum(b,0)} − ${fnum(a,0)} = ${fnum(b-a)}`],['Quotient',`${fnum(b-a)} ÷ ${fnum(a,0)} = ${fnum((b-a)/a,4)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
    concl:`Le CA a augmenté de ${pct(t)}.`,
    err:[{v:r1((b-a)/b*100),msg:"Tu as divisé par la valeur d'arrivée. On divise toujours par la valeur de départ."}]});
}},
{id:'N6b',n:'N6',d:2,f:()=>{
  const a=ri(80,260)*10,t=pick([8,12,15,20,24]),b=Math.round(a*(1-t/100));
  const tr=r1((b-a)/a*100);
  return Q({role:'Chargé d\'accueil',
    enonce:`La fréquentation hebdomadaire est passée de ${a} à ${b} visiteurs après les travaux de voirie devant le magasin.`,
    data:[['Avant',a+' visiteurs'],['Après',b+' visiteurs']],
    quest:"Quel est le taux d'évolution, en % ? (signe − pour une baisse)",
    unite:'%',dec:1,tol:0.2,rep:tr,
    aide1:"Taux = (arrivée − départ) ÷ départ × 100. Le résultat sera négatif.",
    aide2:`${b} − ${a} = ${b-a}, puis ÷ ${a}.`,
    steps:[['Variation',`${b} − ${a} = ${b-a}`],['Quotient',`${b-a} ÷ ${a} = ${fnum((b-a)/a,4)}`],['En pourcentage',`× 100 = ${fnum(tr,1)}`]],
    concl:`La fréquentation a baissé de ${pct(-tr)}.`});
}},
{id:'N6c',n:'N6',d:1,f:()=>{
  const a=pick(ART),p1=r2(prix(a)),t=pick([4,5,8,10,12,20]),p2=r2(p1*(1+t/100));
  return Q({role:'Assistant commercial',
    enonce:`Le tarif fournisseur d'un article est passé de ${eur(p1)} à ${eur(p2)}.`,
    data:[['Ancien tarif',eur(p1)],['Nouveau tarif',eur(p2)]],
    quest:"Quel est le taux de hausse, à 0,1 % près ?",
    unite:'%',dec:1,tol:0.2,rep:r1(t),
    aide1:"Taux = (nouveau − ancien) ÷ ancien × 100.",
    aide2:`${fnum(p2)} − ${fnum(p1)} = ${fnum(p2-p1)}`,
    steps:[['Variation',`${fnum(p2)} − ${fnum(p1)} = ${fnum(p2-p1)}`],['Quotient',`${fnum(p2-p1)} ÷ ${fnum(p1)} = ${fnum((p2-p1)/p1,4)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
    concl:`Le tarif a augmenté de ${pct(t)}.`});
}},
{id:'N6d',n:'N6',d:2,f:()=>{
  const a=r2(ri(2200,4800)/100),t=pick([6,9,12,15,18]),b=r2(a*(1+t/100));
  return Q({role:'Responsable adjoint',
    enonce:`Le panier moyen du magasin est passé de ${eur(a)} à ${eur(b)} après la mise en place des ventes additionnelles en caisse.`,
    data:[['Panier moyen avant',eur(a)],['Panier moyen après',eur(b)]],
    quest:"Quel est le taux d'évolution, à 0,1 % près ?",
    unite:'%',dec:1,tol:0.25,rep:r1((b-a)/a*100),
    aide1:"Taux = (arrivée − départ) ÷ départ × 100.",
    aide2:`${fnum(b)} − ${fnum(a)} = ${fnum(b-a)}`,
    steps:[['Variation',`${fnum(b)} − ${fnum(a)} = ${fnum(b-a)}`],['Quotient',`${fnum(b-a)} ÷ ${fnum(a)} = ${fnum((b-a)/a,4)}`],['En pourcentage',`× 100 = ${fnum(r1((b-a)/a*100),1)}`]],
    concl:`Le panier moyen a progressé de ${pct(r1((b-a)/a*100))}.`});
}},
{id:'N6e',n:'N6',d:2,f:()=>{
  const a=ri(40,120),b=ri(12,Math.max(14,a-10));
  const t=r1((b-a)/a*100);
  return Q({role:'Chargé de relation client',
    enonce:`Le nombre de réclamations clients est passé de ${a} à ${b} en un trimestre après la formation de l'équipe.`,
    data:[['Réclamations avant',String(a)],['Réclamations après',String(b)]],
    quest:"Quel est le taux d'évolution, en % ? (signe − pour une baisse)",
    unite:'%',dec:1,tol:0.25,rep:t,
    aide1:"Taux = (arrivée − départ) ÷ départ × 100.",
    aide2:`${b} − ${a} = ${b-a}, puis ÷ ${a}.`,
    steps:[['Variation',`${b} − ${a} = ${b-a}`],['Quotient',`${b-a} ÷ ${a} = ${fnum((b-a)/a,4)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
    concl:`Les réclamations ont diminué de ${pct(-t)}.`});
}},
{id:'N6f',n:'N6',d:3,f:()=>{
  const r1n=pick(RAY),r2n=pick(RAY.filter(x=>x!==r1n));
  const a1=prixRond(9000,18000,100),b1=r2(a1*(1+pick([6,8,10])/100));
  const a2=prixRond(22000,40000,100),b2=r2(a2*(1+pick([3,4,5])/100));
  const t1=r1((b1-a1)/a1*100),t2=r1((b2-a2)/a2*100);
  const gagnant=t1>t2?r1n:r2n;
  return Q({role:'Responsable de magasin',type:'qcm',
    enonce:`Rayon ${r1n} : le CA passe de ${eur(a1)} à ${eur(b1)}. Rayon ${r2n} : le CA passe de ${eur(a2)} à ${eur(b2)}.`,
    quest:"Quel rayon a le meilleur taux de progression ?",
    choix:[`Le rayon ${r1n}`,`Le rayon ${r2n}`,'Les deux progressent au même taux','On ne peut pas comparer'],
    rep:t1>t2?0:1,
    aide1:"Compare les taux, pas les montants gagnés en euros : un gros rayon gagne plus d'euros sans forcément mieux progresser.",
    aide2:`Rayon ${r1n} : ${fnum(b1-a1,0)} ÷ ${fnum(a1,0)} · Rayon ${r2n} : ${fnum(b2-a2,0)} ÷ ${fnum(a2,0)}`,
    steps:[[`Taux rayon ${r1n}`,`${fnum(b1-a1,0)} ÷ ${fnum(a1,0)} × 100 = ${fnum(t1,1)} %`],[`Taux rayon ${r2n}`,`${fnum(b2-a2,0)} ÷ ${fnum(a2,0)} × 100 = ${fnum(t2,1)} %`]],
    concl:`C'est le rayon ${gagnant} qui progresse le mieux, avec ${pct(Math.max(t1,t2))}.`});
}},

/* ─── N7 · Évolutions successives ────────────────────────────── */
{id:'N7a',n:'N7',d:2,f:()=>{
  const a=pick(ART),p=prixRond(40,180,5),t1=pick([20,30,40]),t2=pick([10,20,30]);
  const c1=r2(1-t1/100),c2=r2(1-t2/100),f=r2(p*c1*c2);
  return Q({role:'Hôte de caisse',
    enonce:`Un article — ${a.n} — est affiché ${eur(p)} et soldé à −${t1} %. Une deuxième démarque de −${t2} % supplémentaires est appliquée en caisse sur le prix déjà soldé.`,
    data:[['Prix d\'origine',eur(p)],['1re démarque',"−"+t1+' %'],['2e démarque',"−"+t2+' %']],
    quest:"Quel prix le client paie-t-il ?",
    rep:f,
    aide1:"La 2e remise porte sur le prix déjà soldé : multiplie les deux coefficients.",
    aide2:`${coef(c1)} × ${coef(c2)} = ${coef(r3(c1*c2))}`,
    steps:[['Coefficients',`${coef(c1)} et ${coef(c2)}`],['Coefficient global',`${coef(c1)} × ${coef(c2)} = ${fnum(c1*c2,3)}`],['Prix payé',`${fnum(p)} × ${fnum(c1*c2,3)} = ${fnum(f)}`]],
    concl:`Le client paie ${eur(f)}.`,
    err:[{v:r2(p*(1-(t1+t2)/100)),msg:ERR_ADD.msg+" Une remise de "+t1+" % puis "+t2+" % ne fait pas "+(t1+t2)+" %."}]});
}},
{id:'N7b',n:'N7',d:3,f:()=>{
  const t1=pick([20,30,40,50]),t2=pick([10,20,30]);
  const c1=r2(1-t1/100),c2=r2(1-t2/100),cg=r3(c1*c2),tg=r1((1-cg)*100);
  return Q({role:'Chef de rayon',
    enonce:`Vous affichez en vitrine « −${t1} % puis −${t2} % supplémentaires ». Un client vous demande à combien s'élève la réduction totale.`,
    data:[['1re remise',"−"+t1+' %'],['2e remise',"−"+t2+' %']],
    quest:"Quelle est la remise globale, à 0,1 % près ?",
    unite:'%',dec:1,tol:0.15,rep:tg,
    aide1:"Multiplie les deux coefficients, puis compare le résultat à 1.",
    aide2:`${coef(c1)} × ${coef(c2)} = ${fnum(cg,3)}`,
    steps:[['Coefficient global',`${coef(c1)} × ${coef(c2)} = ${fnum(cg,3)}`],['Écart à 1',`1 − ${fnum(cg,3)} = ${fnum(1-cg,3)}`],['En pourcentage',`× 100 = ${fnum(tg,1)}`]],
    concl:`La remise globale est de ${pct(tg)}, et non de ${t1+t2} %.`,
    err:[{v:t1+t2,msg:ERR_ADD.msg}]});
}},
{id:'N7c',n:'N7',d:3,f:()=>{
  const t=pick([20,25,50,10,40]),c=r2(1-t/100);
  const back=r1((1/c-1)*100);
  return Q({role:'Responsable adjoint',
    enonce:`Après les soldes, vous devez remettre en rayon des articles qui avaient été démarqués de ${t} %, à leur prix d'origine.`,
    data:[['Remise appliquée',"−"+t+' %']],
    quest:"De quel pourcentage faut-il augmenter le prix soldé pour retrouver le prix d'origine ? (0,1 % près)",
    unite:'%',dec:1,tol:0.25,rep:back,
    aide1:"Cherche le coefficient qui, multiplié par "+coef(c)+", redonne 1.",
    aide2:`1 ÷ ${coef(c)} = ${fnum(1/c,4)}`,
    steps:[['Coefficient de la baisse',`1 − ${coef(t/100)} = ${coef(c)}`],['Coefficient inverse',`1 ÷ ${coef(c)} = ${fnum(1/c,4)}`],['Taux',`(${fnum(1/c,4)} − 1) × 100 = ${fnum(back,1)}`]],
    concl:`Il faut augmenter de ${pct(back)} : une baisse de ${t} % ne se compense pas par une hausse de ${t} %.`,
    err:[{v:t,msg:"Une baisse de "+t+" % ne se rattrape pas par une hausse de "+t+" %, car la référence a changé."}]});
}},
{id:'N7d',n:'N7',d:3,f:()=>{
  const ca=prixRond(30000,70000,500),t1=pick([5,8,10,12]),t2=pick([4,6,15,-5]);
  const c1=r2(1+t1/100),c2=r2(1+t2/100),f=r2(ca*c1*c2);
  return Q({role:'Responsable de magasin',
    enonce:`Le CA était de ${eur(ca)} il y a deux ans. Il a progressé de ${t1} % la première année, puis ${t2>0?'de '+t2+' %':'a baissé de '+(-t2)+' %'} la seconde.`,
    data:[['CA initial',eur(ca)],['Année 1',(t1>0?'+':'')+t1+' %'],['Année 2',(t2>0?'+':'')+t2+' %']],
    quest:"Quel est le CA aujourd'hui ?",
    rep:f,
    aide1:"Multiplie le CA initial par les deux coefficients successifs.",
    aide2:`${coef(c1)} × ${coef(c2)} = ${fnum(c1*c2,4)}`,
    steps:[['Coefficient année 1',`1 + ${coef(t1/100)} = ${coef(c1)}`],['Coefficient année 2',`${coef(c2)}`],['CA final',`${fnum(ca,0)} × ${coef(c1)} × ${coef(c2)} = ${fnum(f)}`]],
    concl:`Le CA s'élève aujourd'hui à ${eur(f)}.`,
    err:[{v:r2(ca*(1+(t1+t2)/100)),msg:ERR_ADD.msg}]});
}},
{id:'N7e',n:'N7',d:3,f:()=>{
  const t1=pick([20,25,30]),t2=pick([10,15,20]);
  const c1=r2(1-t1/100),c2=r2(1+t2/100),cg=r3(c1*c2),tg=r1((cg-1)*100);
  return Q({role:'Chef de rayon',
    enonce:`Un article a d'abord été démarqué de ${t1} %, puis son prix a été relevé de ${t2} % à la fin des soldes.`,
    data:[['1re évolution',"−"+t1+' %'],['2e évolution',"+"+t2+' %']],
    quest:"Quel est le taux d'évolution global, en % ? (signe − si baisse)",
    unite:'%',dec:1,tol:0.25,rep:tg,
    aide1:"Coefficient global = coefficient de la baisse × coefficient de la hausse.",
    aide2:`${coef(c1)} × ${coef(c2)} = ${fnum(cg,3)}`,
    steps:[['Coefficient global',`${coef(c1)} × ${coef(c2)} = ${fnum(cg,3)}`],['Taux',`(${fnum(cg,3)} − 1) × 100 = ${fnum(tg,1)}`]],
    concl:`Globalement, le prix a ${tg<0?'baissé':'augmenté'} de ${pct(Math.abs(tg))}.`,
    err:[{v:r1(t2-t1),msg:ERR_ADD.msg}]});
}},
{id:'N7f',n:'N7',d:3,f:()=>{
  const p=prixRond(20,60,5);
  const tot=r2(p+p*0.5),tg=r1((1-tot/(2*p))*100);
  return Q({role:'Vendeur',
    enonce:`L'opération du mois annonce « le 2e article à −50 % ». Une cliente prend deux articles identiques à ${eur(p)} pièce.`,
    data:[['Prix unitaire',eur(p)],['2e article',"−50 %"]],
    quest:"À quelle remise globale sur les deux articles cela correspond-il, en % ?",
    unite:'%',dec:1,tol:0.15,rep:tg,
    aide1:"Compare ce qu'elle paie réellement au prix de deux articles plein tarif.",
    aide2:`Elle paie ${fnum(p)} + ${fnum(p*0.5)} = ${fnum(tot)} au lieu de ${fnum(2*p)}.`,
    steps:[['Prix payé',`${fnum(p)} + ${fnum(p*.5)} = ${fnum(tot)}`],['Prix plein tarif',`${fnum(p)} × 2 = ${fnum(2*p)}`],['Remise',`${fnum(2*p-tot)} ÷ ${fnum(2*p)} × 100 = ${fnum(tg,1)}`]],
    concl:`« Le 2e à −50 % » équivaut à ${pct(tg)} de remise sur l'ensemble.`,
    err:[{v:50,msg:"La remise de 50 % ne porte que sur un seul des deux articles."}]});
}},
{id:'N7g',n:'N7',d:2,f:()=>{
  const m=prixRond(800,4000,50),t1=pick([10,15,20]),t2=pick([1,2,3]);
  const c1=r2(1-t1/100),c2=r2(1-t2/100),f=r2(m*c1*c2);
  return Q({role:'Assistant commercial',
    enonce:`Une facture fournisseur de ${eur(m)} bénéficie d'une remise commerciale de ${t1} %, puis d'un escompte de ${t2} % pour règlement comptant appliqué sur le montant remisé.`,
    data:[['Montant brut',eur(m)],['Remise',t1+' %'],['Escompte',t2+' %']],
    quest:"Quel est le net à payer ?",
    rep:f,
    aide1:"L'escompte s'applique après la remise : on multiplie les deux coefficients.",
    aide2:`${coef(c1)} × ${coef(c2)} = ${fnum(c1*c2,4)}`,
    steps:[['Après remise',`${fnum(m,0)} × ${coef(c1)} = ${fnum(m*c1)}`],['Après escompte',`${fnum(m*c1)} × ${coef(c2)} = ${fnum(f)}`]],
    concl:`Le net à payer est de ${eur(f)}.`,
    err:[{v:r2(m*(1-(t1+t2)/100)),msg:ERR_ADD.msg}]});
}},

/* ─── N8 · Marges et TVA ─────────────────────────────────────── */
{id:'N8a',n:'N8',d:1,f:()=>{
  const ht=prixRond(15,220,5),ttc=r2(ht*1.2);
  return Q({role:'Chef de rayon',
    enonce:`Vous fixez le prix de vente d'un article à ${eur(ht)} hors taxes. La TVA est de 20 %.`,
    data:[['Prix de vente HT',eur(ht)],['TVA','20 %']],
    quest:"Quel prix TTC afficherez-vous en rayon ?",
    rep:ttc,evo:{a:eur(ht),c:'× 1,20',b:eur(ttc)},
    aide1:"TTC = HT × 1,20 quand la TVA est à 20 %.",
    aide2:`${fnum(ht)} × 1,20 = ?`,
    steps:[['Coefficient','1 + 0,20 = 1,20'],['Prix TTC',`${fnum(ht)} × 1,20 = ${fnum(ttc)}`]],
    concl:`Le prix affiché sera de ${eur(ttc)}.`,
    err:[{v:r2(ht*0.2),msg:"Tu as calculé seulement la TVA. Le prix TTC comprend le HT plus la TVA."}]});
}},
{id:'N8b',n:'N8',d:1,f:()=>{
  const pa=prixRond(8,140,2),pv=r2(pa*(1+pick([30,40,50,60,80])/100));
  return Q({role:'Chef de rayon',
    enonce:`Un article est acheté ${eur(pa)} HT au fournisseur et revendu ${eur(pv)} HT.`,
    data:[['Prix d\'achat HT',eur(pa)],['Prix de vente HT',eur(pv)]],
    quest:"Quelle est la marge en euros ?",
    rep:r2(pv-pa),
    aide1:"Marge = prix de vente HT − prix d'achat HT.",
    aide2:`${fnum(pv)} − ${fnum(pa)} = ?`,
    steps:[['Marge',`${fnum(pv)} − ${fnum(pa)} = ${fnum(pv-pa)}`]],
    concl:`L'enseigne réalise une marge de ${eur(r2(pv-pa))} sur cet article.`});
}},
{id:'N8c',n:'N8',d:2,f:()=>{
  const pa=prixRond(10,120,2),t=pick([25,30,40,50,60,75]),pv=r2(pa*(1+t/100));
  const m=r2(pv-pa),tm=r1(m/pa*100);
  return Q({role:'Responsable adjoint',
    enonce:`Un article est acheté ${eur(pa)} HT et revendu ${eur(pv)} HT.`,
    data:[['Prix d\'achat HT',eur(pa)],['Prix de vente HT',eur(pv)]],
    quest:"Quel est le taux de marge, à 0,1 % près ?",
    unite:'%',dec:1,tol:0.2,rep:tm,
    aide1:"Taux de marge = marge ÷ prix d'ACHAT × 100.",
    aide2:`Marge = ${fnum(m)} ; ${fnum(m)} ÷ ${fnum(pa)} × 100 = ?`,
    steps:[['Marge',`${fnum(pv)} − ${fnum(pa)} = ${fnum(m)}`],['Taux de marge',`${fnum(m)} ÷ ${fnum(pa)} × 100 = ${fnum(tm,1)}`]],
    concl:`Le taux de marge est de ${pct(tm)}.`,
    err:[{v:r1(m/pv*100),msg:"Tu as divisé par le prix de vente : c'est le taux de MARQUE. Le taux de marge se calcule sur le prix d'achat."}]});
}},
{id:'N8d',n:'N8',d:2,f:()=>{
  const pa=prixRond(10,120,2),t=pick([25,30,40,50,60,80]),pv=r2(pa*(1+t/100));
  const m=r2(pv-pa),tq=r1(m/pv*100);
  return Q({role:'Responsable adjoint',
    enonce:`Un article est acheté ${eur(pa)} HT et revendu ${eur(pv)} HT.`,
    data:[['Prix d\'achat HT',eur(pa)],['Prix de vente HT',eur(pv)]],
    quest:"Quel est le taux de marque, à 0,1 % près ?",
    unite:'%',dec:1,tol:0.2,rep:tq,
    aide1:"Taux de marque = marge ÷ prix de VENTE × 100.",
    aide2:`Marge = ${fnum(m)} ; ${fnum(m)} ÷ ${fnum(pv)} × 100 = ?`,
    steps:[['Marge',`${fnum(pv)} − ${fnum(pa)} = ${fnum(m)}`],['Taux de marque',`${fnum(m)} ÷ ${fnum(pv)} × 100 = ${fnum(tq,1)}`]],
    concl:`Le taux de marque est de ${pct(tq)}.`,
    err:[{v:r1(m/pa*100),msg:"Tu as divisé par le prix d'achat : c'est le taux de MARGE. Le taux de marque se calcule sur le prix de vente."}]});

{id:'N8e',n:'N8',d:3,f:()=>{

{id:'a1q',n:'N1',d:1,f:()=>{
  const p=prixRond(20,180,10),t=pick([10,20,50]);

function nb(t){ return fnum(t,Number.isInteger(t)?0:1); }
function coefQCM(t,sens,ph){
  const bon=r3(1+sens*t/100), inv=r3(1-sens*t/100);
  const dec=t<10?r3(1+sens*t/10):r3(t/100);
  const opts=[coef(bon),coef(inv),coef(dec),coef(bon)+' %'];
  const ordre=shuffle([0,1,2,3]);
  return A({type:'qcm',prompt:ph(nb(t)),choix:ordre.map(i=>opts[i]),rep:ordre.indexOf(0),
    aide1:sens>0?"Pour une hausse : 1 + taux ÷ 100.":"Pour une baisse : 1 − taux ÷ 100.",
    aide2:`${nb(t)} ÷ 100 = ${fnum(t/100,t<10?3:2)}`,
    steps:[['Taux en écriture décimale',`${nb(t)} ÷ 100 = ${fnum(t/100,t<10?3:2)}`],
           ['Coefficient',`1 ${sens>0?'+':'−'} ${fnum(t/100,t<10?3:2)} = ${coef(bon)}`]],
    concl:`${sens>0?'Une hausse':'Une baisse'} de ${nb(t)} %, c'est × ${coef(bon)}. Un coefficient n'a pas d'unité : ce n'est ni des euros ni des pourcents.`});
}
function coefSAI(t,sens,ph){
  const bon=r3(1+sens*t/100);
  return A({type:'num',prompt:ph(nb(t)),sousPrompt:"Écris le coefficient multiplicateur",
    unite:'',dec:Number.isInteger(t)?2:3,tol:0.0005,rep:bon,
    aide1:sens>0?"Coefficient = 1 + taux ÷ 100.":"Coefficient = 1 − taux ÷ 100.",
    aide2:`${nb(t)} ÷ 100 = ${fnum(t/100,3)}`,
    steps:[['Taux en décimal',`${nb(t)} ÷ 100 = ${fnum(t/100,3)}`],
           ['Coefficient',`1 ${sens>0?'+':'−'} ${fnum(t/100,3)} = ${fnum(bon,Number.isInteger(t)?2:3)}`]],
    concl:`${sens>0?'+':'−'} ${nb(t)} % ⇒ × ${fnum(bon,Number.isInteger(t)?2:3)}.`,
    err:[{v:r3(1-sens*t/100),msg:sens>0?"Tu as retiré le taux à 1 : c'est le coefficient d'une baisse.":"Tu as ajouté le taux à 1 : c'est le coefficient d'une hausse."},

}

        concl:`× ${coef(c)} correspond à ${sens>0?'une hausse':'une baisse'} de ${nb(t)} %.`,
        err:[{v:r1(c*100),msg:"Tu as oublié de retirer 1 avant de multiplier par 100."}]});
    }});

        err:[{v:r2(p*t/100),msg:"Tu as calculé la variation seule, pas le montant final."},
             {v:r2(p*(hausse?1-t/100:1+t/100)),msg:hausse?"Tu as appliqué une baisse alors qu'il s'agit d'une hausse.":"Tu as appliqué une hausse alors qu'il s'agit d'une baisse."}]}); }});
});
const PH_N5=[
 (t,f)=>`Un article soldé ${eur(f)} après −${nb(t)} % : prix d'origine ?`,
 (t,f)=>`Après une remise de ${nb(t)} %, le client paie ${eur(f)}. Quel était le prix affiché ?`,
 (t,f)=>`Le prix a baissé de ${nb(t)} % et vaut aujourd'hui ${eur(f)}. Prix de départ ?`,
 (t,f)=>`Après une hausse de ${nb(t)} %, le tarif atteint ${eur(f)}. Tarif précédent ?`,
 (t,f)=>`Le CA a progressé de ${nb(t)} % et s'élève à ${eur(f)}. CA de l'an dernier ?`
];
PH_N5.forEach((ph,k)=>{
  const hausse=(k>=3);
  AUTO.push({id:'n5'+k,n:'N5',d:3,tr:ph('t','V'),va:'valeur de départ 40→3000 €, t parmi 12 taux',
    f:()=>{ const t=pick([10,15,20,25,30,40,50,5,8,12,35,60].filter(x=>hausse?x<=50:true));
      const init=prixRond(40,3000,10), c=r3(hausse?1+t/100:1-t/100), fv=r2(init*c);
      return A({type:'num',prompt:ph(t,fv),unite:'€',rep:r2(init),evo:{a:eur(r2(init)),c:'× '+coef(c),b:eur(fv)},
        aide1:"On divise la valeur d'arrivée par le coefficient.",aide2:`${fnum(fv)} ÷ ${coef(c)}`,
        steps:[['Coefficient',`1 ${hausse?'+':'−'} ${fnum(t/100,2)} = ${coef(c)}`],['Valeur de départ',`${fnum(fv)} ÷ ${coef(c)} = ${fnum(init)}`]],
        concl:`La valeur de départ était de ${eur(r2(init))}.`,
        err:[{v:r2(fv*c),msg:"Tu as multiplié au lieu de diviser : on remonte à la valeur de départ."},
             {v:r2(fv*(hausse?1-t/100:1+t/100)),msg:"Appliquer l'évolution inverse ne ramène pas au point de départ : la référence a changé."}]}); }});
});
const PH_N6=[
 (a,b)=>`De ${fnum(a,0)} € à ${fnum(b,0)} € : quel taux d'évolution ?`,
 (a,b)=>`Le CA passe de ${fnum(a,0)} € à ${fnum(b,0)} €. Taux d'évolution ?`,
 (a,b)=>`Le panier moyen passe de ${fnum(a,0)} € à ${fnum(b,0)} €. De combien de pourcents ?`,
 (a,b)=>`Les ventes passent de ${fnum(a,0)} unités à ${fnum(b,0)} unités. Taux d'évolution ?`,
 (a,b)=>`La fréquentation passe de ${fnum(a,0)} à ${fnum(b,0)} visiteurs. Taux d'évolution ?`
];
PH_N6.forEach((ph,k)=>{
  AUTO.push({id:'n6'+k,n:'N6',d:2,tr:ph('A','B'),va:'A parmi 12 valeurs, taux parmi 16 valeurs signées',
    f:()=>{ const a=pick([120,150,200,250,320,400,500,640,800,1000,1250,1600]);
      const t=pick([4,5,6,8,10,12,15,20,25,30,-4,-5,-8,-10,-15,-20]);
      const b=r2(a*(1+t/100));
      return A({type:'num',prompt:ph(a,b),sousPrompt:"Signe − pour une baisse",unite:'%',dec:1,tol:0.15,rep:r1(t),
        aide1:"(arrivée − départ) ÷ départ × 100.",aide2:`${fnum(b,0)} − ${fnum(a,0)} = ${fnum(b-a,0)}`,
        steps:[['Variation',`${fnum(b,0)} − ${fnum(a,0)} = ${fnum(b-a,0)}`],
               ['Quotient',`${fnum(b-a,0)} ÷ ${fnum(a,0)} = ${fnum((b-a)/a,4)}`],['En pourcentage',`× 100 = ${fnum(t,1)}`]],
        concl:t>0?`Hausse de ${pct(t)}.`:`Baisse de ${pct(-t)}.`,
        err:[{v:r1((b-a)/b*100),msg:"Tu as divisé par la valeur d'arrivée : la référence est toujours la valeur de départ."},
             {v:r2(b-a),msg:"C'est la variation en valeur absolue, pas le taux en pourcentage."}]}); }});
});
const PH_N7=[
 (a,b)=>`−${a} % puis −${b} % : quelle remise globale ?`,
 (a,b)=>`+${a} % puis +${b} % : quelle hausse globale ?`,
 (a,b)=>`−${a} % puis +${b} % : quelle évolution globale ?`,
 (a,b)=>`Deux démarques successives de ${a} % puis ${b} % : remise totale ?`,
 (a,b)=>`Le CA progresse de ${a} % puis de ${b} % : progression globale ?`
];
PH_N7.forEach((ph,k)=>{
  const s1=(k===1||k===4)?1:-1, s2=(k===1||k===4)?1:(k===2?1:-1);
  AUTO.push({id:'n7'+k,n:'N7',d:3,tr:ph('t1','t2'),va:'t1 et t2 parmi 9 taux (5 à 50 %), 72 couples possibles',
    f:()=>{ const L=[5,10,15,20,25,30,40,50,12];
      let t1=pick(L),t2=pick(L.filter(x=>x!==t1));
      const c=r3((1+s1*t1/100)*(1+s2*t2/100)), tg=r1((c-1)*100);
      return A({type:'num',prompt:ph(t1,t2),sousPrompt:"Taux global, signe − pour une baisse",
        unite:'%',dec:1,tol:0.15,rep:tg,
        aide1:"On multiplie les deux coefficients, puis on retire 1.",
        aide2:`${coef(r3(1+s1*t1/100))} × ${coef(r3(1+s2*t2/100))} = ${fnum(c,4)}`,
        steps:[['Coefficient global',`${coef(r3(1+s1*t1/100))} × ${coef(r3(1+s2*t2/100))} = ${fnum(c,4)}`],
               ['Taux global',`(${fnum(c,4)} − 1) × 100 = ${fnum(tg,1)}`]],
        concl:`L'évolution globale est de ${pct(tg)}, et non ${pct(s1*t1+s2*t2)} : les taux ne s'additionnent pas.`,
        err:[{v:r1(s1*t1+s2*t2),msg:"Tu as additionné les deux taux. Il faut multiplier les coefficients."}]}); }});
});
const PH_N8=[
 v=>`${eur(v)} hors taxes, TVA 20 % : prix TTC ?`,
 v=>`${eur(v)} TTC, TVA 20 % : prix hors taxes ?`,
 v=>`${eur(v)} hors taxes, TVA 5,5 % : prix TTC ?`,
 v=>`${eur(v)} TTC, TVA 10 % : prix hors taxes ?`
];
PH_N8.forEach((ph,k)=>{
  const taux=[20,20,5.5,10][k], sens=(k%2===0)?1:-1;
  AUTO.push({id:'n8'+k,n:'N8',d:2,tr:ph('V'),va:'montant 20→2000 €, taux de TVA fixé par la trame',
    f:()=>{ const base=prixRond(20,2000,10), c=r3(1+taux/100);
      const v=sens>0?base:r2(base*c), rep=sens>0?r2(base*c):base;
      return A({type:'num',prompt:ph(v),unite:'€',rep:rep,
        aide1:sens>0?`TTC = HT × ${coef(c)}.`:`HT = TTC ÷ ${coef(c)}.`,
        aide2:`${fnum(v)} ${sens>0?'×':'÷'} ${coef(c)}`,
        steps:[['Coefficient',`1 + ${fnum(taux/100,3)} = ${coef(c)}`],
               ['Résultat',`${fnum(v)} ${sens>0?'×':'÷'} ${coef(c)} = ${fnum(rep)}`]],
        concl:sens>0?`Le prix TTC est de ${eur(rep)}.`:`Le prix hors taxes est de ${eur(rep)}.`,
        err:[{v:r2(sens>0?v*taux/100:v*(1-taux/100)),msg:sens>0?"Tu as calculé la TVA seule, pas le prix TTC.":`Retirer ${nb(taux)} % du TTC ne donne pas le HT : il faut diviser par ${coef(c)}.`}]}); }});
});
const PH_MARGE=[
 (a,b)=>`Achat ${eur(a)} HT, vente ${eur(b)} HT : taux de marge ?`,
 (a,b)=>`Achat ${eur(a)} HT, vente ${eur(b)} HT : taux de marque ?`,
 (a,b)=>`Achat ${eur(a)} HT, vente ${eur(b)} HT : marge en euros ?`,
 (a,b)=>`Achat ${eur(a)} HT, coefficient multiplicateur appliqué pour obtenir ${eur(b)} ?`
];
PH_MARGE.forEach((ph,k)=>{
  AUTO.push({id:'nm'+k,n:'N8',d:3,tr:ph('PA','PV'),va:'PA 8→150 €, coefficient de vente parmi 8 valeurs',
    f:()=>{ const pa=prixRond(8,150,2), kk=pick([1.3,1.4,1.5,1.6,1.8,2,2.2,2.5]), pv=r2(pa*kk), m=r2(pv-pa);
      const rep=[r1(m/pa*100),r1(m/pv*100),m,r2(pv/pa)][k];
      const un=['%','%','€',''][k];
      return A({type:'num',prompt:ph(pa,pv),unite:un,dec:k<2?1:2,tol:k<2?0.2:0.02,rep:rep,
        aide1:['Marge ÷ prix d\'achat × 100.','Marge ÷ prix de vente × 100.','Vente − achat.','Prix de vente ÷ prix d\'achat.'][k],
        aide2:`Marge = ${fnum(pv)} − ${fnum(pa)} = ${fnum(m)}`,
        steps:[['Marge',`${fnum(pv)} − ${fnum(pa)} = ${fnum(m)}`],['Résultat',fnum(rep,k<2?1:2)+' '+un]],
        concl:['Le taux de marge se calcule toujours sur le prix d\'achat.',
               'Le taux de marque se calcule toujours sur le prix de vente.',
               'La marge est un montant, en euros.',
               'Le coefficient multiplicateur est un nombre sans unité.'][k],
        err:k===0?[{v:r1(m/pv*100),msg:"Tu as divisé par le prix de vente : c'est le taux de marque."}]
           :k===1?[{v:r1(m/pa*100),msg:"Tu as divisé par le prix d'achat : c'est le taux de marge."}]:[]}); }});
});
