function QD(o){ return A(Object.assign({court:false,type:'num'},o)); }
const DOSSIERS=[
{id:'d-smic',titre:"Le SMIC depuis 2019",src:"Source : Insee, SMIC mensuel brut au 1er janvier (35 h)",
 notions:['N6','N7','N4'],
 intro:"Vous préparez une revue de presse pour le cours d'économie-droit. Voici le SMIC mensuel brut au 1er janvier de chaque année.",
 f:()=>{
  const D={2019:1521.22,2020:1539.42,2021:1554.58,2022:1603.12,2023:1709.28,2024:1766.92,2025:1801.80};
  const tab=[['1er janvier 2019',eur(D[2019])],['1er janvier 2020',eur(D[2020])],['1er janvier 2022',eur(D[2022])],
             ['1er janvier 2023',eur(D[2023])],['1er janvier 2025',eur(D[2025])]];
  const ctx="SMIC mensuel brut pour 35 heures par semaine.";
  const t2023=r1((D[2023]/D[2022]-1)*100), tglob=r1((D[2025]/D[2019]-1)*100);
  return [
   QD({shop:'Dossier SMIC',role:'Insee',enonce:ctx,data:tab,
     quest:"Quel est le taux d'évolution du SMIC entre le 1er janvier 2019 et le 1er janvier 2020 ?",
     unite:'%',dec:1,tol:0.15,rep:r1((D[2020]/D[2019]-1)*100),notion:'N6',diff:2,
     aide1:"(arrivée − départ) ÷ départ × 100.",aide2:`${fnum(D[2020])} − ${fnum(D[2019])} = ${fnum(D[2020]-D[2019])}`,
     steps:[['Variation',`${fnum(D[2020])} − ${fnum(D[2019])} = ${fnum(D[2020]-D[2019])}`],
            ['Taux',`${fnum(D[2020]-D[2019])} ÷ ${fnum(D[2019])} × 100 = ${fnum((D[2020]/D[2019]-1)*100,1)}`]],
     concl:`Le SMIC a progressé de ${pct(r1((D[2020]/D[2019]-1)*100))} entre 2019 et 2020.`}),
   QD({shop:'Dossier SMIC',role:'Insee',enonce:ctx,data:tab,
     quest:"Entre le 1er janvier 2022 et le 1er janvier 2023, quel est le taux d'évolution ?",
     unite:'%',dec:1,tol:0.15,rep:t2023,notion:'N6',diff:2,
     aide1:"Même méthode, avec 2022 comme valeur de départ.",aide2:`${fnum(D[2023])} ÷ ${fnum(D[2022])}`,
     steps:[['Variation',`${fnum(D[2023])} − ${fnum(D[2022])} = ${fnum(D[2023]-D[2022])}`],
            ['Taux',`÷ ${fnum(D[2022])} × 100 = ${fnum(t2023,1)}`]],
     concl:`La hausse de ${pct(t2023)} au 1er janvier 2023 est bien supérieure à celle de 2020 : c'est l'effet de l'inflation.`}),
   QD({shop:'Dossier SMIC',role:'Insee',enonce:ctx,data:tab,
     quest:"Quel est le coefficient multiplicateur global entre le 1er janvier 2019 et le 1er janvier 2025 ? (3 décimales)",
     unite:'',dec:3,tol:0.002,rep:r3(D[2025]/D[2019]),notion:'N7',diff:3,
     aide1:"Coefficient = valeur d'arrivée ÷ valeur de départ.",aide2:`${fnum(D[2025])} ÷ ${fnum(D[2019])}`,
     steps:[['Coefficient',`${fnum(D[2025])} ÷ ${fnum(D[2019])} = ${fnum(D[2025]/D[2019],3)}`]],
     concl:`Le SMIC a été multiplié par ${fnum(D[2025]/D[2019],3)} en six ans.`}),
   QD({shop:'Dossier SMIC',role:'Insee',enonce:ctx,data:tab,
     quest:"Quelle est la hausse totale du SMIC entre 2019 et 2025, en pourcentage ?",
     unite:'%',dec:1,tol:0.2,rep:tglob,notion:'N7',diff:3,
     aide1:"Taux = (coefficient global − 1) × 100.",aide2:`${fnum(D[2025]/D[2019],3)} − 1`,
     steps:[['Coefficient global',fnum(D[2025]/D[2019],3)],['Taux global',`(${fnum(D[2025]/D[2019],3)} − 1) × 100 = ${fnum(tglob,1)}`]],
     concl:`Soit ${pct(tglob)} en six ans. Attention : ce n'est pas la somme des hausses annuelles.`}),
   QD({shop:'Dossier SMIC',role:'Insee',enonce:ctx,data:tab,
     quest:"Un salarié travaille à mi-temps et perçoit la moitié du SMIC de janvier 2025. Quel est son salaire brut mensuel ?",
     unite:'€',rep:r2(D[2025]/2),notion:'N1',diff:1,
     aide1:"La moitié, c'est 50 % du montant.",aide2:`${fnum(D[2025])} × 0,50`,
     steps:[['Calcul',`${fnum(D[2025])} × 0,50 = ${fnum(D[2025]/2)}`]],
     concl:`Le salaire brut mensuel est de ${eur(r2(D[2025]/2))}.`}),
   QD({shop:'Dossier SMIC',role:'Insee',enonce:ctx,data:tab,
     quest:"Si le SMIC de 2025 était revalorisé de 2 % l'année suivante, quel montant atteindrait-il ?",
     unite:'€',rep:r2(D[2025]*1.02),notion:'N4',diff:2,
     aide1:"Multiplier par 1,02.",aide2:`${fnum(D[2025])} × 1,02`,
     steps:[['Coefficient','1 + 0,02 = 1,02'],['Montant',`${fnum(D[2025])} × 1,02 = ${fnum(D[2025]*1.02)}`]],
     concl:`Le SMIC atteindrait ${eur(r2(D[2025]*1.02))}. Il s'agit ici d'une hypothèse de travail, pas d'une annonce officielle.`})
  ];}},

{id:'d-lycee',titre:"Les lycéens en France",src:"Source : DEPP, Notes d'information sur les effectifs du second degré (rentrées 2024 et 2025)",
 notions:['N2','N6','N5'],
 intro:"À la rentrée 2025, le second degré public et privé sous contrat accueille 5,621 millions d'élèves, contre 5,636 millions à la rentrée 2024.",
 f:()=>{
  const a=5636000,b=5621000;
  const tab=[['Rentrée 2024','5 636 000 élèves'],['Rentrée 2025','5 621 000 élèves'],
             ['Voie professionnelle 2025','+ 11 500 élèves, soit + 1,8 %'],['Voie générale et technologique','environ 1 600 000 élèves']];
  const ctx="Effectifs du second degré, établissements publics et privés sous contrat.";

   QD({shop:'Dossier effectifs',role:'DEPP',enonce:ctx,data:tab,
     quest:"Quel est le taux d'évolution des effectifs entre la rentrée 2024 et la rentrée 2025 ? (signe −)",
     unite:'%',dec:2,tol:0.03,rep:r2((b/a-1)*100),notion:'N6',diff:3,
     aide1:"(arrivée − départ) ÷ départ × 100.",aide2:`${fnum(b-a,0)} ÷ ${fnum(a,0)}`,
     steps:[['Variation',`5 621 000 − 5 636 000 = −15 000`],['Taux',`−15 000 ÷ 5 636 000 × 100 = ${fnum((b/a-1)*100,2)}`]],
     concl:`La baisse est de ${pct(r2((a-b)/a*100),2)}, ce que la DEPP arrondit à 0,3 %.`}),
   QD({shop:'Dossier effectifs',role:'DEPP',enonce:ctx,data:tab,

     unite:'%',dec:1,tol:0.2,rep:r1(1600000/b*100),notion:'N2',diff:2,bar:{p:1600000,t:b},
     aide1:"partie ÷ tout × 100.",aide2:"1 600 000 ÷ 5 621 000",
     steps:[['Proportion',`1 600 000 ÷ 5 621 000 × 100 = ${fnum(1600000/b*100,1)}`]],
     concl:`La voie générale et technologique représente environ ${pct(r1(1600000/b*100))} des élèves du second degré.`}),
   QD({shop:'Dossier effectifs',role:'DEPP',enonce:ctx,data:tab,
     quest:"La voie professionnelle a gagné 11 500 élèves, soit + 1,8 %. Combien d'élèves comptait-elle avant cette hausse ?",
     unite:'élèves',dec:0,tol:2000,rep:proAvant,notion:'N5',diff:3,
     aide1:"11 500 correspond à 1,8 % de l'effectif de départ.",aide2:"11 500 ÷ 0,018",
     steps:[['Effectif de départ',`11 500 ÷ 0,018 ≈ ${fnum(proAvant,0)}`]],
     concl:`La voie professionnelle comptait environ ${fnum(proAvant,0)} élèves avant cette hausse.`}),
   QD({shop:'Dossier effectifs',role:'DEPP',enonce:ctx,data:tab,
     quest:"Après cette hausse, combien d'élèves la voie professionnelle accueille-t-elle ?",
     unite:'élèves',dec:0,tol:2000,rep:proAvant+11500,notion:'N4',diff:2,
     aide1:"On ajoute les 11 500 élèves à l'effectif de départ.",aide2:`${fnum(proAvant,0)} × 1,018`,
     steps:[['Effectif',`${fnum(proAvant,0)} + 11 500 ≈ ${fnum(proAvant+11500,0)}`]],
     concl:`Environ ${fnum(proAvant+11500,0)} élèves suivent la voie professionnelle.`}),
   QD({shop:'Dossier effectifs',role:'DEPP',enonce:ctx,data:tab,
     quest:"Un lycée professionnel de 640 élèves connaît la même hausse de 1,8 %. Combien d'élèves gagne-t-il ? (arrondir à l'unité)",
     unite:'élèves',dec:0,tol:0.6,rep:Math.round(640*0.018),notion:'N1',diff:2,
     aide1:"640 × 0,018.",aide2:"On arrondit ensuite à l'élève près.",
     steps:[['Calcul',`640 × 0,018 = ${fnum(640*0.018,2)}`],['Arrondi',String(Math.round(640*0.018))]],
     concl:`Le lycée gagnerait ${Math.round(640*0.018)} élèves : un pourcentage faible sur un petit effectif donne un petit nombre.`})
  ];}},

{id:'d-soldes',titre:"Deuxième démarque sur un article déjà soldé",src:"Cas professionnel, période de soldes",
 notions:['N4','N7','N5','N2'],
 intro:"Vous tenez la caisse pendant la deuxième semaine des soldes. Un article a déjà été démarqué une première fois.",
 f:()=>{
  const p=prixRond(60,160,5),t1=pick([20,30,40]),t2=pick([10,20,30]),tf=10;
  const s1=r2(p*(1-t1/100)), s2=r2(s1*(1-t2/100)), s3=r2(s2*(1-tf/100));
  const ctx=`Article affiché ${eur(p)} avant soldes.`;
  const tab=[['Prix d\'origine',eur(p)],['1re démarque','− '+t1+' %'],['2e démarque','− '+t2+' % sur le prix soldé'],['Carte de fidélité','− '+tf+' % supplémentaires']];
  return [
   QD({shop:'Soldes',role:'Hôte de caisse',enonce:ctx,data:tab,quest:"Quel est le prix après la première démarque ?",
     unite:'€',rep:s1,notion:'N4',diff:1,evo:{a:eur(p),c:'× '+coef(1-t1/100),b:eur(s1)},
     aide1:`Multiplier par ${coef(1-t1/100)}.`,aide2:`${fnum(p,0)} × ${coef(1-t1/100)}`,
     steps:[['Prix soldé',`${fnum(p,0)} × ${coef(1-t1/100)} = ${fnum(s1)}`]],concl:`L'article passe à ${eur(s1)}.`}),
   QD({shop:'Soldes',role:'Hôte de caisse',enonce:ctx,data:tab,
     quest:`La deuxième démarque de ${t2} % s'applique sur le prix déjà soldé. Quel est le nouveau prix ?`,
     unite:'€',rep:s2,notion:'N7',diff:2,
     aide1:"La référence est le prix soldé, pas le prix d'origine.",aide2:`${fnum(s1)} × ${coef(1-t2/100)}`,
     steps:[['Nouveau prix',`${fnum(s1)} × ${coef(1-t2/100)} = ${fnum(s2)}`]],
     concl:`Le prix affiché devient ${eur(s2)}.`,
     err:[{v:r2(p*(1-(t1+t2)/100)),msg:"Tu as additionné les deux taux et appliqué le total au prix d'origine."}]}),
   QD({shop:'Soldes',role:'Hôte de caisse',enonce:ctx,data:tab,
     quest:`La cliente présente sa carte de fidélité : ${tf} % de plus en caisse. Combien paie-t-elle ?`,
     unite:'€',rep:s3,notion:'N7',diff:3,
     aide1:"Troisième coefficient à appliquer sur le prix déjà obtenu.",aide2:`${fnum(s2)} × 0,90`,
     steps:[['Prix payé',`${fnum(s2)} × 0,90 = ${fnum(s3)}`]],concl:`La cliente règle ${eur(s3)}.`}),
   QD({shop:'Soldes',role:'Hôte de caisse',enonce:ctx,data:tab,
     quest:"Quelle est la réduction globale par rapport au prix d'origine, en pourcentage ?",
     unite:'%',dec:1,tol:0.25,rep:r1((1-s3/p)*100),notion:'N2',diff:3,
     aide1:"Compare le prix payé au prix d'origine.",aide2:`1 − ${fnum(s3)} ÷ ${fnum(p,0)}`,
     steps:[['Coefficient global',`${fnum(s3)} ÷ ${fnum(p,0)} = ${fnum(s3/p,3)}`],
            ['Réduction',`(1 − ${fnum(s3/p,3)}) × 100 = ${fnum((1-s3/p)*100,1)}`]],
     concl:`La réduction globale atteint ${pct(r1((1-s3/p)*100))}, à comparer aux ${t1+t2+tf} % que l'on obtiendrait en additionnant les taux.`,
     err:[{v:t1+t2+tf,msg:"Les taux ne s'additionnent pas : chaque remise porte sur un prix déjà réduit."}]}),
   QD({shop:'Soldes',role:'Hôte de caisse',enonce:ctx,data:tab,
     quest:"Combien la cliente a-t-elle économisé en euros ?",
     unite:'€',rep:r2(p-s3),notion:'N1',diff:2,
     aide1:"Prix d'origine − prix payé.",aide2:`${fnum(p,0)} − ${fnum(s3)}`,
     steps:[['Économie',`${fnum(p,0)} − ${fnum(s3)} = ${fnum(p-s3)}`]],
     concl:`Elle économise ${eur(r2(p-s3))}.`}),
   QD({shop:'Soldes',role:'Hôte de caisse',enonce:ctx,data:tab,
     quest:"Après les soldes, l'article doit retrouver son prix d'origine à partir du prix soldé de la 2e démarque. De quel pourcentage faut-il l'augmenter ? (0,1 % près)",
     unite:'%',dec:1,tol:0.3,rep:r1((p/s2-1)*100),notion:'N5',diff:3,
     aide1:"Cherche le taux qui fait passer du prix soldé au prix d'origine.",aide2:`${fnum(p,0)} ÷ ${fnum(s2)}`,
     steps:[['Coefficient de retour',`${fnum(p,0)} ÷ ${fnum(s2)} = ${fnum(p/s2,3)}`],
            ['Taux',`(${fnum(p/s2,3)} − 1) × 100 = ${fnum((p/s2-1)*100,1)}`]],
     concl:`Il faut augmenter de ${pct(r1((p/s2-1)*100))} : une baisse ne se compense jamais par une hausse du même taux.`})
  ];}},

{id:'d-tva',titre:"Une facture à deux taux de TVA",src:"Taux de TVA en vigueur en France métropolitaine : 20 %, 10 %, 5,5 %, 2,1 %",
 notions:['N1','N8','N5'],
 intro:"Vous établissez la facture d'un séminaire d'entreprise : location de salle au taux normal, restauration au taux réduit.",
 f:()=>{
  const salle=prixRond(400,1200,20), repas=prixRond(300,900,10);
  const tva1=r2(salle*0.20), tva2=r2(repas*0.10);
  const ctx="Prestation facturée à une entreprise cliente.";
  const tab=[['Location de salle (HT)',eur(salle)],['TVA applicable','20 %'],['Restauration (HT)',eur(repas)],['TVA applicable','10 %']];
  return [
   QD({shop:'Facturation',role:'Assistant commercial',enonce:ctx,data:tab,quest:"Quel est le montant de TVA sur la location de salle ?",
     unite:'€',rep:tva1,notion:'N1',diff:1,aide1:"HT × 0,20.",aide2:`${fnum(salle,0)} × 0,20`,
     steps:[['TVA',`${fnum(salle,0)} × 0,20 = ${fnum(tva1)}`]],concl:`La TVA sur la salle s'élève à ${eur(tva1)}.`}),
   QD({shop:'Facturation',role:'Assistant commercial',enonce:ctx,data:tab,quest:"Quel est le montant de TVA sur la restauration ?",
     unite:'€',rep:tva2,notion:'N1',diff:1,aide1:"HT × 0,10.",aide2:`${fnum(repas,0)} × 0,10`,
     steps:[['TVA',`${fnum(repas,0)} × 0,10 = ${fnum(tva2)}`]],concl:`La TVA sur la restauration s'élève à ${eur(tva2)}.`}),
   QD({shop:'Facturation',role:'Assistant commercial',enonce:ctx,data:tab,quest:"Quel est le total TTC de la facture ?",
     unite:'€',rep:r2(salle+repas+tva1+tva2),notion:'N8',diff:2,
     aide1:"Total HT + les deux TVA.",aide2:`${fnum(salle,0)} + ${fnum(repas,0)} + ${fnum(tva1)} + ${fnum(tva2)}`,
     steps:[['Total HT',`${fnum(salle,0)} + ${fnum(repas,0)} = ${fnum(salle+repas)}`],
            ['Total TVA',`${fnum(tva1)} + ${fnum(tva2)} = ${fnum(tva1+tva2)}`],
            ['Total TTC',fnum(salle+repas+tva1+tva2)]],
     concl:`La facture s'élève à ${eur(r2(salle+repas+tva1+tva2))} TTC.`}),
   QD({shop:'Facturation',role:'Assistant commercial',enonce:ctx,data:tab,
     quest:"Quelle part du total hors taxes la location de salle représente-t-elle ?",
     unite:'%',dec:1,tol:0.2,rep:r1(salle/(salle+repas)*100),notion:'N2',diff:2,bar:{p:salle,t:salle+repas},
     aide1:"Salle ÷ total HT × 100.",aide2:`${fnum(salle,0)} ÷ ${fnum(salle+repas)}`,
     steps:[['Part',`${fnum(salle,0)} ÷ ${fnum(salle+repas)} × 100 = ${fnum(salle/(salle+repas)*100,1)}`]],
     concl:`La salle représente ${pct(r1(salle/(salle+repas)*100))} du montant hors taxes.`}),
   QD({shop:'Facturation',role:'Assistant commercial',enonce:ctx,data:tab,
     quest:`Le client conteste une ligne facturée ${eur(r2(repas*1.10))} TTC au taux de 10 %. Quel est son montant hors taxes ?`,
     unite:'€',rep:repas,notion:'N5',diff:3,
     aide1:"On divise par 1,10.",aide2:`${fnum(repas*1.10)} ÷ 1,10`,
     steps:[['Montant HT',`${fnum(repas*1.10)} ÷ 1,10 = ${fnum(repas)}`]],
     concl:`Le montant hors taxes est bien de ${eur(repas)}.`,
     err:[{v:r2(repas*1.10*0.90),msg:"Retirer 10 % du TTC ne redonne pas le HT : il faut diviser par 1,10."}]})
  ];}},

{id:'d-rayon',titre:"Ouvrir un nouveau rayon",src:"Cas professionnel de gestion commerciale",
 notions:['N8','N4','N6'],
 intro:"Une enseigne ouvre un rayon d'accessoires. Vous construisez les prix et l'objectif de chiffre d'affaires.",
 f:()=>{
  const pa=prixRond(6,40,2), km=pick([1.8,2,2.2,2.5]), pvTTC=r2(pa*km), pvHT=r2(pvTTC/1.2);
  const m=r2(pvHT-pa), q=ri(80,260), obj=pick([6,8,10,12]);
  const ca=r2(pvTTC*q);
  const ctx="Nouveau rayon accessoires, TVA au taux normal de 20 %.";
  const tab=[['Prix d\'achat HT',eur(pa)],['Coefficient multiplicateur',coef(km)],['Ventes prévues',q+' articles']];
  return [
   QD({shop:'Nouveau rayon',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Quel est le prix de vente TTC obtenu avec ce coefficient ?",unite:'€',rep:pvTTC,notion:'N8',diff:2,
     aide1:"PV TTC = PA HT × coefficient.",aide2:`${fnum(pa)} × ${coef(km)}`,
     steps:[['Prix de vente TTC',`${fnum(pa)} × ${coef(km)} = ${fnum(pvTTC)}`]],concl:`L'article sera vendu ${eur(pvTTC)} TTC.`}),
   QD({shop:'Nouveau rayon',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Quel est le prix de vente hors taxes correspondant ?",unite:'€',rep:pvHT,notion:'N5',diff:2,
     aide1:"On divise le TTC par 1,20.",aide2:`${fnum(pvTTC)} ÷ 1,20`,
     steps:[['Prix de vente HT',`${fnum(pvTTC)} ÷ 1,20 = ${fnum(pvHT)}`]],concl:`Le prix de vente hors taxes est de ${eur(pvHT)}.`}),
   QD({shop:'Nouveau rayon',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Quel est le taux de marque de cet article ? (0,1 % près)",unite:'%',dec:1,tol:0.3,rep:r1(m/pvHT*100),notion:'N8',diff:3,
     aide1:"Marge ÷ prix de vente HT × 100.",aide2:`Marge = ${fnum(pvHT)} − ${fnum(pa)} = ${fnum(m)}`,
     steps:[['Marge',`${fnum(pvHT)} − ${fnum(pa)} = ${fnum(m)}`],['Taux de marque',`${fnum(m)} ÷ ${fnum(pvHT)} × 100 = ${fnum(m/pvHT*100,1)}`]],
     concl:`Le taux de marque est de ${pct(r1(m/pvHT*100))}.`,
     err:[{v:r1(m/pa*100),msg:"Divisé par le prix d'achat, c'est le taux de marge."}]}),
   QD({shop:'Nouveau rayon',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:`Avec ${q} articles vendus, quel chiffre d'affaires TTC le rayon réalise-t-il ?`,unite:'€',rep:ca,notion:'N1',diff:2,
     aide1:"Prix de vente TTC × quantité.",aide2:`${fnum(pvTTC)} × ${q}`,
     steps:[['CA TTC',`${fnum(pvTTC)} × ${q} = ${fnum(ca)}`]],concl:`Le rayon réaliserait ${eur(ca)} TTC.`}),
   QD({shop:'Nouveau rayon',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:`La direction demande ${obj} % de plus l'année suivante. Quel CA faut-il atteindre ?`,unite:'€',rep:r2(ca*(1+obj/100)),notion:'N4',diff:2,
     aide1:`Multiplier par ${coef(1+obj/100)}.`,aide2:`${fnum(ca)} × ${coef(1+obj/100)}`,
     steps:[['Objectif',`${fnum(ca)} × ${coef(1+obj/100)} = ${fnum(ca*(1+obj/100))}`]],
     concl:`L'objectif est de ${eur(r2(ca*(1+obj/100)))}.`}),
   QD({shop:'Nouveau rayon',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Combien d'articles faudra-t-il vendre pour atteindre cet objectif, au prix TTC actuel ? (arrondir à l'unité supérieure)",
     unite:'articles',dec:0,tol:1,rep:Math.ceil(ca*(1+obj/100)/pvTTC),notion:'N2',diff:3,
     aide1:"Objectif de CA ÷ prix de vente TTC.",aide2:`${fnum(ca*(1+obj/100))} ÷ ${fnum(pvTTC)}`,
     steps:[['Quantité',`${fnum(ca*(1+obj/100))} ÷ ${fnum(pvTTC)} ≈ ${fnum(ca*(1+obj/100)/pvTTC,1)}`],
            ['Arrondi supérieur',String(Math.ceil(ca*(1+obj/100)/pvTTC))]],
     concl:`Il faudra vendre ${Math.ceil(ca*(1+obj/100)/pvTTC)} articles.`})
  ];}},

{id:'d-hotel',titre:"Une semaine à la réception",src:"Cas professionnel, métiers de l'accueil",
 notions:['N2','N4','N6'],
 intro:"Vous tenez la réception d'un hôtel de 72 chambres et vous préparez le bilan de la semaine.",
 f:()=>{
  const ch=72, nuits=[52,58,61,64,70,66,49], tot=nuits.reduce((a,b)=>a+b,0);
  const tarif=prixRond(84,132,1), maj=pick([12,15,18,20]);
  const ctx="Hôtel de 72 chambres, relevé des sept dernières nuits.";
  const tab=[['Chambres','72'],['Lundi à dimanche',nuits.join(' · ')],['Tarif chambre double',eur(tarif)]];
  return [
   QD({shop:'Réception',role:'Réceptionniste',enonce:ctx,data:tab,
     quest:"Quel est le taux d'occupation du samedi (66 chambres occupées) ? (0,1 % près)",
     unite:'%',dec:1,tol:0.2,rep:r1(66/ch*100),notion:'N2',diff:1,bar:{p:66,t:ch},
     aide1:"Occupées ÷ total × 100.",aide2:"66 ÷ 72",
     steps:[['Taux',`66 ÷ 72 × 100 = ${fnum(66/72*100,1)}`]],concl:`Le taux d'occupation du samedi est de ${pct(r1(66/72*100))}.`}),
   QD({shop:'Réception',role:'Réceptionniste',enonce:ctx,data:tab,
     quest:"Sur la semaine, 504 nuitées étaient possibles. Quel est le taux d'occupation moyen ? (0,1 % près)",
     unite:'%',dec:1,tol:0.2,rep:r1(tot/504*100),notion:'N2',diff:2,bar:{p:tot,t:504},
     aide1:"Total des nuitées vendues ÷ 504 × 100.",aide2:`${tot} ÷ 504`,
     steps:[['Nuitées vendues',nuits.join(' + ')+' = '+tot],['Taux moyen',`${tot} ÷ 504 × 100 = ${fnum(tot/504*100,1)}`]],
     concl:`Le taux d'occupation moyen de la semaine est de ${pct(r1(tot/504*100))}.`}),
   QD({shop:'Réception',role:'Réceptionniste',enonce:ctx,data:tab,
     quest:`En haute saison, le tarif de ${eur(tarif)} est majoré de ${maj} %. Quel sera le tarif ?`,
     unite:'€',rep:r2(tarif*(1+maj/100)),notion:'N4',diff:2,
     aide1:`Multiplier par ${coef(1+maj/100)}.`,aide2:`${fnum(tarif,0)} × ${coef(1+maj/100)}`,
     steps:[['Tarif',`${fnum(tarif,0)} × ${coef(1+maj/100)} = ${fnum(tarif*(1+maj/100))}`]],
     concl:`La nuitée passe à ${eur(r2(tarif*(1+maj/100)))}.`}),
   QD({shop:'Réception',role:'Réceptionniste',enonce:ctx,data:tab,
     quest:`Un client réserve 3 nuits au tarif majoré et verse 30 % d'acompte. Quel montant encaissez-vous ?`,
     unite:'€',rep:r2(tarif*(1+maj/100)*3*0.3),notion:'N1',diff:3,
     aide1:"Calcule le séjour, puis prends-en 30 %.",aide2:`${fnum(tarif*(1+maj/100))} × 3 × 0,30`,
     steps:[['Séjour',`${fnum(tarif*(1+maj/100))} × 3 = ${fnum(tarif*(1+maj/100)*3)}`],
            ['Acompte',`× 0,30 = ${fnum(tarif*(1+maj/100)*3*0.3)}`]],
     concl:`Vous encaissez ${eur(r2(tarif*(1+maj/100)*3*0.3))} d'acompte.`}),
   QD({shop:'Réception',role:'Réceptionniste',enonce:ctx,data:tab,
     quest:"La semaine précédente, 392 nuitées avaient été vendues. Quel est le taux d'évolution ? (0,1 % près, signe −)",
     unite:'%',dec:1,tol:0.3,rep:r1((tot-392)/392*100),notion:'N6',diff:2,
     aide1:"(arrivée − départ) ÷ départ × 100.",aide2:`${tot} − 392 = ${tot-392}`,
     steps:[['Variation',`${tot} − 392 = ${tot-392}`],['Taux',`${tot-392} ÷ 392 × 100 = ${fnum((tot-392)/392*100,1)}`]],
     concl:`La fréquentation a évolué de ${pct(r1((tot-392)/392*100))}.`})
  ];}},

{id:'d-web',titre:"La vente en ligne du magasin",src:"Cas professionnel, e-commerce d'un point de vente",
 notions:['N2','N6','N7'],
 intro:"Une enseigne de centre-ville a ouvert une boutique en ligne. Vous analysez le premier trimestre.",
 f:()=>{
  const vis=prixRond(8000,26000,100), tx=pick([1.5,2,2.5,3,3.5]), cmd=Math.round(vis*tx/100);
  const panier=r2(ri(3400,8600)/100), ret=pick([6,8,10,12]);
  const ca=r2(cmd*panier);
  const ctx="Boutique en ligne du magasin, données du trimestre.";
  const tab=[['Visiteurs du site',fnum(vis,0)],['Commandes',String(cmd)],['Panier moyen',eur(panier)],['Taux de retour',ret+' %']];
  return [
   QD({shop:'Boutique en ligne',role:'Chargé e-commerce',enonce:ctx,data:tab,
     quest:"Quel est le taux de transformation du site ? (0,01 % près)",
     unite:'%',dec:2,tol:0.03,rep:r2(cmd/vis*100),notion:'N2',diff:2,
     aide1:"Commandes ÷ visiteurs × 100.",aide2:`${cmd} ÷ ${fnum(vis,0)}`,
     steps:[['Taux',`${cmd} ÷ ${fnum(vis,0)} × 100 = ${fnum(cmd/vis*100,2)}`]],
     concl:`Le taux de transformation est de ${pct(r2(cmd/vis*100),2)}, un ordre de grandeur courant en e-commerce.`}),
   QD({shop:'Boutique en ligne',role:'Chargé e-commerce',enonce:ctx,data:tab,
     quest:"Quel chiffre d'affaires les commandes représentent-elles ?",unite:'€',rep:ca,notion:'N1',diff:1,
     aide1:"Commandes × panier moyen.",aide2:`${cmd} × ${fnum(panier)}`,
     steps:[['CA',`${cmd} × ${fnum(panier)} = ${fnum(ca)}`]],concl:`Le CA du trimestre est de ${eur(ca)}.`}),
   QD({shop:'Boutique en ligne',role:'Chargé e-commerce',enonce:ctx,data:tab,
     quest:`Avec ${ret} % de retours, quel CA reste-t-il réellement acquis ?`,unite:'€',rep:r2(ca*(1-ret/100)),notion:'N4',diff:2,
     aide1:`Multiplier par ${coef(1-ret/100)}.`,aide2:`${fnum(ca)} × ${coef(1-ret/100)}`,
     steps:[['CA net',`${fnum(ca)} × ${coef(1-ret/100)} = ${fnum(ca*(1-ret/100))}`]],
     concl:`Après retours, il reste ${eur(r2(ca*(1-ret/100)))}.`}),
   QD({shop:'Boutique en ligne',role:'Chargé e-commerce',enonce:ctx,data:tab,
     quest:"L'objectif est d'augmenter le trafic de 20 % puis la transformation de 10 %. De combien de pourcents les commandes augmenteraient-elles ? (0,1 % près)",
     unite:'%',dec:1,tol:0.2,rep:32,notion:'N7',diff:3,
     aide1:"Les deux effets se multiplient.",aide2:"1,20 × 1,10 = 1,32",
     steps:[['Coefficient global','1,20 × 1,10 = 1,32'],['Taux','(1,32 − 1) × 100 = 32']],
     concl:"Les commandes progresseraient de 32 %, et non de 30 %.",
     err:[{v:30,msg:"Tu as additionné les deux taux. Les effets se multiplient."}]}),
   QD({shop:'Boutique en ligne',role:'Chargé e-commerce',enonce:ctx,data:tab,
     quest:"Avec cette progression de 32 %, combien de commandes seraient enregistrées ? (arrondir à l'unité)",
     unite:'commandes',dec:0,tol:1,rep:Math.round(cmd*1.32),notion:'N4',diff:2,
     aide1:`${cmd} × 1,32.`,aide2:"On arrondit à la commande près.",
     steps:[['Commandes',`${cmd} × 1,32 = ${fnum(cmd*1.32,1)}`]],
     concl:`Environ ${Math.round(cmd*1.32)} commandes.`})
  ];}},

{id:'d-offres',titre:"Comparer trois offres promotionnelles",src:"Cas professionnel, opérations commerciales",
 notions:['N7','N2','N4'],
 intro:"Un rayon doit choisir entre trois mécaniques promotionnelles pour un article vendu à l'unité.",
 f:()=>{
  const p=prixRond(20,60,5);
  const A2=r2(1.5*p), B2=r2(2*p*0.75), C3=r2(2*p);
  const ctx=`Article vendu ${eur(p)} pièce. Trois offres sont à l'étude.`;
  const tab=[['Offre A','le 2e article à − 50 %'],['Offre B','− 25 % sur les deux articles'],['Offre C','3 articles pour le prix de 2']];
  return [
   QD({shop:'Promotions',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Avec l'offre A, combien un client paie-t-il pour deux articles ?",unite:'€',rep:A2,notion:'N4',diff:2,
     aide1:"Un article plein tarif, un à moitié prix.",aide2:`${fnum(p,0)} + ${fnum(p*0.5)}`,
     steps:[['Total',`${fnum(p,0)} + ${fnum(p*0.5)} = ${fnum(A2)}`]],concl:`Le client paie ${eur(A2)} pour deux articles.`}),
   QD({shop:'Promotions',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Avec l'offre B, combien paie-t-il pour deux articles ?",unite:'€',rep:B2,notion:'N4',diff:1,
     aide1:"Deux articles puis 25 % de remise sur le total.",aide2:`${fnum(2*p,0)} × 0,75`,
     steps:[['Total',`${fnum(2*p,0)} × 0,75 = ${fnum(B2)}`]],concl:`Le client paie ${eur(B2)}.`}),
   QD({shop:'Promotions',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"À quelle remise globale l'offre A correspond-elle sur les deux articles ? (en %)",
     unite:'%',dec:1,tol:0.15,rep:25,notion:'N7',diff:2,
     aide1:"Compare le prix payé au prix de deux articles plein tarif.",aide2:`${fnum(A2)} ÷ ${fnum(2*p,0)}`,
     steps:[['Coefficient',`${fnum(A2)} ÷ ${fnum(2*p,0)} = 0,75`],['Remise','(1 − 0,75) × 100 = 25']],
     concl:"L'offre A et l'offre B sont exactement équivalentes : 25 % de remise sur deux articles.",
     err:[{v:50,msg:"Les 50 % ne portent que sur un seul des deux articles."}]}),
   QD({shop:'Promotions',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"À quelle remise globale l'offre C correspond-elle, pour trois articles ? (0,1 % près)",
     unite:'%',dec:1,tol:0.2,rep:r1(100/3),notion:'N7',diff:3,
     aide1:"On paie 2 articles au lieu de 3.",aide2:`${fnum(C3)} ÷ ${fnum(3*p,0)}`,
     steps:[['Coefficient',`2 ÷ 3 ≈ 0,667`],['Remise','(1 − 0,667) × 100 ≈ 33,3']],
     concl:"L'offre C équivaut à 33,3 % de remise, mais impose l'achat de trois articles.",
     err:[{v:50,msg:"Un article offert sur trois, ce n'est pas la moitié du prix."}]}),
   QD({shop:'Promotions',role:'Chef de rayon',enonce:ctx,data:tab,
     quest:"Un client n'achète qu'un seul article. Avec quelle offre paie-t-il le moins cher ?",
     type:'qcm',choix:["L'offre B","L'offre A","L'offre C","Les trois se valent"],rep:0,notion:'N2',diff:2,
     aide1:"Les offres A et C exigent plusieurs articles.",aide2:"Seule l'offre B s'applique dès le premier article.",
     steps:[['Offre B sur 1 article',`${fnum(p,0)} × 0,75 = ${fnum(p*0.75)}`],['Offres A et C','sans effet sur un seul article']],
     concl:`Pour un seul article, seule l'offre B fait baisser le prix, à ${eur(r2(p*0.75))}.`})
  ];}}
];


/* ─── familles complémentaires : équilibrage par notion ──────── */
const PH_N2=[
 (p,t)=>`${p} clients sur ${t} ont acheté. Quel est le taux de transformation ?`,
 (p,t)=>`${p} chambres occupées sur ${t}. Quel est le taux d'occupation ?`,
 (p,t)=>`${p} avis positifs sur ${t} avis. Quel est le taux de satisfaction ?`,
 (p,t)=>`${p} articles retournés sur ${t} vendus. Quel est le taux de retour ?`,
 (p,t)=>`${p} € de CA sur ${t} € pour le magasin. Quelle part le rayon représente-t-il ?`,
 (p,t)=>`${p} colis livrés à l'heure sur ${t}. Quel est le taux de respect des délais ?`
];
PH_N2.forEach((ph,k)=>{
  AUTO.push({id:'p2'+k,n:'N2',d:2,tr:ph('partie','tout'),va:'tout parmi 14 valeurs (40 à 2 500), taux parmi 12 valeurs',
    f:()=>{ const tot=pick([40,50,60,72,80,120,150,200,250,320,400,600,900,2500]);
      const t=pick([8,10,12,15,18,20,25,30,35,45,60,75]), part=Math.round(tot*t/100);
      return A({type:'num',prompt:ph(fnum(part,0),fnum(tot,0)),sousPrompt:"Arrondir à 0,1 %",
        unite:'%',dec:1,tol:0.15,rep:r1(part/tot*100),bar:{p:part,t:tot},

/* ─── QCM de reconnaissance : quelle opération faut-il poser ? ── */
function QOP(n,d,tr,va,f){ AUTO.push({id:'op'+n+d,n:n,d:d,tr:tr,va:va,f:f}); }
QOP('N1',1,"Quelle opération donne t % de P € ?",'P parmi 12 valeurs, t parmi 8 taux',()=>{
  const p=prixRond(40,400,20),t=pick(TX_S);
  const bon=`${fnum(p,0)} × ${fnum(t/100,2)}`;
  const o=shuffle([bon,`${fnum(p,0)} × ${t}`,`${fnum(p,0)} ÷ ${t}`,`${fnum(p,0)} − ${t}`]);
  return A({type:'qcm',prompt:`Quelle opération donne ${t} % de ${eur(p)} ?`,choix:o,rep:o.indexOf(bon),
    aide1:"Prendre t %, c'est multiplier par t ÷ 100.",aide2:`${t} ÷ 100 = ${fnum(t/100,2)}`,
    steps:[['Opération',`${fnum(p,0)} × ${fnum(t/100,2)} = ${fnum(p*t/100)}`]],
    concl:`${t} % de ${eur(p)} font ${eur(r2(p*t/100))}.`});
});

  const tot=pick([40,60,80,120,150,200,250,400]),t=pick([15,20,25,30,40,60]),part=Math.round(tot*t/100);
  const bon=`${part} ÷ ${tot} × 100`;
  const o=shuffle([bon,`${tot} ÷ ${part} × 100`,`${part} × ${tot} ÷ 100`,`(${tot} − ${part}) ÷ ${tot} × 100`]);
  return A({type:'qcm',prompt:`${part} chambres occupées sur ${tot}. Quelle opération donne le taux d'occupation ?`,
    choix:o,rep:o.indexOf(bon),aide1:"partie ÷ tout × 100.",aide2:"Le tout est le nombre le plus grand.",
    steps:[['Opération',`${part} ÷ ${tot} × 100 = ${fnum(part/tot*100,1)}`]],
    concl:`Le taux d'occupation est de ${pct(r1(part/tot*100))}.`});
});

QOP('N7',1,"Quelle opération donne le coefficient global ?",'2 taux parmi 6, 30 couples possibles',()=>{
  const L=[10,20,25,30,40,50]; const t1=pick(L),t2=pick(L.filter(x=>x!==t1));
  const c1=coef(1-t1/100),c2=coef(1-t2/100);
  const bon=`${c1} × ${c2}`;
  const o=shuffle([bon,`${c1} + ${c2}`,`1 − ${fnum((t1+t2)/100,2)}`,`${c1} ÷ ${c2}`]);
  return A({type:'qcm',prompt:`Une remise de ${t1} % puis de ${t2} %. Quelle opération donne le coefficient global ?`,
    choix:o,rep:o.indexOf(bon),aide1:"Les coefficients se multiplient.",aide2:"Les taux, eux, ne s'additionnent jamais.",
    steps:[['Coefficient global',`${c1} × ${c2} = ${fnum((1-t1/100)*(1-t2/100),3)}`],
           ['Remise globale',`${fnum((1-(1-t1/100)*(1-t2/100))*100,1)} %`]],
    concl:`La remise globale vaut ${pct(r1((1-(1-t1/100)*(1-t2/100))*100))}, pas ${t1+t2} %.`});
});
QOP('N2',2,"Relier chaque situation à sa proportion",'4 couples tirés parmi 6 situations',()=>{
  const base=[[30,120],[45,150],[60,240],[36,90],[28,70],[81,270]];
  const p=picks(base,4).map(([a,b])=>[`${a} sur ${b}`,pct(r1(a/b*100))]);
  const vus=[],out=[];
  p.forEach(x=>{ if(!vus.includes(x[1])){ vus.push(x[1]); out.push(x); } });
  while(out.length<3) out.push(p[out.length]);
  return A({type:'relier',prompt:"Relie chaque situation à sa proportion",paires:shuffle(out),
    aide1:"partie ÷ tout × 100.",aide2:"On peut simplifier la fraction avant de calculer.",
    steps:out.map(x=>[x[0],x[1]]),concl:"Une même proportion peut cacher des effectifs très différents."});
});
QOP('N8',1,"Quelle opération donne le prix TTC ou le prix HT ?",'montant parmi 10 valeurs, sens et taux variables',()=>{
  const ht=prixRond(20,400,10),sens=pick([1,-1]),t=pick([20,10,5.5]),c=coef(1+t/100);
  const v=sens>0?ht:r2(ht*(1+t/100));
  const bon=sens>0?`${fnum(v,0)} × ${c}`:`${fnum(v)} ÷ ${c}`;
  const o=shuffle([bon,sens>0?`${fnum(v,0)} ÷ ${c}`:`${fnum(v)} × ${c}`,
    `${fnum(v)} × ${fnum(t/100,3)}`,`${fnum(v)} ${sens>0?'+':'−'} ${nb(t)}`]);
  return A({type:'qcm',prompt:sens>0?`${eur(v)} hors taxes, TVA ${nb(t)} %. Quelle opération donne le prix TTC ?`
      :`${eur(v)} TTC, TVA ${nb(t)} %. Quelle opération donne le prix hors taxes ?`,
    choix:o,rep:o.indexOf(bon),aide1:`Le coefficient de TVA est ${c}.`,
    aide2:sens>0?"On multiplie pour monter au TTC.":"On divise pour redescendre au HT.",
    steps:[['Opération',bon+' = '+fnum(sens>0?v*(1+t/100):v/(1+t/100))]],
    concl:sens>0?"TTC = HT × coefficient.":"HT = TTC ÷ coefficient."});
});

    const bon=`${fnum(cf,0)} ÷ ${coef(t/100)}`; const o=shuffle([bon,`${fnum(cf,0)} × ${coef(t/100)}`,`${fnum(cf,0)} × ${coef(1+t/100)}`,`${fnum(cf,0)} ÷ ${coef(1-t/100)}`]);
    return A({type:'qcm',prompt:`Charges fixes ${eur(cf)}, taux de marge sur coût variable ${t} %. Quelle opération donne le seuil de rentabilité ?`,
      choix:o,rep:o.indexOf(bon),aide1:"Charges fixes ÷ taux de MCV.",aide2:"Le seuil est toujours supérieur aux charges fixes : on divise par un nombre inférieur à 1.",
      steps:[['Seuil',`${fnum(cf,0)} ÷ ${coef(t/100)} = ${fnum(cf/(t/100))}`]],concl:`Le seuil vaut ${eur(r2(cf/(t/100)))}.`}); }});
AUTO.push({id:'u9a',n:'N9',d:2,tr:"Résultat unitaire (nombre + unité)",va:'coût de revient 10→150 €, PV 5→40 % au-dessus',
  f:()=>{ const cr=r2(ri(1000,15000)/100), pv=r2(cr*pick([1.05,1.1,1.2,1.3,1.4]));
    return QU({prompt:`Coût de revient ${eur(cr)}, prix de vente ${eur(pv)} HT.`,sousPrompt:"Quel est le résultat par article ? Nombre et unité",
      rep:r2(pv-cr),dec:2,repUnite:'€',unites:['€','%','articles','sans unité'],
      aide1:"Résultat = prix de vente − coût de revient.",aide2:"Un résultat est un montant, en euros.",
      steps:[['Résultat',`${fnum(pv)} − ${fnum(cr)} = ${fnum(pv-cr)}`]],concl:`Le résultat est de ${eur(r2(pv-cr))} par article.`}); }});
AUTO.push({id:'r9a',n:'N9',d:2,tr:"Relier chaque notion de coût à sa formule",va:'ordre aléatoire de 4 couples fixes',
  f:()=>{ const p=[["Coût d'achat","prix d'achat + frais d'achat"],["Coût de revient","coût d'achat + frais de distribution"],

      aide1:"Les coûts s'empilent ; le résultat compare la vente au dernier coût.",aide2:"Le seuil est le seul calcul qui divise.",
      steps:p.map(x=>[x[0],x[1]]),concl:"Quatre formules, quatre étages de la rentabilité."}); }});
AUTO.push({id:'t9a',n:'N9',d:2,tr:"Trier les frais : coût d'achat ou frais de distribution ?",va:'6 frais tirés parmi 10',
  f:()=>{ const a=[{t:'Transport du fournisseur',b:0},{t:'Droits de douane',b:0},{t:'Assurance du transport',b:0},{t:'Frais de réception en entrepôt',b:0},{t:'Emballage d\'origine',b:0}];
    const d=[{t:'Publicité en magasin',b:1},{t:'Sac de caisse',b:1},{t:'Livraison au client',b:1},{t:'Commission du vendeur',b:1},{t:'Étiquetage en rayon',b:1}];

AUTO.push({id:'g9a',n:'N9',d:2,tr:"Compléter un tableau de marges sur coût variable",va:'3 articles, PV et charges tirés au hasard',
  f:()=>{ const rows=[0,1,2].map(()=>{ const pv=prixRond(20,120,5), cv=r2(pv*pick([0.5,0.6,0.7])); return [pv,cv]; });
    return A({type:'grille',prompt:"Complète la colonne des marges sur coût variable",sousPrompt:"MCV = prix de vente − charges variables",
      cols:['Prix de vente','Charges variables','MCV'],
      rows:rows.map(r=>({cells:[{v:eur(r[0])},{v:eur(r[1])},{input:true,rep:r2(r[0]-r[1]),dec:2}]})),

      steps:rows.map(r=>[`${fnum(r[0])} − ${fnum(r[1])}`,eur(r2(r[0]-r[1]))]),concl:"La MCV sert ensuite à calculer le seuil de rentabilité."}); }});
AUTO.push({id:'f9a',n:'N9',d:2,tr:"Compléter la formule du coût marginal",va:'formulation fixe',
  f:()=>A({type:'formule',prompt:"Coût marginal",sousPrompt:"Complète la formule",

AUTO.push({id:'n9v',n:'N9',d:2,tr:"Charges variables à partir de leur taux",va:'CA 5 000→80 000 €, taux 45→75 %',
  f:()=>{ const ca=prixRond(5000,80000,500), t=pick([45,50,55,60,65,70,75]);
    return A({type:'num',prompt:`CA ${eur(ca)}, charges variables égales à ${t} % du CA.`,sousPrompt:"Quel est le montant de la marge sur coût variable ?",
      unite:'€',rep:r2(ca*(1-t/100)),aide1:"MCV = CA × (1 − taux de charges variables).",aide2:`${fnum(ca,0)} × ${coef(1-t/100)}`,
      steps:[['Charges variables',`${fnum(ca,0)} × ${fnum(t/100,2)} = ${fnum(ca*t/100)}`],['MCV',`${fnum(ca,0)} − ${fnum(ca*t/100)} = ${fnum(ca*(1-t/100))}`]],
      concl:`La marge sur coût variable est de ${eur(r2(ca*(1-t/100)))}, soit ${100-t} % du CA.`}); }});

AUTO.push({id:'s10a',n:'N10',d:1,tr:"Intérêts d'une année sur un livret réglementé (taux réel du Livret A)",va:'capital 300→22 950 €, taux tiré de l\'historique 2023-2026',
  f:()=>{ const c=prixRond(300,22950,50), l=pick(LIVRET), t=parseNum(l[1]);

      data:[['Capital',eur(c)],['Taux annuel',l[1]]],quest:"Combien d'intérêts ce capital rapporte-t-il en un an ?",unite:'€',rep:r2(c*t/100),
      aide1:"Intérêts d'une année = capital × taux.",aide2:`${fnum(c,0)} × ${fnum(t/100,3)}`,
      steps:[['Intérêts',`${fnum(c,0)} × ${fnum(t/100,3)} = ${fnum(c*t/100)}`]],
      concl:`Le livret rapporte ${eur(r2(c*t/100))} sur l'année, nets d'impôt.`}); }});
AUTO.push({id:'s10b',n:'N10',d:2,tr:"Valeur acquise d'un placement d'entreprise sur plusieurs années",va:'capital 5 000→60 000 €, taux 1,5→4 %, durée 2→6 ans',
  f:()=>{ const c=prixRond(5000,60000,500), t=pick([1.5,2,2.5,3,3.5,4]), n=ri(2,6), v=r2(c*Math.pow(1+t/100,n));
    return SIT({role:'Assistant de gestion',enonce:`La boutique place sa trésorerie excédentaire, ${eur(c)}, sur un compte rémunéré à ${nb(t)} % par an, intérêts composés.`,

      aide1:"Valeur acquise = C × (1 + t)ⁿ.",aide2:`${fnum(c,0)} × ${coef(1+t/100)}^${n}`,
      steps:[['Coefficient',coef(1+t/100)],['Valeur acquise',`${fnum(c,0)} × ${coef(1+t/100)}^${n} = ${fnum(v)}`]],
      concl:`La boutique disposera de ${eur(v)}, soit ${eur(r2(v-c))} d'intérêts.`}); }});
AUTO.push({id:'s10c',n:'N10',d:3,tr:"Intérêts d'un crédit fournisseur sur quelques jours",va:'facture 2 000→30 000 €, taux 4→9 %, délai 30→120 jours',
  f:()=>{ const f=prixRond(2000,30000,100), t=pick([4,5,6,7,8,9]), j=pick([30,45,60,90,120]);
    const i=r2(f*t/100*j/360);
    return SIT({role:'Assistant commercial',enonce:`Un fournisseur accorde un délai de paiement de ${j} jours sur une facture de ${eur(f)}, moyennant un taux d'intérêt de ${t} % par an. L'année commerciale compte 360 jours.`,
      data:[['Facture',eur(f)],['Taux annuel',t+' %'],['Délai',j+' jours']],quest:"Quel est le montant des intérêts pour ce délai ?",unite:'€',rep:i,
      aide1:"Intérêts simples : C × t × n, avec n en fraction d'année (jours ÷ 360).",aide2:`${fnum(f,0)} × ${fnum(t/100,2)} × ${j} ÷ 360`,
      steps:[['Durée en année',`${j} ÷ 360 = ${fnum(j/360,4)}`],['Intérêts',`${fnum(f,0)} × ${fnum(t/100,2)} × ${fnum(j/360,4)} = ${fnum(i)}`]],
      concl:`Le délai coûte ${eur(i)} d'intérêts.`,
      err:[{v:r2(f*t/100),msg:"Tu as compté une année entière : il faut ramener la durée en fraction d'année."}]}); }});
AUTO.push({id:'s10d',n:'N10',d:3,tr:"Écart entre deux placements de taux différents",va:'capital 2 000→20 000 €, taux 1,5→4 %, durée 3→8 ans',
  f:()=>{ const c=prixRond(2000,20000,500), t1=pick([1.5,2,2.5]), t2=pick([3,3.5,4]), n=ri(3,8);

      data:[['Capital',eur(c)],['Placement 1',nb(t1)+' %'],['Placement 2',nb(t2)+' %'],['Durée',n+' ans']],
      quest:"Quel écart de valeur acquise y a-t-il entre les deux au terme ?",unite:'€',tol:0.1,rep:r2(v2-v1),
      aide1:"Calcule les deux valeurs acquises et fais la différence.",aide2:`${fnum(v2)} − ${fnum(v1)}`,
      steps:[['Placement 1',`${fnum(c,0)} × ${coef(1+t1/100)}^${n} = ${fnum(v1)}`],['Placement 2',`${fnum(c,0)} × ${coef(1+t2/100)}^${n} = ${fnum(v2)}`],['Écart',fnum(v2-v1)]],

AUTO.push({id:'s10e',n:'N10',d:3,tr:"Retrouver le taux annuel à partir des intérêts simples",va:'capital 1 000→15 000 €, durée 1→5 ans',
  f:()=>{ const c=prixRond(1000,15000,500), t=pick([1,1.5,2,2.5,3,4,5]), n=ri(1,5), i=r2(c*t/100*n);

      aide1:"t = I ÷ (C × n).",aide2:`${fnum(i)} ÷ (${fnum(c,0)} × ${n})`,
      steps:[['Intérêts d\'une année',`${fnum(i)} ÷ ${n} = ${fnum(i/n)}`],['Taux',`${fnum(i/n)} ÷ ${fnum(c,0)} × 100 = ${fnum(t,1)}`]],

      concl:`Le prix atteindra ${eur(r2(p*Math.pow(1+t/100,n)))}.`,

AUTO.push({id:'s10g',n:'N10',d:3,tr:"Capital à placer pour atteindre un objectif",va:'objectif 3 000→30 000 €, taux 2→4 %, durée 2→6 ans',

      concl:`Il doit placer ${eur(r2(obj/Math.pow(1+t/100,n)))} aujourd'hui.`}); }});

AUTO.push({id:'q10a',n:'N10',d:1,tr:"Quelle formule donne la valeur acquise ?",va:'variante simples ou composés',
  f:()=>{ const comp=pick([true,false]), c=prixRond(1000,10000,500), t=pick([2,3,4]), n=ri(2,6);
    const bon=comp?`${fnum(c,0)} × ${coef(1+t/100)}^${n}`:`${fnum(c,0)} × (1 + ${fnum(t/100,2)} × ${n})`;
    const o=shuffle([bon,comp?`${fnum(c,0)} × (1 + ${fnum(t/100,2)} × ${n})`:`${fnum(c,0)} × ${coef(1+t/100)}^${n}`,`${fnum(c,0)} × ${fnum(t/100,2)} × ${n}`,`${fnum(c,0)} + ${t} × ${n}`]);
    return A({type:'qcm',prompt:`${eur(c)} placés ${n} ans à ${t} %, intérêts ${comp?'composés':'simples'}. Quelle opération donne la valeur acquise ?`,
      choix:o,rep:o.indexOf(bon),aide1:comp?"Composés : coefficient à la puissance.":"Simples : capital × (1 + t × n).",
      aide2:"La valeur acquise inclut le capital de départ.",
      steps:[['Opération',bon]],concl:comp?"En composés, on élève le coefficient à la puissance n.":"En simples, les intérêts s'ajoutent sans se capitaliser."}); }});
AUTO.push({id:'q10b',n:'N10',d:2,tr:"Lire un tableau de capitalisation : quelle année dépasse un seuil ?",va:'capital et taux tirés au hasard',
  f:()=>{ const c=pick([1000,2000,5000]), t=pick([3,4,5]), seuil=r2(c*pick([1.1,1.15,1.2,1.25]));
    let n=1; while(c*Math.pow(1+t/100,n)<seuil) n++;
    const o=shuffle([String(n),String(n+1),String(Math.max(1,n-1)),String(n+2)].filter((x,i,a)=>a.indexOf(x)===i));
    while(o.length<4) o.push(String(n+3+o.length));
    return A({type:'qcm',prompt:`${eur(c)} placés à ${t} % en intérêts composés. À partir de quelle année le capital dépasse-t-il ${eur(seuil)} ?`,
      choix:o.map(x=>'Année '+x),rep:o.indexOf(String(n)),aide1:"Multiplie par le coefficient année après année jusqu'à dépasser le seuil.",
      aide2:`Année 1 : ${fnum(c*(1+t/100))} ; année 2 : ${fnum(c*Math.pow(1+t/100,2))}…`,
      steps:[['Année '+n,`${fnum(c,0)} × ${coef(1+t/100)}^${n} = ${fnum(c*Math.pow(1+t/100,n))}`]],
      concl:`Le seuil est dépassé la ${n}${n===1?'re':'e'} année.`}); }});

AUTO.push({id:'q10c',n:'N10',d:2,tr:"Doubler le taux double-t-il les intérêts composés ?",va:'capital et durée tirés au hasard',
  f:()=>{ const c=pick([1000,2000,5000]), n=ri(4,10);
    const i1=r2(c*Math.pow(1.02,n)-c), i2=r2(c*Math.pow(1.04,n)-c);
    return A({type:'qcm',prompt:`${eur(c)} placés ${n} ans. À 2 %, les intérêts composés font ${eur(i1)}. À 4 %, ils font ${eur(i2)}.`,
      sousPrompt:"Que constate-t-on ?",choix:shuffle(["Plus du double, car les intérêts se capitalisent","Exactement le double","Moins du double","Impossible de comparer"]),rep:-1,bonTexte:"Plus du double, car les intérêts se capitalisent",
      aide1:`${fnum(i2)} ÷ ${fnum(i1)} = ${fnum(i2/i1,2)}`,aide2:"En intérêts simples, ce serait exactement le double.",
      steps:[['Rapport',`${fnum(i2)} ÷ ${fnum(i1)} = ${fnum(i2/i1,2)}`]],concl:"Avec des intérêts composés, doubler le taux fait plus que doubler les intérêts."}); }});

/* ─── N11 ────────────────────────────────────────────────────── */
AUTO.push({id:'s11a',n:'N11',d:2,tr:"Lire trois indices et repérer la meilleure progression",va:'3 rayons, indices 88→140',
  f:()=>{ const rs=picks(RAY,3), is=picks([88,95,104,108,112,118,125,132,140],3);
    const k=is.indexOf(Math.max(...is));
    return SIT({role:'Responsable de magasin',enonce:`Les indices de chiffre d'affaires des rayons, base 100 l'an dernier, sont : ${rs.map((r,i)=>r+' '+is[i]).join(' ; ')}.`,
      data:rs.map((r,i)=>['Rayon '+r,'indice '+is[i]]),type:'qcm',quest:"Quel rayon a le plus progressé ?",
      choix:rs.map(r=>'Le rayon '+r).concat(['Ils ont tous progressé pareil']),rep:k,
      aide1:"On compare les indices entre eux : le plus élevé a le plus progressé.",aide2:"Un indice sous 100 signifie une baisse.",
      steps:rs.map((r,i)=>[r,'indice '+is[i]+' → '+(is[i]>=100?'+':'−')+Math.abs(is[i]-100)+' %']),
      concl:`Le rayon ${rs[k]} progresse le plus, avec + ${is[k]-100} %.`}); }});
AUTO.push({id:'s11b',n:'N11',d:3,tr:"Taux d'évolution entre deux années à partir de leurs indices",va:'indices 90→150',
  f:()=>{ const i1=pick([104,108,112,118,120,125]), i2=pick([110,115,124,130,135,140,150].filter(x=>x!==i1));
    const t=r1((i2/i1-1)*100);
    return SIT({role:'Responsable adjoint',enonce:`Base 100 en année 1. L'indice du CA vaut ${i1} en année 2 et ${i2} en année 3.`,
      data:[['Indice année 2',String(i1)],['Indice année 3',String(i2)]],quest:"Quel est le taux d'évolution entre l'année 2 et l'année 3 ? (0,1 % près)",
      unite:'%',dec:1,tol:0.2,rep:t,aide1:"On compare les deux indices comme deux valeurs : (arrivée − départ) ÷ départ.",
      aide2:`(${i2} − ${i1}) ÷ ${i1} × 100`,
      steps:[['Variation',`${i2} − ${i1} = ${i2-i1}`],['Taux',`${i2-i1} ÷ ${i1} × 100 = ${fnum(t,1)}`]],
      concl:`Entre l'année 2 et l'année 3, le CA a évolué de ${pct(t)}, et non de ${i2-i1} % : la référence n'est plus 100.`,
      err:[{v:i2-i1,msg:"Tu as soustrait les indices. Entre deux années dont aucune n'est la base, on divise par l'indice de départ."}]}); }});
AUTO.push({id:'s11c',n:'N11',d:2,tr:"CA d'un rayon à partir de la référence et de l'indice",va:'référence 30 000→300 000 €, indice 85→140',
  f:()=>{ const v0=prixRond(30000,300000,1000), i=pick([85,92,96,105,110,118,125,132,140]);
    return SIT({role:'Chef de rayon',enonce:`Le rayon ${pick(RAY)} avait réalisé ${eur(v0)} l'année de référence. Son indice cette année est de ${i}.`,
      data:[['CA de référence',eur(v0)],['Indice','base 100 → '+i]],quest:"Quel est le CA de cette année ?",unite:'€',rep:r2(v0*i/100),
      aide1:"CA = référence × indice ÷ 100.",aide2:`${fnum(v0,0)} × ${fnum(i/100,2)}`,
      steps:[['CA',`${fnum(v0,0)} × ${fnum(i/100,2)} = ${fnum(v0*i/100)}`]],concl:`Le rayon réalise ${eur(r2(v0*i/100))}.`}); }});
AUTO.push({id:'s11d',n:'N11',d:3,tr:"Taux moyen annuel d'un CA sur plusieurs années",va:'CA 50 000→400 000 €, durée 2→5 ans, hausse globale 8→60 %',
  f:()=>{ const a=prixRond(50000,400000,1000), n=ri(2,5), tg=pick([8,12,15,20,25,30,40,50,60]), b=r2(a*(1+tg/100));
    const tm=r1((Math.pow(b/a,1/n)-1)*100);
    return SIT({role:'Responsable de magasin',enonce:`Le CA est passé de ${eur(a)} à ${eur(b)} en ${n} ans.`,
      data:[['CA de départ',eur(a)],['CA d\'arrivée',eur(b)],['Durée',n+' ans']],quest:"Quel est le taux d'évolution moyen par an ? (0,1 % près)",
      unite:'%',dec:1,tol:0.2,rep:tm,aide1:"Coefficient global, puis racine n-ième, puis − 1.",aide2:`${fnum(b/a,3)}^(1/${n})`,
      steps:[['Coefficient global',`${fnum(b,0)} ÷ ${fnum(a,0)} = ${fnum(b/a,3)}`],['Coefficient annuel',`${fnum(b/a,3)}^(1/${n}) = ${fnum(Math.pow(b/a,1/n),4)}`],['Taux moyen',`${fnum(tm,1)} %`]],
      concl:`Le CA a progressé en moyenne de ${pct(tm)} par an.`,
      err:[{v:r1(tg/n),msg:"Diviser la hausse totale par le nombre d'années ne donne pas le taux moyen."}]}); }});
AUTO.push({id:'s11e',n:'N11',d:2,tr:"Rotation des stocks d'un rayon",va:'stock moyen 5 000→40 000 €, achats 40 000→300 000 €',
  f:()=>{ const sm=prixRond(5000,40000,500), ca=prixRond(40000,300000,1000);
    return SIT({role:'Chef de rayon',enonce:`Le stock moyen du rayon ${pick(RAY)} vaut ${eur(sm)}. Le coût d'achat des marchandises vendues sur l'année est de ${eur(ca)}.`,
      data:[['Stock moyen',eur(sm)],['Coût d\'achat des ventes',eur(ca)]],quest:"Combien de fois le stock tourne-t-il par an ? (0,1 près)",
      unite:'fois',dec:1,tol:0.15,rep:r1(ca/sm),aide1:"Rotation = achats ÷ stock moyen.",aide2:`${fnum(ca,0)} ÷ ${fnum(sm,0)}`,
      steps:[['Rotation',`${fnum(ca,0)} ÷ ${fnum(sm,0)} = ${fnum(ca/sm,1)}`]],concl:`Le stock tourne ${fnum(r1(ca/sm),1)} fois par an.`}); }});
AUTO.push({id:'s11f',n:'N11',d:3,tr:"Durée de stockage comparée à un objectif",va:'rotation 4→15, objectif 20→60 jours',
  f:()=>{ const r=pick([4,5,6,8,9,10,12,15]), obj=pick([20,30,40,45,60]), d=Math.round(360/r);
    return SIT({role:'Responsable adjoint',enonce:`Le stock tourne ${r} fois par an. L'enseigne fixe un objectif de ${obj} jours de stock maximum.`,
      data:[['Rotation',r+' fois par an'],['Objectif','au plus '+obj+' jours']],type:'qcm',quest:"La durée moyenne de stockage respecte-t-elle l'objectif ?",
      choix:[`Oui : ${d} jours, c'est ${d<=obj?'dans':'hors'} l'objectif`,`Non : ${d} jours, c'est ${d<=obj?'dans':'hors'} l'objectif`,`Oui : ${r} jours seulement`,`Non : ${360-r} jours`],
      rep:d<=obj?0:1,aide1:"Durée = 360 ÷ rotation, puis on compare.",aide2:`360 ÷ ${r} = ${d}`,
      steps:[['Durée de stockage',`360 ÷ ${r} = ${d} jours`],['Comparaison',`${d} ${d<=obj?'≤':'>'} ${obj}`]],
      concl:d<=obj?`${d} jours : l'objectif est respecté.`:`${d} jours : l'objectif de ${obj} jours n'est pas atteint, il faut accélérer la rotation.`}); }});
AUTO.push({id:'s11g',n:'N11',d:3,tr:"Rotation à partir des ventes HT et du taux de marque",va:'ventes 60 000→400 000 €, marque 25→45 %, stocks tirés',
  f:()=>{ const v=prixRond(60000,400000,1000), tm=pick([25,30,35,40,45]), si=prixRond(6000,30000,500), sf=prixRond(6000,30000,500);
    const ca=r2(v*(1-tm/100)), sm=r2((si+sf)/2);
    return SIT({role:'Responsable de magasin',enonce:`Ventes de l'année : ${eur(v)} HT, taux de marque ${tm} %. Stock initial ${eur(si)}, stock final ${eur(sf)}.`,
      data:[['Ventes HT',eur(v)],['Taux de marque',tm+' %'],['Stock initial',eur(si)],['Stock final',eur(sf)]],
      quest:"Quelle est la rotation des stocks ? (0,1 près)",unite:'fois',dec:1,tol:0.2,rep:r1(ca/sm),
      aide1:"Coût d'achat des ventes = ventes × (1 − taux de marque). Stock moyen = (initial + final) ÷ 2.",
      aide2:`Coût d'achat : ${fnum(ca)} ; stock moyen : ${fnum(sm)}`,
      steps:[['Coût d\'achat des ventes',`${fnum(v,0)} × ${coef(1-tm/100)} = ${fnum(ca)}`],['Stock moyen',`(${fnum(si,0)} + ${fnum(sf,0)}) ÷ 2 = ${fnum(sm)}`],['Rotation',`${fnum(ca)} ÷ ${fnum(sm)} = ${fnum(ca/sm,1)}`]],
      concl:`Le stock tourne ${fnum(r1(ca/sm),1)} fois par an.`}); }});
AUTO.push({id:'s11h',n:'N11',d:2,tr:"Indice des prix à la consommation (Insee) : hausse cumulée",va:'deux années consécutives parmi 2021-2024',
  f:()=>{ const k=ri(0,2), a=IPC[k], b=IPC[k+1]; const c=r3((1+a[1]/100)*(1+b[1]/100));
    return SIT({shop:'Indice des prix',role:'Insee',enonce:`Inflation annuelle moyenne en France (Insee) : ${a[1].toString().replace('.',',')} % en ${a[0]} et ${b[1].toString().replace('.',',')} % en ${b[0]}.`,
      data:[[String(a[0]),nb(a[1])+' %'],[String(b[0]),nb(b[1])+' %']],quest:`De combien les prix ont-ils augmenté au total sur ${a[0]} et ${b[0]} ? (0,1 % près)`,
      unite:'%',dec:1,tol:0.15,rep:r1((c-1)*100),aide1:"Deux hausses successives : on multiplie les coefficients.",
      aide2:`${coef(1+a[1]/100)} × ${coef(1+b[1]/100)}`,
      steps:[['Coefficient global',`${coef(1+a[1]/100)} × ${coef(1+b[1]/100)} = ${fnum(c,4)}`],['Hausse cumulée',`(${fnum(c,4)} − 1) × 100 = ${fnum((c-1)*100,1)}`]],
      concl:`Les prix ont augmenté de ${pct(r1((c-1)*100))} sur les deux ans, un peu plus que la somme ${nb(r1(a[1]+b[1]))} %.`,
      err:[{v:r1(a[1]+b[1]),msg:"Les taux ne s'additionnent pas."}]}); }});
AUTO.push({id:'q11a',n:'N11',d:1,tr:"Quelle opération donne l'indice ?",va:'valeurs tirées au hasard',
  f:()=>{ const v0=prixRond(20000,200000,1000), v=r2(v0*pick([1.08,1.15,1.2,0.9,0.95]));
    const bon=`${fnum(v,0)} ÷ ${fnum(v0,0)} × 100`; const o=shuffle([bon,`${fnum(v0,0)} ÷ ${fnum(v,0)} × 100`,`(${fnum(v,0)} − ${fnum(v0,0)}) × 100`,`${fnum(v,0)} × ${fnum(v0,0)} ÷ 100`]);
    return A({type:'qcm',prompt:`Référence ${eur(v0)}, cette année ${eur(v)}. Quelle opération donne l'indice base 100 ?`,choix:o,rep:o.indexOf(bon),
      aide1:"Valeur ÷ référence × 100.",aide2:"La référence est au dénominateur.",steps:[['Indice',`${bon} = ${fnum(v/v0*100,1)}`]],concl:`L'indice vaut ${fnum(v/v0*100,1)}.`}); }});
AUTO.push({id:'u11a',n:'N11',d:2,tr:"Indice base 100 (nombre + unité)",va:'référence et évolution tirées au hasard',

AUTO.push({id:'t11a',n:'N11',d:1,tr:"Trier des indices : hausse ou baisse ?",va:'6 indices tirés parmi 12',

AUTO.push({id:'g11a',n:'N11',d:2,tr:"Compléter un tableau rotation / durée",va:'3 rotations tirées',

  f:()=>{ const t=pick([-20,-15,-10,-5,5,10,15,20,25,30,40,50]);

      min:60,max:160,pas:1,unite:'',rep:100+t,tol:2,dec:0,aide1:"Indice = 100 + évolution.",aide2:"Une baisse donne un indice sous 100.",

   QD({shop:'Indice des prix',role:'Insee',enonce:ctx,data:tab,quest:"Base 100 fin 2020, quel est l'indice des prix fin 2024 ? (0,1 près)",

     steps:[['Prix',`${fnum(p,0)} × ${fnum(cg,3)} = ${fnum(p*cg)}`]],concl:`L'article coûterait ${eur(r2(p*cg))}.`}),
   QD({shop:'Indice des prix',role:'Insee',enonce:ctx,data:tab,quest:"Quel a été le taux d'inflation moyen par an sur ces quatre années ? (0,1 % près)",

   QD({shop:'Boutique',role:'Assistant de gestion',enonce:ctx,data:tab,quest:"Quel est le seuil de rentabilité de la boutique ?",unite:'€',tol:5,rep:r2(cf/(tmcv/100)),notion:'N9',diff:3,
     aide1:"Charges fixes ÷ taux de MCV.",aide2:`${fnum(cf,0)} ÷ ${fnum(tmcv/100,3)}`,steps:[['Seuil',`${fnum(cf,0)} ÷ ${fnum(tmcv/100,3)} = ${fnum(cf/(tmcv/100))}`]],
     concl:`Le seuil de rentabilité est de ${eur(r2(cf/(tmcv/100)))}, ${cf/(tmcv/100)<ca?'inférieur':'supérieur'} au CA réalisé.`}),
   QD({shop:'Boutique',role:'Assistant de gestion',enonce:ctx,data:tab,quest:"Quelle part du CA les charges fixes représentent-elles ? (0,1 % près)",unite:'%',dec:1,tol:0.2,rep:r1(cf/ca*100),notion:'N2',diff:2,bar:{p:cf,t:ca},
     aide1:"Charges fixes ÷ CA × 100.",aide2:`${fnum(cf,0)} ÷ ${fnum(ca,0)}`,steps:[['Part',`${fnum(cf,0)} ÷ ${fnum(ca,0)} × 100 = ${fnum(cf/ca*100,1)}`]],concl:`Les charges fixes pèsent ${pct(r1(cf/ca*100))} du CA.`})

/* ══════════════════════════════════════════════════════════════
   UNITÉ 1 — Déterminer le coefficient : familles par palier
   sens : prendre · hausse · baisse · refl (réflexion) · tva
   pal  : diz (dizaines) · ent (entiers) · dec (décimaux)
   ══════════════════════════════════════════════════════════════ */
let REFL_SENS=['prendre','hausse','baisse'];
const CF={diz:[10,20,30,40,50,60,70,80,90],ent:[3,5,7,12,15,18,24,25,35,45,55,65,75,85,95],dec:[0.5,1.5,2.5,4.5,5.5,7.5,12.5,17.5,22.5,32.5,37.5]};
const PAL_NOM={diz:'dizaines',ent:'entiers',dec:'décimaux'};
function cDe(sens,t){ return sens==='prendre'?r3(t/100):sens==='hausse'?r3(1+t/100):r3(1-t/100); }
function cTxt(sens,t){ const c=cDe(sens,t); return fnum(c,(t<10||!Number.isInteger(t))?3:2).replace(/0$/,x=>x).replace(/(,\d\d)0$/,'$1'); }
function libSens(sens){ return {prendre:'Prendre',hausse:'Ajouter',baisse:'Retirer'}[sens]; }
const PHR={
 prendre:[t=>`Prendre ${nb(t)} % d'une valeur revient à multiplier cette valeur par…`,
          t=>`Calculer ${nb(t)} % d'un montant, c'est le multiplier par…`,
          t=>`${nb(t)} % d'une somme : par quel nombre multiplier la somme ?`],
 hausse:[t=>`Ajouter ${nb(t)} % à une valeur revient à multiplier cette valeur par…`,
         t=>`Augmenter un prix de ${nb(t)} %, c'est le multiplier par…`,
         t=>`Une hausse de ${nb(t)} % : par quel nombre multiplier la valeur de départ ?`],
 baisse:[t=>`Retirer ${nb(t)} % à une valeur revient à multiplier cette valeur par…`,
         t=>`Diminuer un prix de ${nb(t)} %, c'est le multiplier par…`,
         t=>`Une remise de ${nb(t)} % : par quel nombre multiplier le prix affiché ?`]
};
function distracteurs(sens,t){
  const bon=cDe(sens,t);
  const set=new Set([cTxt(sens,t)]);
  const cands=sens==='prendre'
    ? [r3(1-t/100),r3(1+t/100),t<10?r3(t/10):r3(t/1000)]                                // ce qui reste, hausse, virgule déplacée
    : [sens==='hausse'?r3(1-t/100):r3(1+t/100),                                          // sens inversé
       t<10?(sens==='hausse'?r3(1+t/10):r3(1-t/10)):r3(t/100),                            // virgule mal placée (1,5 pour 5 %) ou oubli du 1
       r3(bon+0.1)];
  const out=[cTxt(sens,t)];
  cands.forEach(v=>{ const s=fnum(v,(t<10||!Number.isInteger(t))?3:2).replace(/(,\d\d)0$/,'$1'); if(!set.has(s)&&out.length<3){ set.add(s); out.push(s);} });
  out.push(cTxt(sens,t)+' %');
  return out;
}
function famCoef(sens,pal){
  const T=CF[pal], base='cf'+sens[0]+({diz:'z',ent:'e',dec:'c'}[pal]), nomP=PAL_NOM[pal];
  const st=(t)=>[['Taux en écriture décimale',`${nb(t)} ÷ 100 = ${fnum(t/100,3).replace(/0$/,'')}`],
    ['Coefficient',sens==='prendre'?`${fnum(t/100,3).replace(/0$/,'')}`:`1 ${sens==='hausse'?'+':'−'} ${fnum(t/100,3).replace(/0$/,'')} = ${cTxt(sens,t)}`]];
  const concl=t=>`${libSens(sens)} ${nb(t)} %, c'est × ${cTxt(sens,t)}.${sens==='prendre'?' On ne garde que la part, pas la valeur entière.':sens==='hausse'?' Plus grand que 1 : la valeur monte.':' Plus petit que 1 : la valeur descend.'}`;
  const a1={prendre:"Prendre une part, c'est multiplier par le taux écrit en décimal (÷ 100).",hausse:"On garde le 1 (la valeur entière) et on ajoute le taux.",baisse:"On part du 1 (la valeur entière) et on retire le taux."}[sens];
  // QCM
  AUTO.push({id:base+'q',n:'N3',d:pal==='diz'?1:2,meta:{sens,pal},tr:PHR[sens][0]('t')+' (QCM)',va:`t parmi les ${nomP} : ${T.join(', ')}`,
    f:()=>{ const t=pick(T), ph=pick(PHR[sens]), o=shuffle(distracteurs(sens,t));
      return A({type:'qcm',prompt:ph(t),choix:o,rep:o.indexOf(cTxt(sens,t)),aide1:a1,aide2:`${nb(t)} ÷ 100 = ${fnum(t/100,3).replace(/0$/,'')}`,steps:st(t),concl:concl(t)}); }});
  // saisie
  AUTO.push({id:base+'s',n:'N3',d:pal==='diz'?1:pal==='ent'?2:3,meta:{sens,pal},tr:PHR[sens][0]('t')+' (saisie)',va:`t parmi les ${nomP}`,
    f:()=>{ const t=pick(T), ph=pick(PHR[sens]);
      return A({type:'num',prompt:ph(t),sousPrompt:"Écris le coefficient",unite:'',dec:3,tol:0.0005,rep:cDe(sens,t),aide1:a1,
        aide2:`${nb(t)} ÷ 100 = ${fnum(t/100,3).replace(/0$/,'')}`,steps:st(t),concl:concl(t),
        err:[{v:sens==='prendre'?r3(1+t/100):sens==='hausse'?r3(1-t/100):r3(1+t/100),msg:sens==='prendre'?"Tu as ajouté le taux à 1 : c'est le coefficient d'une hausse, pas d'une part.":sens==='hausse'?"Tu as retiré le taux : c'est une baisse.":"Tu as ajouté le taux : c'est une hausse."},
             {v:sens==='prendre'?r3(1-t/100):r3(t/100),msg:sens==='prendre'?"Tu as retiré le taux à 1 : cela donne ce qui reste, pas la part prise.":"Il manque le 1 : tu as écrit le taux, pas le coefficient."}]}); }});
  // formule à trous
  AUTO.push({id:base+'f',n:'N3',d:pal==='diz'?1:2,meta:{sens,pal},tr:libSens(sens)+' t % — compléter le coefficient',va:`t parmi les ${nomP}`,
    f:()=>{ const t=pick(T), d=fnum(t/100,3).replace(/0$/,'');
      const m=sens==='prendre'?['coefficient = ',null]:['coefficient = 1 ',null,' ',null];
      const sol=sens==='prendre'?[d]:[sens==='hausse'?'+':'−',d];
      return A({type:'formule',prompt:`${libSens(sens)} ${nb(t)} %`,sousPrompt:"Complète le coefficient",masque:m,sol:sol,
        banque:shuffle(sens==='prendre'?[d,String(t),cTxt('hausse',t),cTxt('baisse',t)]:['+','−',d,String(t),cTxt(sens,t)]),
        aide1:a1,aide2:`${nb(t)} ÷ 100 = ${d}`,steps:st(t),concl:concl(t)}); }});
  // appariement
  AUTO.push({id:base+'r',n:'N3',d:2,meta:{sens,pal},tr:'Relier 4 taux à leur coefficient — '+libSens(sens).toLowerCase(),va:`4 taux parmi les ${nomP}`,
    f:()=>{ const ts=picks(T,4), p=ts.map(t=>[`${libSens(sens).toLowerCase()} ${nb(t)} %`,'× '+cTxt(sens,t)]);
      return A({type:'relier',prompt:"Relie chaque opération à son coefficient",paires:shuffle(p),aide1:a1,aide2:"Compare chaque coefficient à 1.",
        steps:p.map(x=>[x[0],x[1]]),concl:sens==='prendre'?"Prendre une part : le coefficient est toujours inférieur à 1.":sens==='hausse'?"Ajouter : toujours supérieur à 1.":"Retirer : toujours inférieur à 1."}); }});
  // tableau
  AUTO.push({id:base+'g',n:'N3',d:2,meta:{sens,pal},tr:'Compléter un tableau de coefficients — '+libSens(sens).toLowerCase(),va:`3 taux parmi les ${nomP}`,
    f:()=>{ const ts=picks(T,3);
      return A({type:'grille',prompt:`${libSens(sens)} un pourcentage`,sousPrompt:"Complète la colonne des coefficients (3 décimales au besoin)",
        cols:['Taux','Coefficient'],rows:ts.map(t=>({cells:[{v:nb(t)+' %'},{input:true,rep:cDe(sens,t),dec:3}]})),
        aide1:a1,aide2:"Écris 0,075 pour 7,5 %.",steps:ts.map(t=>[nb(t)+' %','× '+cTxt(sens,t)]),concl:"Un tableau à savoir refaire de tête."}); }});
  // inverse : coefficient → taux
  AUTO.push({id:base+'i',n:'N3',d:pal==='diz'?2:3,meta:{sens,pal},tr:'Retrouver le taux à partir du coefficient — '+libSens(sens).toLowerCase(),va:`t parmi les ${nomP}`,
    f:()=>{ const t=pick(T), c=cTxt(sens,t);
      const q={prendre:`Multiplier une valeur par ${c}, c'est en prendre quel pourcentage ?`,hausse:`Multiplier par ${c}, c'est ajouter quel pourcentage ?`,baisse:`Multiplier par ${c}, c'est retirer quel pourcentage ?`}[sens];
      return A({type:'num',prompt:q,unite:'%',dec:1,tol:0.15,rep:r1(t),
        aide1:sens==='prendre'?"Taux = coefficient × 100.":sens==='hausse'?"Taux = (coefficient − 1) × 100.":"Taux = (1 − coefficient) × 100.",
        aide2:sens==='prendre'?`${c} × 100`:sens==='hausse'?`${c} − 1`:`1 − ${c}`,
        steps:[[sens==='prendre'?'Coefficient × 100':sens==='hausse'?'Écart à 1':'Écart à 1',sens==='prendre'?`${c} × 100 = ${nb(t)}`:sens==='hausse'?`${c} − 1 = ${fnum(t/100,3).replace(/0$/,'')}`:`1 − ${c} = ${fnum(t/100,3).replace(/0$/,'')}`],['Taux',nb(t)+' %']],
        concl:`× ${c} correspond à ${libSens(sens).toLowerCase()} ${nb(t)} %.`,
        err:sens==='prendre'?[]:[{v:r1(cDe(sens,t)*100),msg:"Tu as oublié de comparer le coefficient à 1."}]}); }});
}
['prendre','hausse','baisse'].forEach(sens=>['diz','ent','dec'].forEach(pal=>famCoef(sens,pal)));

/* ─── réflexion : prévoir, interpréter, distinguer ───────────── */
function famRefl(){
  AUTO.push({id:'rf1',n:'N3',d:1,meta:{sens:'refl',pal:'tous',niv:1},tr:"Sans calculer : la valeur sera-t-elle plus grande ou plus petite ?",va:'opération et taux tirés au hasard',
    f:()=>{ const sens=pick(REFL_SENS), t=pick(CF.diz.concat(CF.ent)), v=prixRond(20,300,10);
      const bon=sens==='hausse'?'Plus grande':'Plus petite';
      const o=shuffle(['Plus grande','Plus petite','Égale','On ne peut pas savoir sans calculer']);
      return A({type:'qcm',prompt:`On va ${sens==='prendre'?'prendre':sens==='hausse'?'ajouter':'retirer'} ${nb(t)} % ${sens==='prendre'?'de':'à'} ${eur(v)}. Sans calculer, le résultat sera…`,
        choix:o,rep:o.indexOf(bon),aide1:"Regarde le coefficient : plus grand que 1 ou plus petit que 1 ?",
        aide2:sens==='hausse'?"Ajouter, c'est × (1 + …) : plus grand que 1.":"Prendre une part ou retirer, c'est × (moins que 1).",
        steps:[['Coefficient','× '+cTxt(sens,t)],['Par rapport à 1',bon.toLowerCase()+' que la valeur de départ']],
        concl:`Le coefficient ${cTxt(sens,t)} est ${sens==='hausse'?'supérieur':'inférieur'} à 1 : la valeur sera ${bon.toLowerCase()}. Prévoir avant de calculer évite la moitié des erreurs.`}); }});
  AUTO.push({id:'rf2',n:'N3',d:2,meta:{sens:'refl',pal:'tous',niv:3},tr:"Multiplier par 0,60 : prendre 60 % ou retirer 40 % ?",va:'taux parmi les dizaines',
    f:()=>{ const t=pick(CF.diz), c=cTxt('prendre',t);
      const o=shuffle([`Prendre ${t} % de la valeur`,`Retirer ${100-t} % à la valeur`,'Les deux : ce sont les mêmes calculs',`Retirer ${t} % à la valeur`]);
      return A({type:'qcm',prompt:`Multiplier une valeur par ${c} revient à…`,choix:o,rep:o.indexOf('Les deux : ce sont les mêmes calculs'),
        aide1:`Prendre ${t} %, c'est × ${c}. Retirer ${100-t} %, c'est × (1 − ${fnum((100-t)/100,2)}) = × ${c}.`,aide2:"Deux phrases différentes, un seul coefficient.",
        steps:[[`Prendre ${t} %`,'× '+c],[`Retirer ${100-t} %`,`1 − ${fnum((100-t)/100,2)} = ${c}`]],
        concl:`Prendre ${t} % ou retirer ${100-t} %, c'est le même coefficient : ${c}. Ce qu'on garde et ce qu'on enlève font toujours 100 %.`}); }});
  AUTO.push({id:'rf3',n:'N3',d:1,meta:{sens:'refl',pal:'tous',niv:2},tr:"Pourquoi le coefficient d'une baisse est-il inférieur à 1 ?",va:'formulation fixe, ordre des choix aléatoire',
    f:()=>{ const o=shuffle(["Parce qu'on retire une partie de la valeur entière, qui vaut 1","Parce qu'une baisse est toujours petite","Parce qu'on divise par 100","Parce que le taux est négatif"]);
      return A({type:'qcm',prompt:"Pourquoi le coefficient d'une baisse est-il toujours plus petit que 1 ?",choix:o,rep:o.indexOf("Parce qu'on retire une partie de la valeur entière, qui vaut 1"),
        aide1:"La valeur de départ, c'est 100 %, donc 1.",aide2:"Retirer, c'est 1 − quelque chose.",
        steps:[['Valeur de départ','100 % = 1'],['Après une baisse de t %','1 − t ÷ 100, donc moins que 1']],
        concl:"Le 1 représente la valeur entière. Retirer, c'est descendre en dessous ; ajouter, c'est monter au-dessus."}); }});
  AUTO.push({id:'rf4',n:'N3',d:2,meta:{sens:'refl',pal:'tous',niv:3},tr:"Quel coefficient fait le plus monter ou baisser la valeur ?",va:'3 coefficients tirés au hasard',
    f:()=>{ const cs=shuffle(picks([0.6,0.75,0.85,0.92,1.05,1.12,1.25,1.4,1.7],3)), hausse=pick([true,false]);
      const bon=hausse?Math.max(...cs):Math.min(...cs);
      return A({type:'qcm',prompt:`Parmi ces coefficients, lequel fait le plus ${hausse?'monter':'baisser'} la valeur ?`,choix:cs.map(c=>'× '+coef(c)),rep:cs.indexOf(bon),
        aide1:"Compare chaque coefficient à 1.",aide2:hausse?"Le plus grand écart au-dessus de 1.":"Le plus grand écart en dessous de 1.",
        steps:cs.map(c=>['× '+coef(c),(c>=1?'+ ':'− ')+fnum(Math.abs(c-1)*100,0)+' %']),
        concl:`× ${coef(bon)} correspond à ${bon>=1?'+':'−'} ${fnum(Math.abs(bon-1)*100,0)} % : c'est l'effet le plus fort.`}); }});
  AUTO.push({id:'rf5',n:'N3',d:2,meta:{sens:'refl',pal:'tous',niv:3},tr:"Trier des phrases : prendre une part, ajouter, retirer",va:'6 phrases tirées parmi 9',
    f:()=>{ const it=shuffle(picks([{t:'× 0,35',b:0},{t:'× 0,80 pour une remise',b:1},{t:'× 1,20',b:2},{t:'prendre 35 %',b:0},{t:'retirer 20 %',b:1},{t:'ajouter 20 %',b:2},{t:'× 0,20 pour la TVA',b:0},{t:'× 1,055',b:2},{t:'× 0,65 après démarque',b:1}],6));
      return A({type:'tri',prompt:"Chaque calcul : prendre une part, ou faire évoluer la valeur ?",bacs:['Prendre une part','Faire évoluer (ajouter ou retirer)'],
        items:it.map(x=>({t:x.t,b:x.b===0?0:1})),aide1:"Une part : le coefficient est le taux lui-même. Une évolution : on part de 1.",
        aide2:"× 0,80 après remise et × 0,20 pour une part : deux coefficients inférieurs à 1, deux sens différents.",
        steps:[['Prendre une part','× t ÷ 100'],['Évolution','× (1 ± t ÷ 100)']],concl:"Le même coefficient peut être une part ou une évolution : c'est la question posée qui le dit."}); }});
  AUTO.push({id:'rf6',n:'N3',d:2,meta:{sens:'refl',pal:'tous',niv:1},tr:"Estimer l'ordre de grandeur au curseur avant de calculer",va:'valeur et opération tirées au hasard',
    f:()=>{ const v=pick([50,80,100,120,200]), sens=pick(REFL_SENS), t=pick(CF.diz);
      const rep=Math.round(v*cDe(sens,t));
      return A({type:'curseur',prompt:`${libSens(sens)} ${t} % ${sens==='prendre'?'de':'à'} ${v} €`,sousPrompt:"Place le curseur sur le résultat, sans poser le calcul",
        min:0,max:v*2,pas:1,unite:'€',rep:rep,tol:Math.max(2,Math.round(v*0.04)),dec:0,

function poolGen(notion,dmax){
  let g=GEN.filter(x=>CFG.notions[x.n]);
  if(notion){
    const f=g.filter(x=>x.n===notion);
    // les unités récentes n'ont pas de banque de situations dédiée : on reste dans leur propre notion
    g=f.length?f:AUTO.filter(x=>x.n===notion);
  }
  if(dmax) g=g.filter(x=>x.d<=dmax);
  if(!g.length) g=GEN.filter(x=>CFG.notions[x.n]);
  return g.length?g:GEN;
}
function poolAuto(notion,dmax){
  let g=AUTO.filter(x=>CFG.notions[x.n]);
  if(notion) g=g.filter(x=>x.n===notion);
  if(dmax) g=g.filter(x=>x.d<=dmax);
  if(!g.length) g=AUTO.filter(x=>CFG.notions[x.n]);
  return g.length?g:AUTO;
}
function memoire(id){
  if(!Array.isArray(ST.recents)) ST.recents=[];
  ST.recents.push(id);
  if(ST.recents.length>110) ST.recents=ST.recents.slice(-110);
}
function inedit(list,pris){
  // trame ni vue dans cette leçon, ni vue dans les parties récentes
  const rec=Array.isArray(ST.recents)?ST.recents:[];
  const d=list.filter(g=>!pris.includes(g.id)&&!rec.includes(g.id));
  return d.length?pick(d):null;
}
function neuf(list,pris){
  let g=inedit(list,pris);
  if(g) return g;
  const d=list.filter(x=>!pris.includes(x.id));
  return pick(d.length?d:list);
}
function build(gen){
  let q=gen.f();
  // un QCM ne doit jamais proposer deux fois la même réponse
  for(let k=0;k<6&&q.choix&&new Set(q.choix).size!==q.choix.length;k++) q=gen.f();
  if(q.choix&&new Set(q.choix).size!==q.choix.length){
    const vu={}; q.choix=q.choix.map((c,i)=>{ if(vu[c]!==undefined&&i!==q.rep){ return c+' '; } vu[c]=i; return c; });
  }
  // la banque de mots contient chaque solution le bon nombre de fois, sans surplus
  if(q.type==='formule'){
    const need={}; q.sol.forEach(x=>need[x]=(need[x]||0)+1);
    const vu={}; q.banque=q.banque.filter(t=>{ vu[t]=(vu[t]||0)+1; return vu[t]<=Math.max(need[t]||0,1); });
    Object.keys(need).forEach(t=>{ let h=q.banque.filter(x=>x===t).length; while(h++<need[t]) q.banque.push(t); });
    q.banque=shuffle(q.banque);
  }
  q.gid=gen.id; q.notion=gen.n; q.diff=gen.d;
  q.auto=AUTO.indexOf(gen)>=0;
  if(q.tol===undefined) q.tol=CFG.tolerance;
  if(q.unite==='€') q.tol=Math.max(CFG.tolerance,0.01);
  q.err=(q.err||[]).filter(e=>Math.abs(e.v-q.rep)>Math.max(q.tol||0.01,0.02));
  if(!CFG.types[q.type]&&CFG.types[q.type]===false) q.bloque=true;
  return q;
}
function tirageVarie(list,n){
  const par={};
  list.forEach(g=>{ const t=TYPE_OF[g.id]||'num'; (par[t]=par[t]||[]).push(g); });
  const types=shuffle(Object.keys(par));
  const out=[], pris=[];
  // premier passage : on n'utilise que des trames inédites, en alternant les types
  let garde=0, progres=true;
  while(out.length<n&&progres&&garde++<n*12){
    progres=false;
    for(const t of types){
      if(out.length>=n) break;
      const g=inedit(par[t],pris);
      if(!g) continue;
      progres=true; pris.push(g.id); memoire(g.id); out.push(build(g));
    }
  }
  // complément : on autorise la reprise d'une trame, avec de nouvelles valeurs
  garde=0;
  while(out.length<n&&garde++<n*12){
    for(const t of types){
      if(out.length>=n) break;
      const g=neuf(par[t],pris);
      pris.push(g.id); memoire(g.id); out.push(build(g));
    }
  }
  return out.slice(0,n);
}
function tirage(list,n){
  const out=[], pris=[];
  while(out.length<n){
    const g=neuf(list,pris);
    pris.push(g.id); memoire(g.id); out.push(build(g));
  }
  return out;
}
function typesOk(list){
  const l=list.filter(g=>{ const t=(TYPE_OF[g.id]||'?'); return CFG.types[t]!==false; });
  return l.length?l:list;
}
const TYPE_OF={};
AUTO.forEach(g=>{ try{ TYPE_OF[g.id]=g.f().type; }catch(e){ TYPE_OF[g.id]='qcm'; } });
GEN.forEach(g=>{ try{ TYPE_OF[g.id]=g.f().type; }catch(e){ TYPE_OF[g.id]='num'; } });

const RANG_TYPE={qcm:0,vf:0,relier:1,tri:1,ordre:1,formule:2,curseur:2,grille:3,unite:3,num:4};
function ordonner(l){
  // on commence par reconnaître, on finit par produire : QCM, puis manipulation, puis saisie libre
  return l.map((q,i)=>({q,i})).sort((a,b)=>{
    const ra=RANG_TYPE[a.q.type]===undefined?4:RANG_TYPE[a.q.type];
    const rb=RANG_TYPE[b.q.type]===undefined?4:RANG_TYPE[b.q.type];
    return ra-rb||a.i-b.i;
  }).map(x=>x.q);
}
function tirageType(list,types,n){
  const l=list.filter(g=>types.includes(TYPE_OF[g.id]));
  return l.length?tirage(l,Math.min(n,Math.max(1,n))):[];
}
function fileLecon(kind,notion,params){
  const L=CFG.longueurLecon;
  const A_=()=>typesOk(poolAuto(notion)), G_=d=>typesOk(poolGen(notion,d));
  if(kind==='methode') return ordonner(tirageVarie(A_(),3).concat(tirage(G_(1),2)));
  if(kind==='reflexes') return ordonner(tirageVarie(A_(),L));
  if(kind==='situations'){
    // on entre par une question de reconnaissance, puis une manipulation, puis les situations complètes
    const intro=tirageType(A_(),['qcm','vf'],1).concat(tirageType(A_(),['relier','tri','ordre','formule'],1));
    return ordonner(intro.concat(tirage(G_(2),Math.max(4,L-intro.length))));
  }
  if(kind==='epreuve'){
    const act=activeNotions().map(n=>n.id), k=act.indexOf(notion);
    const rappel=k>0?typesOk(poolGen(act[k-1],3)):null;
    const base=shuffle(tirageVarie(A_(),3).concat(tirage(G_(3),L-4)));
    return ordonner(base.concat(rappel?tirage(rappel,1):tirage(G_(3),1)));
  }
  if(kind==='application'){
    let l=typesOk(poolAuto(notion,3)).filter(g=>g.d>=2);
    if(l.length<3) l=typesOk(poolAuto(notion,3));
    return ordonner(tirageVarie(l,L));
  }
  if(kind==='revision'){
    const act=activeNotions().map(x=>x.id), k=act.indexOf(notion);
    const avant=act.slice(0,k);
    const mien=shuffle(tirageVarie(typesOk(poolAuto(notion,3)),3).concat(tirage(G_(3),3)));
    const rappel=avant.length
      ? shuffle(avant.map(nn=>[].concat(tirage(typesOk(poolAuto(nn,3)),1),tirage(typesOk(poolGen(nn,3)),1))).flat()).slice(0,Math.max(2,L-6))
      : tirage(G_(3),L-6);
    return ordonner(mien.concat(rappel));
  }
  if(kind==='dossier'){
    const d=DOSSIERS.find(x=>x.id===notion)||pick(DOSSIERS);
    const qs=d.f();
    qs.forEach(q=>{ q.gid='dossier-'+d.id; q.diff=q.diff||2; q.notion=q.notion||'N4'; q.type=q.type||'num'; });
    return qs;
  }
  if(kind==='coef'){
    const p=params||{sens:'mix',pal:'tous'};
    const pals=p.pal==='tous'?['diz','ent','dec']:p.pal==='entdec'?['ent','dec']:[p.pal];
    const sensL=p.sens==='mix'?['prendre','hausse','baisse']:[p.sens];
    let src=AUTO.filter(g=>g.n==='N3'&&g.meta&&sensL.includes(g.meta.sens)&&(pals.includes(g.meta.pal)||g.meta.pal==='tous'));
    src=typesOk(src);
    REFL_SENS=p.sens==='mix'?['prendre','hausse','baisse']:p.sens==='hausse'?['prendre','hausse']:p.sens==='baisse'?['prendre','hausse','baisse']:['prendre'];
    const nivMax=p.refl==='base'?1:p.refl==='evo'?2:3;
    const refl=typesOk(AUTO.filter(g=>g.n==='N3'&&g.meta&&g.meta.sens==='refl'&&(g.meta.niv||1)<=nivMax));
    if(p.sens==='tva') return ordonner(tirageVarie(src,12));
    const coeur=tirageVarie(src,p.sens==='mix'?8:10);
    const pens=tirage(refl,p.sens==='mix'?4:2);
    // on réfléchit d'abord (prévoir le sens), on produit ensuite
    return pens.concat(ordonner(coeur));
  }
  if(kind==='revisionJour'){
    const ids=shuffle(dues()).slice(0,8);
    const g=GEN.concat(AUTO).filter(x=>ids.includes(x.id));
    return ordonner(g.map(x=>build(x)));
  }
  if(kind==='position'){
    let f=[];
    activeNotions().forEach(nn=>{ f=f.concat(tirageVarie(typesOk(poolAuto(nn.id,2)),1),tirage(typesOk(poolGen(nn.id,2)),1)); });
    return f;
  }
  if(kind==='test'){
    // 20 questions réparties sur toutes les unités à valider, moitié automatismes, moitié situations
    const us=(params&&params.couvre&&params.couvre.length)?params.couvre:[notion];
    const out=[]; let tour=0;
    while(out.length<20&&tour<40){
      const u=us[tour%us.length];
      const src=(tour%(2*us.length))<us.length?typesOk(poolAuto(u,3)):typesOk(poolGen(u,3));
      const pris=out.map(q=>q.gid);
      const g=neuf(src,pris); memoire(g.id); out.push(build(g)); tour++;
    }
    return ordonner(out);
  }
  if(kind==='reflexesLibre') return ordonner(tirageVarie(typesOk(poolAuto(null)),12));
  if(kind==='erreurs'){
    const ids=ST.erreurs.slice(0,30);
    const g=GEN.concat(AUTO).filter(x=>ids.includes(x.id));
    return tirage(g.length?g:typesOk(poolGen(null,3)),Math.min(10,Math.max(4,g.length)));
  }
  if(kind==='vfonly'){
    return picks(VF.filter(v=>CFG.notions[v.n]),Math.min(10,L+2)).map(v=>{
      const q=Object.assign({},{type:'vf',court:true,prompt:v.t,sousPrompt:"Cette affirmation est-elle exacte ?",
        choix:['Vrai','Faux'],rep:v.v?0:1,steps:[],concl:v.x,dec:2,tol:.01,err:[],data:[],
        aide1:"Repense à la valeur de référence : elle change souvent en cours de route.",aide2:v.x});
      q.gid='vf'; q.notion=v.n; q.diff=2; return q;
    });
  }
  if(kind==='boss'){
    const sc=pick(BOSS), qs=sc.f();
    qs.forEach((q,i)=>{ q.gid='boss'; q.notion=q.notion||(sc.nots&&sc.nots[i])||'N4'; q.diff=q.diff||2; q.type=q.type||'num'; });
    return qs;
  }
  return tirage(G_(3),L);
}

function runTimer(){
  clearInterval(TIMER);
  TIMER=setInterval(()=>{
    if(!S||S.fini){ clearInterval(TIMER); return; }
    S.reste--;
    const e=$('#chrono'); if(e){ e.textContent=mmss(S.reste); e.classList.toggle('danger',S.reste<=15); }
    if(S.reste<=0){ clearInterval(TIMER); fin(); }
  },1000);
}
function next(){
  if(S.infini){
    const d=S.kind==='survie'?Math.min(3,1+Math.floor(S.ok/5)):S.dmax;
    const src=S.kind==='reflexesLibre'?typesOk(poolAuto(S.notion,d)):typesOk(poolGen(S.notion,d).concat(poolAuto(S.notion,d)));
    S.q=build(pick(src));
  } else {
    if(S.i>=S.file.length) return fin();
    S.q=S.file[S.i];
    if(S.adapt) S.q=adapter(S.q);
  }
  S.aideNiv=0; S.joker=false; S.tQ=Date.now(); S.rep=null;
  IN=initIn(S.q);
  renderItem();
}
function adapter(q){
  // trois réussites sans aide : on monte d'un niveau ; deux erreurs de suite : on descend
  let cible=q.diff||1;
  if((S.sansAide||0)>=3) cible=Math.min(3,cible+1);
  else if((S.errSuite||0)>=2) cible=Math.max(1,cible-1);
  if(cible===(q.diff||1)) return q;
  const src=GEN.concat(AUTO).filter(g=>g.n===q.notion&&g.d===cible&&CFG.types[TYPE_OF[g.id]]!==false);
  if(!src.length) return q;
  const meme=src.filter(g=>TYPE_OF[g.id]===q.type);
  const g=inedit(meme.length?meme:src,[])||pick(meme.length?meme:src);
  memoire(g.id);
  const nq=build(g); nq.adapte=cible>(q.diff||1)?'up':'down';
  S.file[S.i]=nq; return nq;
}
function initIn(q){
  switch(q.type){
    case 'formule': return {fill:q.sol.map(()=>null)};
    case 'relier': {
      const g=shuffle(q.paires.map((p,i)=>({k:i,t:p[0]})));
      const d=shuffle(q.paires.map((p,i)=>({k:i,t:p[1]})));
      return {g,d,sel:null,side:null,done:[],fautes:0};
    }
    case 'ordre': return {mix:shuffle(q.items.map((t,i)=>({k:i,t}))),picked:[]};
    case 'tri': return {placed:q.items.map(()=>null),sel:null};
    case 'curseur': return {v:Math.round((q.min+q.max)/2)};
    case 'unite': return {val:'',u:null};
    case 'grille': return {vals:{}};
    default: return {sel:null};
  }
}

function maj(){ const b=$('#btnGo'); if(b) b.disabled=!prete(); }

    case 'unite': { return !!(IN.val&&IN.val.trim())&&IN.u!==null&&IN.u!==undefined; }
    case 'qcm': case 'vf': return IN.sel!==null&&IN.sel!==undefined;

let CALC={exp:'',res:0};
function calcAff(){
  const e=$('#calcExp'), r=$('#calcRes');

function calcVal(){
  if(!CALC.exp.trim()) return CALC.res||0;
  let t=CALC.exp.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/%/g,'/100');
  t=t.replace(/[^0-9+\-*/(). ]/g,'');
  try{ const v=Function('"use strict";return ('+t+')')(); return isFinite(v)?v:(CALC.res||0); }
  catch(e){ return CALC.res||0; }
}
function calcTape(ch){
  if(ch==='C'){ CALC.exp=''; CALC.res=0; }
  else if(ch==='←'){ CALC.exp=CALC.exp.slice(0,-1); }
  else CALC.exp+=ch;

}
