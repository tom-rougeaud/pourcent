function verifier(){
  if(!S||S.fini||S.encours) return;
  const q=S.q; if(!q) return;
  if(q.type!=='relier'&&!prete()){ toast("Complète ta réponse avant de valider."); return; }
  let ok=false, donne='', attendu='';
  switch(q.type){
    case 'unite': {
      const v=parseNum(IN.val), u=q.unites[IN.u];
      if(isNaN(v)){ toast('Saisis une réponse chiffrée.'); return; }
      const okN=Math.abs(v-q.rep)<=(q.tol||0.01)+1e-9, okU=(u===q.repUnite);
      ok=okN&&okU; S.val=v; S.uniteDonnee=u;
      donne=fnum(v,q.dec)+' '+u; attendu=fnum(q.rep,q.dec)+' '+q.repUnite;
      if(okN&&!okU) S.msgUnite="Le nombre est juste, mais l'unité ne l'est pas : "+q.repUnite+" et non "+u+".";
      else if(!okN&&okU) S.msgUnite="L'unité est la bonne, c'est le calcul qui est à revoir.";
      else S.msgUnite='';
      break;
    }
    case 'num': {
      const e=$('#saisie'); const v=parseNum((IN.val&&IN.val.trim())?IN.val:(e?e.value:''));
      if(isNaN(v)){ toast('Saisis une réponse chiffrée.'); return; }
      ok=Math.abs(v-q.rep)<=(q.tol||0.01)+1e-9;
      donne=fnum(v,q.dec); attendu=fnum(q.rep,q.dec)+(q.unite?' '+q.unite:'');
      S.val=v; break;
    }
    case 'qcm': case 'vf':
      ok=IN.sel===q.rep; donne=q.choix[IN.sel]; attendu=q.choix[q.rep]; break;
    case 'formule':
      ok=IN.fill.every((b,j)=>q.banque[b]===q.sol[j]);
      donne=IN.fill.map(b=>q.banque[b]).join(' '); attendu=q.sol.join('  ');
      break;
    case 'relier': ok=IN.fautes===0; attendu=q.paires.map(p=>p[0]+' → '+p[1]).join(' · ');
      donne=IN.fautes?IN.fautes+' erreur(s) d\'appariement':'toutes justes'; break;
    case 'ordre':
      ok=IN.picked.every((idx,r)=>IN.mix[idx].k===r);
      donne=IN.picked.map(i=>IN.mix[i].t).join(' → '); attendu=q.items.join(' → ');
      break;
    case 'tri':
      ok=q.items.every((it,i)=>IN.placed[i]===it.b);
      donne=q.items.filter((it,i)=>IN.placed[i]!==it.b).map(it=>it.t).join(', ')||'tout est juste';
      attendu=q.bacs.map((b,bi)=>b+' : '+q.items.filter(it=>it.b===bi).map(it=>it.t).join(', ')).join(' — ');
      break;
    case 'curseur':
      ok=Math.abs(IN.v-q.rep)<=(q.tol||1);
      donne=IN.v+' '+(q.unite||''); attendu=fnum(q.rep,q.dec||0)+' '+(q.unite||'');
      break;
    case 'grille': {
      let bon=0,tot=0;
      q.rows.forEach((r,ri)=>r.cells.forEach((c,ci)=>{ if(!c.input) return; tot++;
        const v=parseNum(IN.vals[ri+'_'+ci]||'');
        if(!isNaN(v)&&Math.abs(v-c.rep)<=Math.max(CFG.tolerance,0.01)+1e-9) bon++; }));
      ok=(bon===tot); donne=bon+' sur '+tot;
      attendu=q.rows.map(r=>r.cells.filter(c=>c.input).map(c=>fnum(c.rep,c.dec||2)).join(' / ')).join(' · ');
      break;
    }
  }
  const temps=(Date.now()-S.tQ)/1000;
  let piege=S.msgUnite||'';
  S.msgUnite='';
  if(!ok&&(q.type==='num'||q.type==='unite')&&q.err) q.err.forEach(e=>{ if(Math.abs(S.val-e.v)<=Math.max(q.tol,0.02)+1e-9) piege=e.msg; });

  let gain=0;

    S.ok++; S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    ST.serie.n=(ST.serie.n||0)+1;
    ST.serie.max=Math.max(ST.serie.max||0,ST.serie.n);
    const mult=multSerie(ST.serie.n);
    gain=Math.round((6+(q.diff||1)*4)*mult);
    if(S.aideNiv&&!S.joker) gain=Math.max(1,gain-5*S.aideNiv);
    if(S.chrono) gain=Math.round(gain*0.85);
    if(S.defi) gain*=3;
    S.xp+=gain; S.coins+=Math.round(gain/2); beep('ok');
    if(S.duel) S.duel.pts[S.duel.tour]++;
    S.errSuite=0; S.sansAide=(S.aideNiv?0:(S.sansAide||0)+1);
  } else {
    S.ko++; S.combo=0; ST.serie.n=0; S.sansAide=0; S.errSuite=(S.errSuite||0)+1;
    if(S.coeurs>0) S.coeurs--;
    beep('ko');
  }
  const st=ST.stats[q.notion]||(ST.stats[q.notion]={ok:0,ko:0,hist:[]});
  st[ok?'ok':'ko']++; st.hist.push(ok?1:0); if(st.hist.length>30) st.hist=st.hist.slice(-30);
  ST.c.total=(ST.c.total||0)+1;
  ST.c.sansAide=(ok&&!S.aideNiv)?(ST.c.sansAide||0)+1:0;
  if(ok&&q.auto) ST.c.auto=(ST.c.auto||0)+1;
  if(ok&&q.notion==='N7') ST.c.N7ok=(ST.c.N7ok||0)+1;
  if(ok&&q.notion==='N8') ST.c.N8ok=(ST.c.N8ok||0)+1;
  if(ok&&q.gid==='vf') ST.c.vfok=(ST.c.vfok||0)+1;
  if(ok&&S.kind==='erreurs') ST.c.repare=(ST.c.repare||0)+1;
  if(q.gid&&q.gid!=='vf'&&q.gid!=='boss'&&!String(q.gid).startsWith('dossier')){
    if(!ST.boites||typeof ST.boites!=='object') ST.boites={};

    else if(S.kind==='revisionJour'&&ST.boites[q.gid]){

      if(b>=4){ delete ST.boites[q.gid]; ST.c.sortiesRev=(ST.c.sortiesRev||0)+1; } else ST.boites[q.gid]={b:b,d:dateDans([1,3,7,15][b])};
    }
  }
  if(q.gid&&q.gid!=='vf'&&q.gid!=='boss'){
    if(!ok){ if(!ST.erreurs.includes(q.gid)) ST.erreurs.unshift(q.gid); }
    else { const k=ST.erreurs.indexOf(q.gid); if(k>=0) ST.erreurs.splice(k,1); }
    if(ST.erreurs.length>30) ST.erreurs=ST.erreurs.slice(0,30);
  }
  const entree={d:new Date().toLocaleString('fr-FR'),mode:S.kind,type:q.type,notion:q.notion,diff:q.diff||1,
    enonce:((q.court?'':(q.enonce+' — '))+(q.prompt||q.quest||'')).replace(/\s+/g,' '),
    att:attendu,don:donne,ok:ok,t:Math.round(temps),aide:S.aideNiv};

  saveSt();
  checkBadges({ev:'rep',ok,streak:S.combo,kind:S.kind,sessionOk:S.ok,temps,notion:q.notion});

  if(!ok) noteDiag(piege);
  saveSt();
  S.encours=true;
  feedback(ok,attendu,piege,gain);
}

  const bar=q.bar?`<div class="barviz"><i style="width:${Math.min(100,q.bar.p/q.bar.t*100)}%"></i></div>`:'';
  const steps=(q.steps&&q.steps.length)?`<div class="steps">${q.steps.map(s=>`<div class="step"><span class="lab">${esc(s[0])}</span><span class="val">${esc(s[1])}</span></div>`).join('')}</div>`:'';
  const dur=(S.avecCoeurs&&S.coeurs<=0);
  sheet(ok?'ok':'ko',`
    <div class="verdict">
      <span class="ic">${ok?'✓':'✕'}</span>
      <span class="grow">
        <b>${ok?(gain?'Bonne réponse · +'+gain+' XP':'Bonne réponse'):'Réponse attendue'}</b>
        ${ok?'':`<span class="attendu">${hl(attendu)}</span>`}
      </span>
    </div>
    ${ok?blocMethode(q.notion):`<div class="correction">
        <div class="ctitre">La correction, étape par étape</div>
        ${piege?`<div class="cpiege"><b>Erreur classique.</b> ${hl(piege)}</div>`:''}
        ${evo}${bar}${steps}
        ${q.concl?`<div class="cconcl">${hl(q.concl)}</div>`:''}
        <details class="detail"><summary>Revoir la méthode générale</summary>${blocMethode(q.notion)}</details>
      </div>`}
    ${ok&&q.concl?`<div class="concl">${hl(q.concl)}</div>`:''}
    ${ok&&(steps||evo)?`<details class="detail"><summary>Revoir le calcul</summary>${evo}${bar}${steps}</details>`:''}
    <button class="btn wide ${ok?'':'danger'}" id="btnNext" onclick="continuer()">${dur?'Voir le bilan':(ok?'Continuer':'J\'ai compris')}</button>`);
  renderTop('lecon');
  const b=$('#btnNext'); if(b&&LAY!=='phone') b.focus();
}
function continuer(){
  const q=S.q; S.encours=false;
  const rate=!(S.log.length&&S.log[S.log.length-1].ok);
  if(rate&&S.requeue&&!S.infini){
    const g=GEN.concat(AUTO).find(x=>x.id===q.gid);
    S.file.push(g?build(g):q);
  }
  if(S.avecCoeurs&&S.coeurs<=0) return fin(true);
  if(S.duel) S.duel.tour=1-S.duel.tour;
  if(!S.infini) S.i++;
  hideSheet(); next();
}
function fin(echec){
  if(S.fini) return; S.fini=true; clearInterval(TIMER); hideSheet();
  const dur=Math.round((Date.now()-S.t0)/1000);
  let couronne=false;
  if(S.kind==='position') S.pos=bilanPositionnement();
  if(S.kind==='test'){
    S.reussi=(S.ok>=16);
    if(S.reussi&&S.cible){ ST.debloque[S.cible]=Date.now(); (S.couvre||[]).forEach(u=>{ ST.debloque[u]=Date.now(); }); }
  }
  if(!echec&&['methode','reflexes','application','situations','revision','epreuve'].includes(S.kind)){
    const k=S.notion+'-'+(S.node!==undefined?S.node:LECONS.findIndex(l=>l.k===S.kind));
    if((ST.path[k]||0)<3){ ST.path[k]=(ST.path[k]||0)+1; couronne=true; }
    else ST.path[k]=3;
  }
  if(!echec&&S.kind==='dossier'&&S.notion) ST.dossiers[S.notion]=(ST.dossiers[S.notion]||0)+1;
  if(!echec&&!S.infini){
    S.bonus=(S.ko===0?30:10)+(couronne?20:0);
    S.xp+=S.bonus;
  }
  if(!echec){ gagnerXp(S.xp); ST.coins+=S.coins; ST.c.coinsTot=(ST.c.coinsTot||0)+S.coins; }
  ST.parties++; ST.tempsJeu+=dur;
  if(S.kind==='rush') ST.meilleurRush=Math.max(ST.meilleurRush,S.ok);
  if(S.kind==='survie') ST.meilleurSurvie=Math.max(ST.meilleurSurvie,S.ok);
  if(S.kind==='reflexesLibre') ST.meilleurReflexe=Math.max(ST.meilleurReflexe,S.ok);

  ST.historique.unshift({d:new Date().toLocaleDateString('fr-FR'),mode:S.kind,ok:S.ok,ko:S.ko,xp:echec?0:S.xp,dur});
  if(ST.historique.length>20) ST.historique=ST.historique.slice(0,20);
  saveSt();
  checkBadges({ev:'fin',ok:false,ko:S.ko,streak:S.maxCombo,kind:S.kind,sessionOk:S.ok,temps:99});
  renderResult(echec,couronne,dur);
}

    const cMax=S.kind==='survie'?CFG.vies:CFG.coeurs;
    const coeurs=S.avecCoeurs
      ? `<span class="stat hearts">${'♥'.repeat(Math.max(0,S.coeurs))}${'♡'.repeat(Math.max(0,cMax-S.coeurs))}</span>`:'';

    <span class="stat xp" title="expérience">${ST.xp}</span>
    <button class="iconbtn" onclick="menu()" aria-label="Menu">☰</button>`;
}
function grade(){
  let g=GRADES[0],i=0;
  GRADES.forEach((x,k)=>{ if(ST.xp>=x.t){ g=x; i=k; } });
  const nx=GRADES[i+1]||null;
  const pc=nx?Math.min(100,Math.round((ST.xp-g.t)/(nx.t-g.t)*100)):100;
  return {nom:g.n,niveau:i+1,pc,next:nx};
}

function validerAcces(n){

function bulle(n,i,horiz){
  const l=plan(n)[i], c=crowns(n,i), open=nodeOpen(n,i);

    <span class="lab">${esc(l.nom)}${c?`<br><span class="crown">${'👑'.repeat(c)}</span>`:''}</span>
  </div>`;
}
function serpent(n){
  const parLigne=(LAY==='beam')?5:5, lignes=[];
  const L=plan(n).length;
  for(let i=0;i<L;i+=parLigne) lignes.push([i,Math.min(i+parLigne,L)]);
  return `<div class="serpent">${lignes.map((r,li)=>{
    const rev=li%2===1;
    const idx=[]; for(let i=r[0];i<r[1];i++) idx.push(i);
    const cells=idx.map((i,k)=>bulle(n,i,true)+(k<idx.length-1?`<span class="fl">${rev?'←':'→'}</span>`:'')).join('');
    const desc=(li<lignes.length-1)?`<div class="sdown ${rev?'gauche':'droite'}"><span class="vfl"></span></div>`:'';
    return `<div class="srow ${rev?'rev':''}">${cells}</div>${desc}`;
  }).join('')}</div>`;
}

  const tot=S.ok+S.ko, pc=tot?Math.round(S.ok/tot*100):0;

  show(`<div class="stack">

      ${S.kind==='position'?`<div class="concl" style="text-align:left">
        ${S.pos.ouvertes.length?`Unités ouvertes d'emblée : <b class="k">${S.pos.ouvertes.join(', ')}</b>.`
          :`Aucune unité n'est validée à 2/2 : le parcours démarre à la première unité, c'est le bon endroit.`}
        <div class="tiny muted" style="margin-top:6px">${activeNotions().map(nn=>{
          const p=S.pos.par[nn.id]||{ok:0,n:0}; return nn.id+' : '+p.ok+'/'+p.n; }).join(' · ')}</div>

function suivante(){
  // la leçon proposée après celle qui vient d'être terminée
  if(!S||S.node===undefined||!S.notion) return null;
  if(S.node+1<plan(S.notion).length) return {notion:S.notion,i:S.node+1,nom:'Leçon suivante'};
  const act=activeNotions(), k=act.findIndex(x=>x.id===S.notion);
  if(k>=0&&k+1<act.length&&unitOpen(act[k+1].id)) return {notion:act[k+1].id,i:0,nom:'Unité suivante'};
  return null;
}
function leconSuivante(){
  const n=suivante(); if(!n) return renderParcours();
  if(CFG.deblocage&&!nodeOpen(n.notion,n.i)){
    toast("Cette leçon n'est pas encore ouverte."); return renderParcours();
  }
  ouvrir(n.notion,n.i);
}

      <label class="check"><input type="checkbox" ${EVAL.corrige?'checked':''} onchange="EVAL.corrige=this.checked">

function majEvalNotion(id,on){
  EVAL.notions=on?EVAL.notions.concat([id]):EVAL.notions.filter(x=>x!==id);
}
function genererEval(){
  EVAL.titre=$('#e_t').value||'Évaluation'; EVAL.etab=$('#e_e').value; EVAL.classe=$('#e_c').value;
  EVAL.duree=$('#e_d').value; EVAL.bareme=+$('#e_b').value||20;
  EVAL.nb=Math.max(4,Math.min(24,+$('#e_n').value||10)); EVAL.niv=+$('#e_v').value;
  if(!EVAL.notions.length) return toast('Choisis au moins une notion.');
  let src=AUTO.concat(GEN).filter(g=>EVAL.notions.includes(g.n)&&TYPES_PAPIER.includes(TYPE_OF[g.id]));
  if(EVAL.niv===1) src=src.filter(g=>g.d===1);
  else if(EVAL.niv===2) src=src.filter(g=>g.d<=2);
  else if(EVAL.niv===3) src=src.filter(g=>g.d>=2);
  if(src.length<3) return toast("Pas assez de questions pour ces réglages.");
  // on équilibre les formes de questions, comme dans les leçons
  const par={};
  src.forEach(g=>{ const t=TYPE_OF[g.id]; (par[t]=par[t]||[]).push(g); });
  const types=shuffle(Object.keys(par)), pris=[], qs=[];
  let garde=0;
  while(qs.length<EVAL.nb&&garde++<EVAL.nb*12){
    for(const t of types){
      if(qs.length>=EVAL.nb) break;
      const d=par[t].filter(g=>!pris.includes(g.id));
      const g=d.length?pick(d):pick(par[t]);
      pris.push(g.id); qs.push(build(g));
    }
  }
  // les questions faciles d'abord, les situations longues ensuite
  EVAL.questions=qs.sort((a,b)=>(a.diff||1)-(b.diff||1));
  renderFeuille();
}

    case 'formule': {

      return `<div class="pformule">${m}</div>
        <div class="pbanque">Étiquettes disponibles : ${q.banque.map(t=>`<b>${esc(t)}</b>`).join(' · ')}</div>`;
    }
    case 'relier':
      return `<table class="prelier"><tbody>${q.paires.map((p,i)=>{
        const d=shuffle(q.paires.map(x=>x[1]));
        return '';
      }).join('')}</tbody></table>

        <div>${q.paires.map(p=>`<div class="pcase">${esc(p[0])}</div>`).join('')}</div>
        <div>${shuffle(q.paires.map(p=>p[1])).map(t=>`<div class="pcase">${esc(t)}</div>`).join('')}</div>
      </div>
      <div class="pnote">Relier chaque élément de gauche à son équivalent de droite.</div>`;
    case 'ordre':
      return `<div class="pordre">${shuffle(q.items.slice()).map(t=>`<div class="pligne"><span class="pnum">☐</span>${esc(t)}</div>`).join('')}</div>
        <div class="pnote">Numéroter de 1 à ${q.items.length} dans l'ordre de la méthode.</div>`;
    case 'tri':
      return `<div class="pdeux"><div><b>${esc(q.bacs[0])}</b><div class="pzone"></div></div>
        <div><b>${esc(q.bacs[1])}</b><div class="pzone"></div></div></div>
        <div class="pnote">À classer : ${shuffle(q.items.map(i=>i.t)).map(t=>`<b>${esc(t)}</b>`).join(' · ')}</div>`;
    case 'grille':
      return `<table class="pgrille"><thead><tr>${q.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${q.rows.map(r=>`<tr>${r.cells.map(c=>c.input?'<td class="pvide"></td>':`<td>${esc(c.v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'unite':
      return `<div class="preponse">Réponse : ${LIGNE} &nbsp; Unité : ${LIGNE}</div>`;
    default:
      return `<div class="preponse">Réponse : ${LIGNE}${q.unite?' <b>'+esc(q.unite)+'</b>':''}</div>
        <div class="pcalcul">Calcul :</div>`;

}
function paperSol(q){
  switch(q.type){
    case 'qcm': case 'vf': return esc(q.choix[q.rep]);
    case 'formule': return esc(q.sol.join('  '));
    case 'relier': return q.paires.map(p=>esc(p[0])+' → '+esc(p[1])).join(' ; ');
    case 'ordre': return q.items.map((t,i)=>(i+1)+'. '+esc(t)).join(' ; ');
    case 'tri': return q.bacs.map((b,i)=>esc(b)+' : '+q.items.filter(x=>x.b===i).map(x=>esc(x.t)).join(', ')).join(' | ');
    case 'grille': return q.rows.map(r=>r.cells.filter(c=>c.input).map(c=>fnum(c.rep,c.dec||2)).join(' / ')).join(' ; ');
    case 'unite': return fnum(q.rep,q.dec)+' '+esc(q.repUnite);
    default: return fnum(q.rep,q.dec)+(q.unite?' '+esc(q.unite):'');
  }
}

function b64(o){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }catch(e){ return ''; } }
function deb64(t){ try{ return JSON.parse(decodeURIComponent(escape(atob(t.trim())))); }catch(e){ return null; } }
function codeSeance(){
  const st={};
  activeNotions().forEach(n=>{ const x=ST.stats[n.id]||{ok:0,ko:0}; st[n.id]=[x.ok,x.ko,unitCrowns(n.id)]; });
  return b64({v:1,p:PROFIL||CFG.eleve||'',c:CFG.classe||'',d:today(),x:ST.xp,t:ST.c.total||0,
    s:ST.serie.max||0,b:Object.keys(ST.badges).length,n:st,g:ST.diag||{}});
}

      <textarea id="codes" placeholder="Collez un ou plusieurs codes, un par ligne" style="width:100%;min-height:110px;font-family:var(--mono);font-size:.8rem;padding:10px;border:2px solid var(--line-2);border-radius:10px"></textarea>

      <div class="card"><h3 style="margin-bottom:8px">Réussite de la classe par notion</h3>

      ${diag?`<div class="card"><h3 style="margin-bottom:8px">Erreurs les plus fréquentes dans la classe</h3>
        <ul style="margin:0;padding-left:20px">${diag}</ul></div>`:''}
      <div class="row"><button class="btn ghost grow small" onclick="exportClasse()">Exporter la classe (CSV)</button>
        <button class="btn ghost grow small" onclick="window.print()">Imprimer</button></div>`
    :'<p class="muted">Aucun code importé pour le moment.</p>'}
  </div>`);
  renderTop('accueil');

function importerCodes(){
  const t=$('#codes'); if(!t) return;
  let n=0,ko=0;
  t.value.split(/\n+/).forEach(l=>{
    if(!l.trim()) return;
    const o=deb64(l);
    if(o&&o.n){ CLASSE.push(o); n++; } else ko++;
  });
  toast(n+' élève(s) ajouté(s)'+(ko?' · '+ko+' code(s) illisible(s)':''));
  renderClasse();
}
function exportClasse(){
  const h=['Eleve','Classe','Date','XP','Questions','Meilleure serie','Badges','Couronnes']
    .concat(activeNotions().map(n=>n.id+' reussite %'));
  const l=[h.join(';')];
  CLASSE.forEach(e=>{
    const base=[e.p,e.c,e.d,e.x,e.t,e.s,e.b,activeNotions().reduce((a,n)=>a+((e.n[n.id]||[0,0,0])[2]),0)];
    activeNotions().forEach(n=>{ const v=e.n[n.id]||[0,0,0]; const tt=v[0]+v[1];
      base.push(tt?Math.round(v[0]/tt*100):''); });
    l.push(base.join(';'));
  });
  dl(new Blob(['\ufeff'+l.join('\r\n')],{type:'text/csv;charset=utf-8'}),'classe-'+slug(CFG.classe||'suivi')+'.csv');
}

function renderApropos(){

      <b>1. Le parcours.</b> ${activeNotions().length} unités, une par notion, de <b class="k">${LECONS.length} leçons</b> chacune.

      <b>2. Une leçon.</b> Une dizaine de questions. Une réponse fausse <b>revient plus loin dans la leçon</b> :
      il faut la réussir pour terminer. La barre du haut n'avance que sur les bonnes réponses.<br><br>

    <h2>L'unité 1 : déterminer le coefficient</h2>

    d'abord avec des dizaines, puis des entiers, puis des décimaux. Chaque salve s'ouvre par une question de réflexion — prévoir si la valeur
    montera ou descendra avant de calculer — et l'unité se termine par une leçon spéciale TVA (20 %, 10 %, 5,5 %).</p>
    <ul>${plan('N3').map((l,i)=>`<li><b>${i+1}. ${esc(l.nom)}</b> — ${esc(l.txt)}</li>`).join('')}</ul>
    <h2>Les dix leçons des autres unités</h2>

      <li><b>Formule à trous</b> — on complète une formule avec une banque de mots.</li>
      <li><b>Appariement</b> — on relie un taux à son coefficient, un prix HT à son prix TTC.</li>
      <li><b>Remise en ordre</b> — on remet les étapes d'une méthode dans le bon ordre.</li>
      <li><b>Tri en deux colonnes</b> — hausse ou baisse, multiplier ou diviser, marge ou marque.</li>
      <li><b>Tableau à compléter</b> et <b>estimation au curseur</b>.</li>
      <li><b>Vrai ou faux</b> — les pièges classiques des pourcentages.</li>

    <h2>Les points et les grades</h2>
    <ul>
      <li>Chaque bonne réponse rapporte des XP, davantage sur les questions difficiles.</li>
      <li><b>La série</b> compte les bonnes réponses d'affilée dans une même unité. Elle repart de zéro à la première erreur.
        À <b class="k">10</b> d'affilée les XP sont multipliés par <b class="k">×1,1</b>, à <b class="k">20</b> par <b class="k">×1,2</b>, et ainsi de suite.</li>
      <li>Terminer une leçon donne un bonus, doublé si elle est sans faute.</li>
      <li>${GRADES.length} grades à gravir, de ${esc(GRADES[0].n)} à ${esc(GRADES[GRADES.length-1].n)}.</li>
      <li>${BADGES.length} badges et une cagnotte de points de fidélité, échangeable contre des jokers et des thèmes de couleurs.</li>
    </ul>

    <h2>Les dossiers</h2>
    <p>${DOSSIERS.length} situations complètes à traiter d'un bout à l'autre, sans cœur ni chronomètre. Deux d'entre elles s'appuient sur des données publiques
    (le SMIC publié par l'Insee, les effectifs scolaires publiés par la DEPP) ; les autres sont des cas professionnels dont les valeurs changent à chaque lancement.</p>

    <h2>Pour l'enseignant</h2>
    <ul>
      <li>Le menu <b>Réglages</b> permet de changer le nom du programme, le texte d'accueil, le logo, les couleurs et la disposition.</li>
      <li>Les onglets <b>Identité</b> et <b>Pédagogie</b> sont protégés par un code, pour que les réglages de la classe ne bougent pas en séance.</li>
      <li>On peut désactiver des notions, des types d'exercices, régler la longueur des leçons, le nombre de cœurs, la tolérance d'arrondi.</li>
      <li>Les réglages s'exportent en fichier pour être distribués à toute la classe.</li>
      <li>Les résultats s'exportent en fiche bilan Word et en tableau CSV pour Excel.</li>
    </ul>

    <h2>Ce qui aide à retenir dans la durée</h2>
    <ul>
      <li><b>Révision du jour.</b> Une question ratée revient sur l'accueil le lendemain, puis 3, 7 et 15 jours plus tard si elle est réussie. Réussie quatre fois, elle disparaît.</li>
      <li><b>Niveau adapté.</b> Trois bonnes réponses d'affilée sans aide relèvent le niveau de la question suivante ; deux erreurs de suite l'abaissent.</li>
      <li><b>Test de positionnement</b> au premier lancement, pour ouvrir directement les unités déjà maîtrisées.</li>

    <h2>Accessibilité</h2>

      <li>Quatre dispositions (téléphone, ordinateur, vidéoprojection, automatique), animations désactivables, navigation au clavier.</li>

    <h2>Installer sur un téléphone</h2>
    <p>Si le fichier est hébergé sur un site (GitHub Pages, ENT) avec le petit fichier <span class="num">sw.js</span> à ses côtés,
    le navigateur propose « Ajouter à l'écran d'accueil » : l'application s'ouvre alors en plein écran, hors connexion, comme une application native.
    Ouvert directement depuis une clé USB ou un dossier, le fichier fonctionne aussi, sans installation.</p>

    <h2>Techniquement</h2>
    <p>Version <b>${VERSION}</b>. Un seul fichier HTML, sans installation, sans connexion, sans compte. La banque compte <b class="k">${nbTrames} trames</b> de questions
    dont les valeurs sont tirées au hasard : deux parties ne proposent jamais la même série. Le format de sauvegarde est versionné (schéma ${SCHEMA}) :
    les mises à jour futures conservent la progression.</p>
  </div>`);
  renderTop('accueil');
}
function renderConfid(){
  show(`<div class="stack info">
    <button class="btn ghost small" style="align-self:flex-start" onclick="renderParcours()">← Parcours</button>
    <h1>Politique de confidentialité</h1>
    <p class="muted">Dernière mise à jour : à la date de génération de ce fichier.</p>

    <div class="encadre"><b>L'essentiel.</b> Cette application fonctionne entièrement sur l'appareil.
    Aucune donnée n'est envoyée sur Internet, aucun compte n'est nécessaire, il n'y a ni publicité ni mesure d'audience.</div>

    <h2>Quelles données sont enregistrées</h2>
    <ul>
      <li><b>La progression</b> : points d'expérience, couronnes, badges, série de bonnes réponses, statistiques de réussite par notion et par type d'exercice.</li>
      <li><b>Le journal des réponses</b> : les 400 dernières questions traitées, avec la réponse attendue, la réponse donnée, le temps et les aides utilisées.</li>
      <li><b>Les réglages</b> : nom du programme, texte d'accueil, couleurs, disposition, notions actives, code enseignant, et le cas échéant le logo importé.</li>
      <li><b>Le nom de l'élève et la classe</b>, uniquement s'ils ont été saisis dans les réglages pour figurer sur les fiches bilan.</li>
    </ul>

    <h2>Où elles sont enregistrées</h2>
    <p>Dans le stockage local du navigateur (<i>localStorage</i>), sur l'appareil utilisé, sous les clés <span class="num">pxp3_cfg</span> et <span class="num">pxp3_state</span>.
    Elles ne quittent jamais l'appareil : il n'y a pas de serveur, pas de base de données distante, pas de synchronisation.</p>
    <p>En navigation privée, ou si le stockage local est désactivé, l'application fonctionne mais la progression est perdue à la fermeture. Un message le signale au démarrage.</p>

    <h2>Qui peut y accéder</h2>
    <p>Toute personne utilisant la même session de navigateur sur le même appareil. Sur un poste partagé en salle informatique, la progression d'un élève reste donc visible
    par le suivant : il est recommandé d'utiliser le bouton de réinitialisation en fin de séance, ou une session par élève.</p>

    <h2>Cookies et mesure d'audience</h2>
    <p>Aucun cookie n'est déposé. Aucun traceur, aucun outil de statistiques, aucune requête réseau n'est effectuée par l'application.</p>

    <h2>Fichiers exportés</h2>
    <p>Les fiches bilan Word, les tableaux CSV et les fichiers de réglages sont fabriqués dans le navigateur et téléchargés directement sur l'appareil.
    Attention : un fichier de réglages exporté contient le code enseignant. Modifiez-le avant de le distribuer aux élèves.</p>

    <h2>Liens externes</h2>
    <p>Le pied de page contient deux liens vers des sites tiers (LinkedIn et une page de projets hébergée sur GitHub Pages).
    Les ouvrir vous fait quitter l'application ; ces sites appliquent alors leurs propres règles de confidentialité.</p>

    <h2>Effacer ses données</h2>
    <ul>
      <li>Depuis l'application : <b>Réglages → Données → Effacer la progression</b>, ou <b>Tout réinitialiser</b> pour y ajouter les réglages.</li>
      <li>Depuis le navigateur : effacer les données de site pour ce fichier.</li>
      <li>Supprimer le fichier HTML ne suffit pas à effacer le stockage local du navigateur.</li>
    </ul>

    <h2>Mineurs</h2>
    <p>L'application est destinée à un usage scolaire. Elle ne demande aucune donnée personnelle pour fonctionner : le champ « nom de l'élève »
    est facultatif et sert uniquement à l'impression des bilans. Il peut rester vide ou contenir un prénom seul.</p>
  </div>`);
  renderTop('accueil');
}

function codeBloque(){
  if(!ST.code||ST.code.date!==today()){ ST.code={date:today(),n:0}; saveSt(); }
  return ST.code.n>=3;
}
function codeRate(){
  if(!ST.code||ST.code.date!==today()) ST.code={date:today(),n:0};
  ST.code.n++; saveSt();
  const reste=3-ST.code.n;
  if(reste>0){ toast('Code incorrect — '+reste+' essai'+(reste>1?'s':'')+' restant'+(reste>1?'s':'')); return; }
  modal(`<h2>Saisie bloquée</h2>
    <p>Trois codes erronés aujourd'hui. La saisie est bloquée jusqu'à demain.</p>
    <div class="encadre" style="margin:12px 0"><b>Indice</b><br>
      <span class="k" style="font-size:1.2rem">obligatoire / laïque</span></div>
    <button class="btn wide" onclick="closeModal()">Fermer</button>`);
}
function testCode(d){
  if(codeBloque()){ toast("Saisie bloquée jusqu'à demain."); return; }
  if($('#cp').value===String(CFG.codeProf)){ ST.code={date:today(),n:0}; saveSt(); PROF=true; renderSettings(d); }
  else codeRate();
}

    <h3 style="margin:18px 0 6px">Entraînement libre</h3>${lb}
    <h3 style="margin:18px 0 10px">Paramètres</h3>
    <div class="field"><label for="p_nb">Questions par leçon</label><input type="number" id="p_nb" min="4" max="20" value="${CFG.longueurLecon}"></div>
    <div class="field"><label for="p_co">Cœurs par leçon (0 = illimité)</label><input type="number" id="p_co" min="0" max="9" value="${CFG.coeurs}"></div>
    <div class="field"><label for="p_ob">Objectif XP quotidien</label><input type="number" id="p_ob" min="10" max="300" step="10" value="${CFG.objectifXP}"></div>
    <div class="field"><label for="p_ch">Durée du Rush Caisse (secondes)</label><input type="number" id="p_ch" min="30" max="300" value="${CFG.chrono}"></div>
    <div class="field"><label for="p_vi">Vies en mode Survie</label><input type="number" id="p_vi" min="1" max="9" value="${CFG.vies}"></div>
    <div class="field"><label for="p_to">Tolérance sur les réponses</label><select id="p_to">
      <option value="0.01" ${CFG.tolerance==0.01?'selected':''}>Au centime près (0,01)</option>
      <option value="0.1" ${CFG.tolerance==0.1?'selected':''}>Souple (0,1)</option>
      <option value="0.001" ${CFG.tolerance==0.001?'selected':''}>Exacte</option></select></div>
    <label class="check"><input type="checkbox" ${CFG.reprise?'checked':''} onchange="CFG.reprise=this.checked;saveCfg()">
      <span class="grow">Reprise des erreurs dans la leçon<small>Une question ratée revient plus loin et doit être réussie.</small></span></label>
    <label class="check"><input type="checkbox" ${CFG.aides?'checked':''} onchange="CFG.aides=this.checked;saveCfg()">
      <span class="grow">Coups de pouce<small>Deux niveaux d'aide par question.</small></span></label>
    <label class="check"><input type="checkbox" ${CFG.calculatrice?'checked':''} onchange="CFG.calculatrice=this.checked;saveCfg()"><span class="grow">Calculatrice intégrée</span></label>
    <label class="check"><input type="checkbox" ${CFG.profils?'checked':''} onchange="CFG.profils=this.checked;saveCfg()">
      <span class="grow">Profils élèves<small>Sur un poste partagé, chacun retrouve sa progression. À décocher sur une tablette personnelle.</small></span></label>
    <label class="check"><input type="checkbox" ${CFG.deblocage?'checked':''} onchange="CFG.deblocage=this.checked;saveCfg()">
      <span class="grow">Déblocage progressif<small>Décoché, tout le parcours est ouvert.</small></span></label>
    <div class="field" style="margin-top:16px"><label for="p_code">Code enseignant</label><input type="text" id="p_code" value="${esc(CFG.codeProf)}"></div>
    <button class="btn wide" onclick="savePeda()">Enregistrer</button></div>`;
}
function savePeda(){
  CFG.longueurLecon=Math.max(4,Math.min(20,+$('#p_nb').value||8));
  CFG.coeurs=Math.max(0,Math.min(9,+$('#p_co').value||0));
  CFG.objectifXP=Math.max(10,Math.min(300,+$('#p_ob').value||40));
  CFG.chrono=Math.max(30,Math.min(300,+$('#p_ch').value||90));
  CFG.vies=Math.max(1,Math.min(9,+$('#p_vi').value||3));
  CFG.tolerance=+$('#p_to').value; CFG.codeProf=$('#p_code').value||'1882';
  saveCfg(); toast('Réglages enregistrés');
}
function tabData(){
  return `<div class="card stack">
    <h3>Partager votre version</h3>
    <p class="tiny muted">Exportez vos réglages pour les distribuer à la classe : chaque élève importe le fichier et retrouve votre configuration.</p>
    <div class="row"><button class="btn ghost grow small" onclick="exportCfg()">Exporter les réglages</button>
      <label class="btn ghost grow small" style="cursor:pointer">Importer<input type="file" accept=".json" style="display:none" onchange="importCfg(this)"></label></div>
    <h3 style="margin-top:8px">Ma progression complète</h3>
    <p class="tiny muted">Pour changer de poste ou de téléphone : on emporte tout, XP, couronnes, badges, historique.</p>
    <div class="row"><button class="btn ghost grow small" onclick="exportProgres()">Exporter ma progression</button>
      <label class="btn ghost grow small" style="cursor:pointer">Importer<input type="file" accept=".json" style="display:none" onchange="importProgres(this)"></label></div>
    <h3 style="margin-top:8px">Résultats de l'élève</h3>
    <div class="row"><button class="btn ghost grow small" onclick="exportWord()">Fiche bilan (Word)</button>
      <button class="btn ghost grow small" onclick="exportCsv()">Détail (Excel/CSV)</button></div>
    <h3 style="margin-top:8px">Remise à zéro</h3>
    <p class="tiny muted">Efface la progression, les couronnes et les badges. Les réglages sont conservés.</p>
    <button class="btn ghost wide small" onclick="resetProgres()">Effacer la progression</button>
    <button class="btn ghost wide small" onclick="resetTout()">Tout réinitialiser</button></div>`;
}
function resetProgres(){
  modal(`<h2>Effacer la progression ?</h2><p class="muted">XP, couronnes, badges et statistiques seront perdus. Action définitive.</p>
    <div class="row"><button class="btn ghost grow" onclick="closeModal()">Annuler</button>
    <button class="btn grow danger" onclick="doReset(false)">Effacer</button></div>`);
}
function resetTout(){
  modal(`<h2>Tout réinitialiser ?</h2><p class="muted">La progression et tous les réglages reviendront à leur état d'origine.</p>
    <div class="row"><button class="btn ghost grow" onclick="closeModal()">Annuler</button>
    <button class="btn grow danger" onclick="doReset(true)">Tout réinitialiser</button></div>`);
}
function doReset(all){
  ST=JSON.parse(JSON.stringify(ST_DEF)); NOTIONS.forEach(n=>ST.stats[n.id]={ok:0,ko:0,hist:[]});
  if(all){ CFG=JSON.parse(JSON.stringify(CFG_DEF)); saveCfg(); }
  saveSt(); closeModal(); applyTheme(); renderParcours(); toast('Réinitialisation effectuée');
}

/* ══════════════════════════════════════════════════════════════
   16. EXPORTS
   ══════════════════════════════════════════════════════════════ */
function dl(blob,nom){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u; a.download=nom; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'programme'; }
function exportProgres(){
  dl(new Blob([JSON.stringify({type:'pxp-progression',v:SCHEMA,profil:PROFIL,date:today(),etat:ST},null,1)],{type:'application/json'}),
     'progression-'+slug(PROFIL||CFG.eleve||'eleve')+'-'+today()+'.json');
}
function importProgres(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||o.type!=='pxp-progression'||!o.etat) throw 0;
      modal(`<h2>Importer cette progression ?</h2>
        <p class="muted">${o.profil?'Profil « '+esc(o.profil)+' », ':''}exportée le ${esc(o.date||'?')} : ${o.etat.xp||0} XP, ${Object.keys(o.etat.badges||{}).length} badges.
        Elle remplacera la progression actuelle${PROFIL?' de '+esc(PROFIL):''}.</p>
        <div class="row"><button class="btn ghost grow" onclick="closeModal()">Annuler</button>
          <button class="btn grow" id="okImp">Remplacer</button></div>`);
      $('#okImp').onclick=()=>{ ST=deepMerge(ST_DEF,migrer(o.etat)); NOTIONS.forEach(n=>{ if(!ST.stats[n.id]) ST.stats[n.id]={ok:0,ko:0,hist:[]}; });
        saveSt(); closeModal(); renderParcours(); toast('Progression importée'); };
    }catch(e){ toast('Fichier illisible'); }
  };
  r.readAsText(f);
}
function exportCfg(){ dl(new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'}),'reglages-'+slug(CFG.nom)+'.json'); }
function importCfg(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ CFG=deepMerge(CFG_DEF,JSON.parse(r.result)); saveCfg(); applyTheme(); renderSettings('apparence'); toast('Réglages importés'); }
    catch(e){ toast('Fichier illisible'); } };
  r.readAsText(f);
}
function exportCsv(){
  const l=[['Date','Lecon','Type','Notion','Difficulte','Enonce','Reponse attendue','Reponse donnee','Resultat','Temps (s)','Aides'].join(';')];
  ST.log.forEach(x=>l.push([x.d,x.mode,x.type,x.notion,x.diff,'"'+String(x.enonce).replace(/"/g,'""')+'"',
    '"'+String(x.att).replace(/"/g,'""')+'"','"'+String(x.don).replace(/"/g,'""')+'"',x.ok?'juste':'faux',x.t,x.aide].join(';')));
  dl(new Blob(['\ufeff'+l.join('\r\n')],{type:'text/csv;charset=utf-8'}),'resultats-'+slug(CFG.nom)+'.csv');
}
function exportWord(){
  const g=grade();
  const rows=NOTIONS.filter(n=>CFG.notions[n.id]).map(n=>{
    const st=ST.stats[n.id]||{ok:0,ko:0},t=st.ok+st.ko;
    return `<tr><td>${n.id} — ${esc(n.nom)}</td><td align="right">${st.ok}</td><td align="right">${t}</td>
      <td align="right">${t?Math.round(st.ok/t*100)+' %':'—'}</td><td align="center">${unitCrowns(n.id)}/${CROWNS_MAX}</td></tr>`;
  }).join('');
  const f=ST.log.filter(x=>!x.ok).slice(-25).map(x=>`<tr><td>${esc(x.notion)}</td><td>${esc(x.enonce)}</td><td>${esc(x.don)}</td><td><b>${esc(x.att)}</b></td></tr>`).join('');
  const bg=BADGES.filter(b=>ST.badges[b.id]).map(b=>esc(b.nom)).join(' · ')||'aucun pour le moment';
  const doc=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${esc(CFG.nom)}</title><style>
body{font-family:Calibri,sans-serif;font-size:11pt;line-height:1.5;margin:2cm}
h1{font-size:18pt;color:${CFG.couleurs.primary};margin:0 0 4pt;border-bottom:2pt solid ${CFG.couleurs.primary};padding-bottom:6pt}
h2{font-size:13pt;color:${CFG.couleurs.primary};margin:18pt 0 6pt}
.meta{font-size:9.5pt;color:#666;margin-bottom:14pt}
table{border-collapse:collapse;width:100%;font-size:10pt}
th,td{border:.5pt solid #bbb;padding:5pt 6pt;text-align:left;vertical-align:top}
th{background:#eee;font-size:9pt}
.k{background:#f5f5f5;padding:8pt;font-size:10pt}
.foot{margin-top:20pt;border-top:.5pt solid #ccc;padding-top:6pt;font-size:8pt;color:#888}</style></head><body>
<h1>${esc(CFG.nom)} — fiche bilan</h1>
<p class="meta">${CFG.eleve?'Élève : '+esc(CFG.eleve)+' &nbsp;|&nbsp; ':''}${CFG.classe?'Classe : '+esc(CFG.classe)+' &nbsp;|&nbsp; ':''}Édité le ${new Date().toLocaleDateString('fr-FR')}</p>
<p class="k">Grade : <b>${esc(g.nom)}</b> (niveau ${g.niveau}) &nbsp;|&nbsp; ${ST.xp} XP &nbsp;|&nbsp; ${ST.parties} leçons &nbsp;|&nbsp; ${ST.c.total||0} questions &nbsp;|&nbsp; ${mmss(ST.tempsJeu)} de travail</p>
<h2>Résultats par notion</h2>
<table><tr><th>Notion</th><th>Réussies</th><th>Traitées</th><th>Taux</th><th>Couronnes</th></tr>${rows}</table>
<h2>Badges obtenus</h2><p>${bg}</p>
${f?`<h2>Questions à retravailler</h2><table><tr><th>Notion</th><th>Question</th><th>Réponse donnée</th><th>Réponse attendue</th></tr>${f}</table>`:''}
<p class="foot">${esc(CFG.nom)} — ${esc(CFG.sousTitre)}. Document généré hors connexion depuis l'application.</p></body></html>`;
  dl(new Blob(['\ufeff',doc],{type:'application/msword'}),'bilan-'+slug(CFG.eleve||CFG.nom)+'.doc');
}

/* ══════════════════════════════════════════════════════════════
   17. DÉMARRAGE
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if($('#modal').classList.contains('on')){
    if(!$('#calcExp')) return;               // une autre fenêtre : on ne touche à rien
    if(/^[0-9]$/.test(e.key)){ e.preventDefault(); calcTape(e.key); return; }
    const m={'*':'×','/':'÷','+':'+','-':'-','.':',',',':',','(':'(',')':')','%':'%'};
    if(m[e.key]!==undefined){ e.preventDefault(); calcTape(m[e.key]); return; }
    if(e.key==='Backspace'){ e.preventDefault(); calcTape('←'); return; }
    if(e.key==='Enter'){ e.preventDefault(); calcExe(); return; }
    return;
  }
  if(!S||S.fini) return;
  if(S.encours){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); continuer(); } return; }
  const q=S.q; if(!q) return;
  if((q.type==='qcm'||q.type==='vf')&&/^[1-9]$/.test(e.key)){
    const i=+e.key-1; if(i<q.choix.length){ choisir(i); }
    return;
  }
  if(e.key==='Enter'){ e.preventDefault(); verifier(); }
});
window.addEventListener('resize',()=>{
  const p=LAY; layout();
  if(p===LAY) return;
  if(S&&!S.fini&&!S.encours) renderItem();
  else if(ECRAN) ECRAN();
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

loadCfg();
PROFIL=lsGet(KEY_PROFIL)||'';
loadSt(); majJour();
applyTheme(); renderParcours();
// installable hors connexion quand le fichier est hébergé (GitHub Pages, ENT…) : le service worker met la page en cache
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
if(CFG.profils&&!PROFIL&&!ST.c.total) setTimeout(()=>choisirProfil(false),400);
if(!lsSet('pxp3_test','1')) setTimeout(()=>toast("Navigation privée : la progression ne sera pas conservée."),1200);
</script>
</body>
</html>
